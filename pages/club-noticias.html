<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-apple-touch.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias · Club VIP Zoorigen</title>
  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F5F3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zoorigen">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css?v=20260820">
  <link rel="stylesheet" href="../assets/css/club-mobile.css?v=20260820">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <button class="mobile-menu-btn mobile-menu-btn--float" id="mobileMenuBtn" aria-label="Menú">☰</button>
      <div class="page-header">
        <h1>📰 Noticias y novedades</h1>
        <p>Lo último de fauna, biodiversidad y conservación · Actualizado cada 6 horas</p>
      </div>

      <div id="newsContent">Cargando noticias...</div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js?v=20260820"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('inicio', session);
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();

      const noticias = await ZOORIGEN_CLUB.getNoticias(30);
      const content = document.getElementById('newsContent');

      if (noticias.length === 0) {
        content.innerHTML = `<div class="no-data" style="text-align:center;padding:60px 20px;background:var(--zoo-bg-card);border-radius:var(--zoo-radius);color:var(--zoo-text-dim);"><div style="font-size:3rem;margin-bottom:12px;">📰</div><h3 style="color:#fff;margin-bottom:8px;">Noticias en camino</h3><p>Las primeras noticias llegarán en la próxima sincronización.</p></div>`;
        return;
      }

      content.innerHTML = `<div class="news-grid news-grid--wide">${noticias.map(n => ZOORIGEN_CLUB.renderNewsCard(n)).join('')}</div>`;
    })();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
</html>
