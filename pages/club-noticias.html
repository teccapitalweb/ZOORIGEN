<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias · Club VIP Zoorigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="page-header">
        <h1>📰 Noticias y novedades</h1>
        <p>Lo último de fauna, biodiversidad y conservación · Actualizado cada 6 horas</p>
      </div>

      <div id="newsContent">Cargando noticias...</div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('inicio', session);

      const noticias = await ZOORIGEN_CLUB.getNoticias(30);
      const content = document.getElementById('newsContent');

      if (noticias.length === 0) {
        content.innerHTML = `<div class="no-data" style="text-align:center;padding:60px 20px;background:var(--zoo-bg-card);border-radius:var(--zoo-radius);color:var(--zoo-text-dim);"><div style="font-size:3rem;margin-bottom:12px;">📰</div><h3 style="color:#fff;margin-bottom:8px;">Noticias en camino</h3><p>Las primeras noticias llegarán en la próxima sincronización.</p></div>`;
        return;
      }

      content.innerHTML = `<div class="news-grid news-grid--wide">${noticias.map(n => ZOORIGEN_CLUB.renderNewsCard(n)).join('')}</div>`;
    })();
  </script>
</body>
</html>
