<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesiones en vivo · Club VIP Zoorigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="page-header"><h1>🔴 Sesiones en vivo</h1><p>Masterclasses mensuales con especialistas invitados · En directo por Zoom</p></div>
      <div id="lockedNotice"></div>
      <div id="nextSession" style="margin-bottom:30px;">Cargando...</div>
      <div class="section-title">📅 Próximas sesiones</div>
      <div class="content-list" id="sessionsList"></div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('sesiones', session);
      if (session.planStatus !== 'active') {
        document.getElementById('lockedNotice').innerHTML = `<div class="status-banner" style="margin-bottom:20px;"><span>🔒</span>Activa tu membresía para recibir el link de Zoom. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Activar →</a></div>`;
      }
      const sesiones = await ZOORIGEN_CLUB.getSesiones();
      const isActive = session.planStatus === 'active';
      const nextBox = document.getElementById('nextSession');
      const list = document.getElementById('sessionsList');

      if (sesiones.length === 0) {
        nextBox.innerHTML = `<div style="background:var(--zoo-bg-card);border:1px dashed var(--zoo-border);padding:30px;border-radius:var(--zoo-radius);text-align:center;color:var(--zoo-text-dim);">🔴 Aún no hay sesiones programadas. El equipo Zoorigen publicará las próximas masterclasses pronto.</div>`;
        list.innerHTML = '';
        return;
      }

      const next = sesiones[0];
      const linkBtn = isActive && next.zoomUrl
        ? `<a href="${next.zoomUrl}" target="_blank" class="btn-mini" style="background:var(--zoo-amber);color:#1f1d17;border:0;font-weight:700;">Entrar a Zoom →</a>`
        : !isActive ? `<a href="club-suscripcion.html" class="btn-mini" style="background:var(--zoo-orange);color:#fff;border:0;font-weight:700;">🔒 Activar para ver link</a>`
        : `<span style="color:var(--zoo-text-dim);font-size:.84rem;">Link de Zoom pendiente</span>`;

      nextBox.innerHTML = `
        <div class="card aside-card" style="background:linear-gradient(135deg,rgba(31,95,58,0.5),rgba(213,90,40,0.25));border-color:var(--zoo-amber);">
          <div class="aside-card__eyebrow" style="color:var(--zoo-amber);">● PRÓXIMA SESIÓN EN VIVO</div>
          <div class="aside-card__title" style="font-size:1.3rem;margin-top:10px;">${next.title}</div>
          <div class="aside-card__meta">${next.speaker || ''} · ${ZOORIGEN_CLUB.formatShort(next.date)} · ${next.time || '19:00'} hrs</div>
          <div class="countdown" id="liveCountdown"></div>
          ${linkBtn}
        </div>`;
      ZOORIGEN_CLUB.startCountdown('liveCountdown', next.date);

      list.innerHTML = sesiones.map(s => `
        <div class="content-item">
          <div class="content-item__thumb" style="background:var(--zoo-orange);color:#fff;">🔴</div>
          <div class="content-item__info">
            <div class="content-item__title">${s.title}</div>
            <div class="content-item__meta">${s.speaker || ''} · ${ZOORIGEN_CLUB.formatShort(s.date)} · ${s.time || '19:00'} hrs</div>
          </div>
          <span class="content-item__tag">En vivo</span>
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
