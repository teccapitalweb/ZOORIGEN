<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Especies · Club VIP Zoorigen</title>
  <meta name="theme-color" content="#1F5F3A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="club-main__header">
        <div class="club-main__greeting">
          <h1>🐆 Directorio de especies</h1>
          <p class="date">Fichas técnicas profesionales de fauna mexicana</p>
        </div>
      </div>

      <!-- Filtros y búsqueda -->
      <div class="species-filters">
        <input type="search" id="searchSpecies" placeholder="🔍 Buscar por nombre común, científico o familia..." class="species-search">
        <div class="species-filter-chips">
          <button class="species-chip is-active" data-filter="all">Todos</button>
          <button class="species-chip" data-filter="mamifero">🐾 Mamíferos</button>
          <button class="species-chip" data-filter="ave">🦅 Aves</button>
          <button class="species-chip" data-filter="reptil">🦎 Reptiles</button>
          <button class="species-chip" data-filter="anfibio">🐸 Anfibios</button>
          <button class="species-chip" data-filter="pez">🐟 Peces</button>
        </div>
        <div class="species-filter-conservation">
          <label>Estado NOM-059:</label>
          <select id="filterStatus">
            <option value="all">Todos los estados</option>
            <option value="P">P — En peligro</option>
            <option value="A">A — Amenazada</option>
            <option value="Pr">Pr — Protección especial</option>
            <option value="E">E — Probablemente extinta</option>
            <option value="NT">NT — No en riesgo</option>
          </select>
        </div>
      </div>

      <div class="species-stats" id="speciesStats"></div>

      <!-- Grid de especies -->
      <div class="species-grid" id="speciesGrid">
        <div class="species-loading">Cargando especies...</div>
      </div>
    </main>
  </div>

  <!-- Modal de ficha técnica -->
  <div id="speciesModal"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script src="../assets/js/especies-data.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('especies', session);

      let currentFilter = 'all';
      let currentStatus = 'all';
      let currentSearch = '';

      const grid = document.getElementById('speciesGrid');
      const stats = document.getElementById('speciesStats');

      function getFiltered() {
        return ESPECIES_DATA.filter(e => {
          if (currentFilter !== 'all' && e.grupo !== currentFilter) return false;
          if (currentStatus !== 'all' && e.nom059 !== currentStatus) return false;
          if (currentSearch) {
            const q = currentSearch.toLowerCase();
            const match = e.nombre.toLowerCase().includes(q)
              || e.cientifico.toLowerCase().includes(q)
              || (e.familia || '').toLowerCase().includes(q);
            if (!match) return false;
          }
          return true;
        });
      }

      function render() {
        const filtered = getFiltered();
        stats.innerHTML = `<strong>${filtered.length}</strong> especie${filtered.length !== 1 ? 's' : ''} encontrada${filtered.length !== 1 ? 's' : ''} de <strong>${ESPECIES_DATA.length}</strong> totales`;

        if (filtered.length === 0) {
          grid.innerHTML = `<div class="species-empty">🔍 No se encontraron especies con esos filtros</div>`;
          return;
        }

        grid.innerHTML = filtered.map((e, idx) => `
          <div class="species-card" onclick="showSpecies(${ESPECIES_DATA.indexOf(e)})">
            <div class="species-card__img" style="background-image:url('${e.imagen}');">
              <span class="species-card__status species-status--${e.nom059}">${e.nom059}</span>
              <span class="species-card__group">${e.grupoEmoji}</span>
            </div>
            <div class="species-card__body">
              <h3>${e.nombre}</h3>
              <div class="species-card__scientific">${e.cientifico}</div>
              <div class="species-card__family">${e.familia || ''}</div>
              <div class="species-card__meta">
                <span>📍 ${e.distribucion}</span>
                <span class="species-card__view">Ver ficha →</span>
              </div>
            </div>
          </div>
        `).join('');
      }

      // Listeners
      document.getElementById('searchSpecies').addEventListener('input', (e) => {
        currentSearch = e.target.value;
        render();
      });
      document.querySelectorAll('.species-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.species-chip').forEach(c => c.classList.remove('is-active'));
          chip.classList.add('is-active');
          currentFilter = chip.dataset.filter;
          render();
        });
      });
      document.getElementById('filterStatus').addEventListener('change', (e) => {
        currentStatus = e.target.value;
        render();
      });

      window.showSpecies = (idx) => {
        const e = ESPECIES_DATA[idx];
        const modal = document.getElementById('speciesModal');
        modal.innerHTML = `
          <div class="species-modal-backdrop" onclick="closeSpecies()"></div>
          <div class="species-modal-box">
            <button class="species-modal-close" onclick="closeSpecies()">×</button>
            <div class="species-modal-hero" style="background-image:url('${e.imagen}');">
              <div class="species-modal-hero__overlay">
                <span class="species-modal-hero__group">${e.grupoEmoji} ${e.grupoLabel}</span>
                <h2>${e.nombre}</h2>
                <div class="species-modal-hero__scientific"><em>${e.cientifico}</em></div>
                <span class="species-modal-hero__status species-status--${e.nom059}">NOM-059: ${e.nom059Label}</span>
              </div>
            </div>
            <div class="species-modal-body">

              <div class="species-info-grid">
                <div class="species-info-item">
                  <div class="species-info-label">📏 Tamaño</div>
                  <div class="species-info-value">${e.tamano || 'N/D'}</div>
                </div>
                <div class="species-info-item">
                  <div class="species-info-label">⚖️ Peso</div>
                  <div class="species-info-value">${e.peso || 'N/D'}</div>
                </div>
                <div class="species-info-item">
                  <div class="species-info-label">⏳ Longevidad</div>
                  <div class="species-info-value">${e.longevidad || 'N/D'}</div>
                </div>
                <div class="species-info-item">
                  <div class="species-info-label">🍽️ Dieta</div>
                  <div class="species-info-value">${e.dieta || 'N/D'}</div>
                </div>
              </div>

              <div class="species-section">
                <h3>📍 Distribución</h3>
                <p>${e.distribucionLarga || e.distribucion}</p>
              </div>

              <div class="species-section">
                <h3>🏞️ Hábitat</h3>
                <p>${e.habitat || 'Información no disponible'}</p>
              </div>

              <div class="species-section">
                <h3>🩺 Parámetros fisiológicos</h3>
                <div class="species-fisio-grid">
                  <div><strong>FC:</strong> ${e.fc || 'N/D'}</div>
                  <div><strong>FR:</strong> ${e.fr || 'N/D'}</div>
                  <div><strong>Temp:</strong> ${e.temp || 'N/D'}</div>
                </div>
              </div>

              ${e.patologias ? `
                <div class="species-section">
                  <h3>⚕️ Patologías comunes</h3>
                  <ul class="species-list">
                    ${e.patologias.map(p => `<li>${p}</li>`).join('')}
                  </ul>
                </div>` : ''}

              ${e.manejo ? `
                <div class="species-section">
                  <h3>🧤 Consideraciones de manejo</h3>
                  <p>${e.manejo}</p>
                </div>` : ''}

              ${e.notas ? `
                <div class="species-section species-section--note">
                  <h3>💡 Notas profesionales</h3>
                  <p>${e.notas}</p>
                </div>` : ''}

              <div class="species-modal-footer">
                <div>📖 Fuente: SEMARNAT, CONABIO, IUCN</div>
                <a href="https://wa.me/5212361113237?text=Hola%2C%20soy%20miembro%20VIP%20y%20quiero%20m%C3%A1s%20info%20sobre%20${encodeURIComponent(e.nombre)}" target="_blank" class="btn-club-outline" style="padding:10px 18px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;">
                  💬 Consultar a un especialista
                </a>
              </div>
            </div>
          </div>
        `;
        modal.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      };

      window.closeSpecies = () => {
        const modal = document.getElementById('speciesModal');
        modal.classList.remove('is-open');
        modal.innerHTML = '';
        document.body.style.overflow = '';
      };

      render();
    })();
  </script>
</body>
</html>
