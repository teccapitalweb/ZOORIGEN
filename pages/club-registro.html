<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=club-login.html?tab=crear">
  <link rel="canonical" href="https://www.zoorigen.com/pages/club-login.html?tab=crear">
  <title>Crear cuenta | Club VIP Zoorigen</title>
  <!-- Crear cuenta ahora es una pestaña de la pantalla única de acceso (club-login.html). Esta página solo redirige y conserva
       lo que traía el enlace (?ref= de una invitación, ?curso= de la guía o la encuesta, #crear), para que los enlaces ya compartidos sigan sirviendo. -->
  <script>
    (function () {
      var resto = window.location.search.replace(/^\?/, '').split('&').filter(function (p) { return p && !/^tab=/.test(p); });
      resto.unshift('tab=crear');
      window.location.replace('club-login.html?' + resto.join('&') + window.location.hash);
    })();
  </script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0f1215;
      color: #fff;
      font: 600 16px/1.5 system-ui, sans-serif;
    }
    a { color: #f2a900; }
  </style>
</head>
<body>
  <p>Llevándote a crear tu cuenta… <a href="club-login.html?tab=crear">Crear cuenta</a></p>
</body>
</html>
