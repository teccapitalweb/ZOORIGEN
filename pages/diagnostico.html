<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico · Zoorigen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e0c;
      color: #e5e9e7;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 30px 20px;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 { color: #E8A317; margin-bottom: 8px; font-size: 1.6rem; }
    .sub { color: #a0a8a4; margin-bottom: 30px; font-size: .9rem; }
    .check {
      background: #131816;
      border: 1px solid #2a3530;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .check__icon { font-size: 1.5rem; flex-shrink: 0; }
    .check__body { flex: 1; }
    .check__title { color: #fff; font-weight: 600; font-size: .98rem; margin-bottom: 4px; }
    .check__detail { color: #a0a8a4; font-size: .84rem; line-height: 1.5; }
    .check__detail code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; color: #E8A317; font-size: .82rem; }
    .check--pass { border-color: rgba(111,191,115,0.3); background: rgba(111,191,115,0.05); }
    .check--fail { border-color: rgba(213,90,40,0.3); background: rgba(213,90,40,0.05); }
    .check--warn { border-color: rgba(232,163,23,0.3); background: rgba(232,163,23,0.05); }
    .check--fail .check__title { color: #D55A28; }
    .check--pass .check__title { color: #6FBF73; }
    .check--warn .check__title { color: #E8A317; }
    .actions { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: linear-gradient(135deg, #E8A317, #D68A0A);
      color: #1f1d17;
      border: 0;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: .92rem;
      font-family: inherit;
    }
    button.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    button.danger {
      background: transparent;
      color: #D55A28;
      border: 1px solid rgba(213,90,40,0.4);
    }
    .log {
      background: #000;
      border: 1px solid #2a3530;
      border-radius: 8px;
      padding: 14px;
      margin-top: 20px;
      font-family: 'Courier New', monospace;
      font-size: .78rem;
      color: #6FBF73;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-error { color: #D55A28; }
    .log-warn { color: #E8A317; }
    .back { color: #E8A317; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; min-height: 44px; margin-top: 30px; }
    button { min-height: 44px; }
    .check__body { min-width: 0; overflow-wrap: break-word; }
    h1 { font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.75rem); overflow-wrap: break-word; }
    body { padding: clamp(18px, 4vw, 30px) var(--zoo-gutter, clamp(14px, 4vw, 32px)); }
    img, svg { max-width: 100%; }
  </style>
</head>
<body>
  <h1><svg class="zi" aria-hidden="true"><use href="#zi-wrench"/></svg> Diagnóstico del sistema de certificados</h1>
  <p class="sub">Revisa tu cuenta, el avance de tus cursos y tus certificados. Los certificados los emite el servidor al terminar cada curso: esta página solo consulta, no crea nada.</p>

  <div id="checks"></div>

  <div class="actions">
    <button onclick="runDiagnostic()"><svg class="zi" aria-hidden="true"><use href="#zi-refresh-cw"/></svg> Volver a verificar</button>
    <button class="danger" onclick="limpiarAvanceLocal()"><svg class="zi" aria-hidden="true"><use href="#zi-trash-2"/></svg> Limpiar avance guardado en el navegador</button>
  </div>

  <div id="log" class="log" style="display:none;"></div>

  <a href="club-biblioteca.html" class="back">← Volver a la biblioteca</a>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/herramientas-iconos.js?v=20261104"></script>
  <script src="../assets/js/club.js?v=20261129-acceso"></script>
  <script src="../assets/js/club-contacto.js?v=20261203-contacto"></script>
  <script src="../assets/js/club-progreso.js?v=20261129-calendario"></script>
  <script src="../assets/js/club-certificado.js?v=20261104"></script>
  <script>
    const checks = document.getElementById('checks');
    const logEl = document.getElementById('log');
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function log(msg, type = 'info') {
      logEl.style.display = 'block';
      const span = document.createElement('span');
      span.className = type === 'error' ? 'log-error' : (type === 'warn' ? 'log-warn' : '');
      span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function addCheck(status, title, detail) {
      const icons = {
        pass: '<svg class="zi" aria-hidden="true"><use href="#zi-circle-check"/></svg>',
        fail: '<svg class="zi" aria-hidden="true"><use href="#zi-circle-x"/></svg>',
        warn: '<svg class="zi" aria-hidden="true"><use href="#zi-triangle-alert"/></svg>'
      };
      const div = document.createElement('div');
      div.className = `check check--${status}`;
      div.innerHTML = `
        <div class="check__icon">${icons[status]}</div>
        <div class="check__body">
          <div class="check__title">${title}</div>
          <div class="check__detail">${detail}</div>
        </div>`;
      checks.appendChild(div);
    }

    async function runDiagnostic() {
      checks.innerHTML = '';
      logEl.innerHTML = '';
      logEl.style.display = 'none';

      // ═══ 1: Firebase conectado ═══
      if (typeof firebase === 'undefined' || !window.db) {
        addCheck('fail', 'Firebase NO conectado', 'No se pudo cargar Firebase. Revisa que <code>firebase-config.js</code> esté presente.');
        return;
      }
      addCheck('pass', 'Firebase conectado', 'El SDK de Firebase carga correctamente.');

      // ═══ 2: Usuario autenticado ═══
      const user = await new Promise(resolve => {
        const unsub = auth.onAuthStateChanged(u => { unsub(); resolve(u); });
      });
      if (!user) {
        addCheck('fail', 'NO has iniciado sesión', 'Entra primero al club con tu cuenta. <a href="club-login.html" style="color:#E8A317;">Ir al login</a>');
        return;
      }
      addCheck('pass', 'Usuario autenticado', `Email: <code>${esc(user.email)}</code><br>UID: <code>${esc(user.uid)}</code>`);

      // ═══ 3: Documento de miembro ═══
      let memberDoc;
      try {
        memberDoc = await db.collection('miembros').doc(user.uid).get();
      } catch (err) {
        addCheck('fail', 'No se puede leer tu documento de miembro',
          `Error: <code>${esc(err.code || err.message)}</code><br>Las reglas de Firestore NO te permiten leer tu propio documento.`);
        return;
      }
      if (!memberDoc.exists) {
        addCheck('fail', 'NO existe tu documento en <code>miembros</code>',
          `Tu UID <code>${esc(user.uid)}</code> no tiene documento en la colección <code>miembros</code>. Registra tu cuenta de nuevo.`);
        return;
      }
      const member = memberDoc.data();
      addCheck('pass', 'Documento de miembro encontrado', `Nombre: <code>${esc(member.name || '(sin nombre)')}</code>`);

      // ═══ 4: role ═══
      if (member.role === 'admin') {
        addCheck('pass', 'Eres ADMIN', 'Tu campo <code>role</code> es <code>admin</code>.');
      } else {
        addCheck('warn', 'role = "member"',
          `Tu campo <code>role</code> es <code>${esc(member.role || '(vacío)')}</code>. Es el rol normal de una cuenta. El acceso premium depende de un pago vigente verificado.`);
      }

      // ═══ 5: membresía realmente vigente ═══
      if (ZOORIGEN_CLUB.hasActiveMembership(member)) {
        addCheck('pass', 'Membresía vigente',
          `Estado: <code>${esc(ZOORIGEN_CLUB.calculateStatus(member))}</code> · acceso hasta <code>${esc(ZOORIGEN_CLUB.formatShort(member.planVence))}</code>.`);
      } else if (member.planActivo === 'true') {
        addCheck('fail', 'planActivo es STRING, debe ser BOOLEAN',
          `Valor actual: <code>"true"</code> (string). Este dato no concede acceso.<br>Pide a soporte revisar el pago; no edites el campo manualmente.`);
      } else {
        addCheck('warn', 'Sin membresía vigente',
          'No hay una membresía vigente confirmada. Puedes ver tu clase gratuita; si ya pagaste, solicita una verificación.');
      }

      // ═══ 6: el servidor guarda tu avance ═══
      let cursos = null;
      try {
        const r = await ZOORIGEN_CLUB.apiFetch('/api/cursos/progreso');
        cursos = r && r.cursos && typeof r.cursos === 'object' ? r.cursos : {};
        const ids = Object.keys(cursos);
        const terminados = ids.filter(id => cursos[id] && cursos[id].completado === true);
        const conFolio = terminados.filter(id => cursos[id].certificadoFolio);
        addCheck('pass', 'El servidor responde con tu avance',
          `Cursos con avance: <code>${ids.length}</code> · terminados: <code>${terminados.length}</code> · con certificado emitido: <code>${conFolio.length}</code>.`);
        if (terminados.length > conFolio.length) {
          addCheck('warn', 'Hay cursos terminados sin certificado',
            `Tienes <code>${terminados.length - conFolio.length}</code> curso(s) terminado(s) sin folio. Entra al curso en la biblioteca y pulsa <strong>Terminar curso</strong> para que el servidor lo emita.`);
        }
      } catch (err) {
        const texto = ZOO_PROGRESO.mensajeError(err, { accion: 'lista', esMiembro: ZOORIGEN_CLUB.hasActiveMembership(member) });
        addCheck('fail', 'No se pudo consultar tu avance al servidor',
          `Estado: <code>${esc(err.status === 0 ? 'sin conexión' : err.status)}</code><br>${esc(texto)}`);
      }

      // ═══ 7: tus certificados ═══
      let propios = [];
      try {
        const snap = await db.collection('certificados').where('memberUid', '==', user.uid).get();
        propios = snap.docs.map(d => Object.assign({ folio: d.id }, d.data()));
      } catch (err) {
        addCheck('fail', 'NO puedes leer tus certificados',
          `Error: <code>${esc(err.code || err.message)}</code><br>Las reglas de Firestore deben permitir que cada miembro lea sus propios certificados.`);
      }
      if (propios.length) {
        const verificados = propios.filter(c => ZOO_CERT.estadoVerificacion(c) === 'verificado');
        addCheck(verificados.length === propios.length ? 'pass' : 'warn', 'Tus certificados',
          `Certificados: <code>${propios.length}</code> · verificados por el servidor: <code>${verificados.length}</code> · en validación: <code>${propios.length - verificados.length}</code>.`);
        // Prueba de la consulta pública con el primero
        const r = await ZOO_CERT.consultar(propios[0].folio);
        if (r.ok) addCheck('pass', 'La verificación pública responde', `El folio <code>${esc(r.folio)}</code> se verifica correctamente.`);
        else addCheck('warn', 'La verificación pública no confirmó un folio', `Folio <code>${esc(propios[0].folio)}</code>: ${esc(r.titulo)}. ${esc(r.detalle)}`);
      } else if (cursos) {
        addCheck('warn', 'Aún no tienes certificados', 'El certificado aparece solo cuando terminas la última clase de un curso.');
      }

      // ═══ 8: avance guardado en este navegador (solo para mostrar) ═══
      const claves = Object.keys(localStorage).filter(k => k.startsWith('zoo_course_progress_'));
      addCheck('pass', 'Avance guardado en este navegador',
        `Copias guardadas: <code>${claves.length}</code>. Solo sirven para mostrar tu avance si el servidor no responde; nunca emiten certificados. Puedes limpiarlas con el botón de abajo.`);
    }

    function limpiarAvanceLocal() {
      const claves = Object.keys(localStorage).filter(k => k.startsWith('zoo_course_progress_'));
      claves.forEach(k => localStorage.removeItem(k));
      log(`${claves.length} copia(s) del avance eliminadas de este navegador. El servidor conserva tu avance real.`);
      setTimeout(runDiagnostic, 500);
    }

    // Auto-run al cargar
    runDiagnostic();
  </script>
</body>
</html>
