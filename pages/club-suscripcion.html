<!DOCTYPE html>

  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">

  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F5F3A">

  <link rel="stylesheet" href="../assets/css/club-seccion.css?v=20261103">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    /* Selector de plan y pago embebido (colores sólidos: verde de marca, dorado solo en la etiqueta) */
    .sub-titulo { font-family: var(--zoo-font-display); font-size: 1.2rem; text-align: center; margin: 4px 0 14px; color: var(--zoo-text); }
    .sub-planes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; max-width: 760px; margin: 0 auto 18px; }
    .sub-plan { text-align: left; display: grid; gap: 4px; padding: 16px 18px; border-radius: 16px; background: var(--zoo-bg-card); border: 2px solid var(--zoo-border-strong); color: var(--zoo-text); cursor: pointer; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
    .sub-plan:hover { border-color: var(--zoo-solid-mid, #2A7A4E); }
    .sub-plan.is-activo { background: var(--zoo-panel, #1F5F3A); border-color: var(--zoo-panel, #1F5F3A); color: #fff; }
    .sub-plan.is-activo .sub-plan__sub, .sub-plan.is-activo .sub-plan__precio, .sub-plan.is-activo .sub-plan__precio em { color: #fff; }
    .sub-plan__nombre { font-weight: 800; font-size: 1rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sub-plan__etq { font-size: .64rem; letter-spacing: .06em; text-transform: uppercase; background: var(--zoo-amber); color: #1F1D17; padding: 2px 8px; border-radius: 10px; }
    .sub-plan__sub { font-size: .82rem; color: var(--zoo-text-muted); }
    .sub-plan__precio { font-family: var(--zoo-font-display); font-weight: 800; font-size: 1.5rem; color: var(--zoo-fill, #2A7A4E); }
    .sub-plan__precio em { font-style: normal; font-size: .66rem; font-weight: 700; letter-spacing: .08em; color: var(--zoo-text-dim); margin-left: 6px; }
    .sub-pago { max-width: 760px; margin: 0 auto; background: var(--zoo-bg-card); border: 1px solid var(--zoo-border-strong); border-radius: 18px; padding: 22px 20px; }
    .sub-pago__plan { font-size: .9rem; color: var(--zoo-text-muted); }
    .sub-pago__monto { font-family: var(--zoo-font-display); font-size: 1.9rem; font-weight: 800; color: var(--zoo-text); line-height: 1.2; }
    .sub-pago__monto small { font-size: .85rem; font-weight: 500; color: var(--zoo-text-muted); }
    .sub-pago__detalle { font-size: .84rem; color: var(--zoo-text-muted); margin-bottom: 16px; }
    .sub-pago__form { min-height: 120px; }
  </style>
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" style="margin-bottom:12px;" aria-label="Menú"><svg class="zi" aria-hidden="true"><use href="#zi-menu"/></svg></button>
      <div id="zsSeccion"></div>
      <div id="subContent">Cargando...</div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/herramientas-iconos.js?v=20261103"></script>
  <script src="../assets/js/club-config.js?v=20261103"></script>
  <script src="../assets/js/club-seccion.js?v=20261103"></script>
  <script src="../assets/js/club-cola.js?v=20261103"></script>
  <script>ZOO_SECCION.montar('#zsSeccion', {"id":"zsSeccionSuscripcion","seccion":"suscripcion","icono":"credit-card","eyebrow":"Mi suscripción","titulo":"Tu membresía,","acento":"a tu manera.","sub":"Elige el plan que prefieras, consulta tu estado y gestiona tu renovación.","cifras":[{"clave":"plan","valor":"—","rotulo":"plan"},{"clave":"estado","valor":"—","rotulo":"estado"},{"clave":"vence","valor":"—","rotulo":"próxima renovación"}]});</script>
  <script src="../assets/js/club.js?v=20261103"></script>
  <script src="../assets/js/club-shell.js?v=20261103"></script>
  <script src="../assets/js/club-avisos.js?v=20261103"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('suscripcion', session);
      if (ZOORIGEN_CLUB.initTheme) ZOORIGEN_CLUB.initTheme();
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();

      const content = document.getElementById('subContent');
      let html = '';
      if (window.ZOO_SECCION) {
        const est = { active: 'Activa', cancelled_active: 'Cancelada, con acceso', pending_payment: 'Cuenta gratuita', past_due: 'Pago pendiente', expired: 'Vencida' };
        const plan = session.planTipo === 'anual' ? 'VIP Anual' : session.planTipo === 'mensual' ? 'VIP Mensual' : (ZOORIGEN_CLUB.hasActiveMembership(session) ? 'VIP' : 'Sin plan');
        ZOO_SECCION.cifras({ plan, estado: est[session.planStatus] || '—', vence: session.planVence ? ZOORIGEN_CLUB.formatShort(session.planVence) : '—' });
      }

      if (!ZOORIGEN_CLUB.hasActiveMembership(session)) {
        const estadoTitulo = session.planStatus === 'expired' ? 'Tu membresía venció' : session.planStatus === 'past_due' ? 'No pudimos confirmar tu último pago' : 'Activa tu membresía';
        const estadoMensaje = session.planStatus === 'expired'
          ? 'Tu periodo de acceso terminó. Elige un plan para volver a abrir todas las clases y cursos.'
          : session.planStatus === 'past_due'
            ? 'Tu acceso está pausado hasta que Stripe confirme el cobro. Puedes verificar de nuevo o elegir un plan.'
            : 'Tu cuenta gratuita ya está lista. Elige un plan para abrir todos los cursos.';
        // Stripe Checkout Sessions — los botones llaman a openCheckoutModal que usa iniciarPagoStripe
        html += `
          <div class="card" style="background:var(--zoo-tint, #EAF2EC);border-color:var(--zoo-border-strong);margin-bottom:20px;">
            <h2 style="color:var(--zoo-text);font-size:1.3rem;margin-bottom:10px;">${estadoTitulo}</h2>
            <p style="margin-bottom:20px;">${estadoMensaje}</p>

            <div style="background:var(--zoo-tint-2, #DCEBE0);border:1px solid var(--zoo-border-strong);border-radius:10px;padding:14px 18px;margin-top:16px;">
              <div style="color:var(--zoo-text);font-weight:600;font-size:.95rem;margin-bottom:6px;"><svg class="zi" aria-hidden="true"><use href="#zi-banknote"/></svg> ¿Ya realizaste el pago?</div>
              <p style="color:var(--zoo-text-muted);font-size:.84rem;margin-bottom:12px;line-height:1.5;">
                Si ya pagaste, consulta el estado directamente con Stripe. La verificación no genera ningún cobro.
              </p>
              <button id="verifyPaymentBtn" class="btn-club-outline" style="width:auto;padding:10px 22px;border:1px solid var(--zoo-solid, #1F5F3A);background:var(--zoo-solid, #1F5F3A);color:#fff;border-radius:10px;font-family:inherit;font-size:.92rem;cursor:pointer;">
                Verificar mi pago
              </button>
              <div id="verifyMsg" style="margin-top:10px;"></div>
            </div>
          </div>

          <h2 class="sub-titulo">Elige tu plan</h2>
          <div class="sub-planes" role="group" aria-label="Plan de membresía">
            <button type="button" class="sub-plan" data-plan="mensual" aria-pressed="false">
              <span class="sub-plan__nombre">VIP Mensual</span>
              <span class="sub-plan__sub">Cancela cuando quieras</span>
              <span class="sub-plan__precio">$199<em>MXN/MES</em></span>
            </button>
            <button type="button" class="sub-plan is-activo" data-plan="anual" aria-pressed="true">
              <span class="sub-plan__nombre">VIP Anual <b class="sub-plan__etq">Recomendado</b></span>
              <span class="sub-plan__sub">Ahorras $489 al año</span>
              <span class="sub-plan__precio">$1,899<em>MXN/AÑO</em></span>
            </button>
          </div>

          <div class="sub-pago">
            <div class="sub-pago__cab">
              <div class="sub-pago__plan" id="subPagoPlan">Suscríbete a Zoorigen VIP · Plan Anual</div>
              <div class="sub-pago__monto" id="subPagoMonto">MXN 1,899.00 <small>por año</small></div>
              <div class="sub-pago__detalle" id="subPagoDetalle">MXN 158.25/mes facturado anualmente</div>
            </div>
            <div id="checkoutEmbebido" class="sub-pago__form"></div>
          </div>

          <p style="text-align:center;color:var(--zoo-text-dim);font-size:.84rem;margin-top:18px;"><svg class="zi" aria-hidden="true"><use href="#zi-lock"/></svg> Pago seguro procesado por Stripe · Tu membresía se activa automáticamente al completar el pago</p>`;
      } else {
        // Calcular si todavía tiene tiempo disponible (para mostrar opción de reanudar sin pagar)
        const fechaVence = ZOORIGEN_CLUB.toDate(session.planVence);
        const tieneTiempo = fechaVence && fechaVence.getTime() > Date.now();
        const diasRestantes = tieneTiempo ? Math.ceil((fechaVence - new Date()) / (1000*60*60*24)) : 0;

        html += `
          <div class="card">
            <h2 style="color:var(--zoo-text);font-size:1.2rem;margin-bottom:14px;">Plan actual</h2>
            <div class="info-row"><div class="info-row__label">Plan</div><div class="info-row__value">Miembro VIP Zoorigen</div></div>
            <div class="info-row"><div class="info-row__label">Precio</div><div class="info-row__value">${session.planTipo === 'anual' ? '$1,899 MXN / año' : '$199 MXN / mes'}</div></div>
            <div class="info-row"><div class="info-row__label">Estado</div><div class="info-row__value">${session.planStatus === 'active' ? '<span style="color:var(--zoo-green-500);">● Membresía activa</span>' : '<span style="color:var(--zoo-amber);"><svg class="zi" aria-hidden="true"><use href="#zi-hourglass"/></svg> Cancelada · acceso vigente</span>'}</div></div>
            <div class="info-row"><div class="info-row__label">${session.planStatus === 'active' ? 'Próxima renovación' : 'Acceso hasta'}</div><div class="info-row__value">${ZOORIGEN_CLUB.formatShort(session.planVence)}</div></div>
            <div class="info-row"><div class="info-row__label">Último pago</div><div class="info-row__value">${session.ultimoPago ? ZOORIGEN_CLUB.formatShort(session.ultimoPago) : '—'}</div></div>
          </div>`;

        // Zona de peligro / reactivar con pago (si ya se venció)
        html += `
          <div class="card" style="margin-top:20px;border-color:rgba(213,90,40,0.3);">
            <h2 style="color:var(--zoo-orange);font-size:1.1rem;margin-bottom:10px;">${session.planStatus === 'active' ? '<svg class="zi" aria-hidden="true"><use href="#zi-triangle-alert"/></svg> Zona de peligro' : session.planStatus === 'cancelled_active' ? '<svg class="zi" aria-hidden="true"><use href="#zi-refresh-cw"/></svg> Tu membresía está cancelada' : '<svg class="zi" aria-hidden="true"><use href="#zi-refresh-cw"/></svg> Reactivar con nuevo pago'}</h2>
            <p style="margin-bottom:16px;">${session.planStatus === 'active'
              ? 'Si cancelas tu membresía, mantienes el acceso hasta el final del período pagado. Después perderás acceso a los cursos, los materiales y los descuentos VIP.'
              : session.planStatus === 'cancelled_active'
                ? 'Tu membresía se cancelará cuando venza tu periodo actual. Mientras tanto sigues teniendo acceso completo.'
              : tieneTiempo
                ? 'Si prefieres que tu membresía se termine cuando venza, no hagas nada. O puedes reactivarla arriba sin costo extra.'
                : 'Tu membresía venció. Reactívala para volver a tener acceso completo al contenido VIP.'}</p>
            ${session.planStatus === 'active'
              ? '<button class="btn-danger" id="cancelBtn">Cancelar membresía</button>'
              : session.planStatus === 'cancelled_active'
                ? '<button id="reanudarBtn" class="btn-club" style="display:inline-block;width:auto;padding:12px 24px;border:0;font-family:inherit;font-size:1rem;cursor:pointer;"><svg class="zi" aria-hidden="true"><use href="#zi-check"/></svg> Reanudar mi membresía</button><div id="reanudarMsg" style="margin-top:12px;"></div>'
              : !tieneTiempo
                ? `<button onclick="ZOORIGEN_CLUB.openCheckoutModal('mensual', '${session.email}')" class="btn-club" style="display:inline-block;width:auto;padding:12px 24px;border:0;font-family:inherit;font-size:1rem;cursor:pointer;">Reactivar por $199 MXN</button>`
                : ''}
            <div id="cancelMsg" style="margin-top:14px;"></div>
          </div>`;
      }
      content.innerHTML = html;

      // Pago dentro de la página (Stripe Embedded Checkout): se elige el plan arriba y el formulario aparece debajo.
      const contenedorPago = document.getElementById('checkoutEmbebido');
      if (contenedorPago) {
        const PLANES = {
          mensual: { plan: 'Suscríbete a Zoorigen VIP · Plan Mensual', monto: 'MXN 199.00', cada: 'por mes', detalle: 'Se renueva cada mes · Cancela cuando quieras' },
          anual: { plan: 'Suscríbete a Zoorigen VIP · Plan Anual', monto: 'MXN 1,899.00', cada: 'por año', detalle: 'MXN 158.25/mes facturado anualmente' }
        };
        let planActual = null;
        const elegirPlan = (plan) => {
          if (!PLANES[plan] || plan === planActual) return;
          planActual = plan;
          document.querySelectorAll('.sub-plan').forEach((b) => {
            const activo = b.dataset.plan === plan;
            b.classList.toggle('is-activo', activo);
            b.setAttribute('aria-pressed', activo ? 'true' : 'false');
          });
          const p = PLANES[plan];
          document.getElementById('subPagoPlan').textContent = p.plan;
          document.getElementById('subPagoMonto').innerHTML = p.monto + ' <small>' + p.cada + '</small>';
          document.getElementById('subPagoDetalle').textContent = p.detalle;
          iniciarPagoEmbedded(plan, session.email, 'checkoutEmbebido');
        };
        document.querySelectorAll('.sub-plan').forEach((b) => b.addEventListener('click', () => elegirPlan(b.dataset.plan)));
        elegirPlan('anual');
      }

      // ═══════════════ AUTO-CHECK: Verifica si el pago ya se procesó ═══════════════
      // Si viene con ?paid=1 en la URL (después de checkout de Stripe), verificar cada 3s por 90s
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('paid')) {
        // Overlay bonito de "procesando pago"
        const overlay = document.createElement('div');
        overlay.id = 'payWaitOverlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(12, 12, 12,0.95);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
        overlay.innerHTML = `
          <div style="max-width:480px;width:100%;background:var(--zoo-solid, #1F5F3A);border:2px solid rgba(232,163,23,0.4);border-radius:20px;padding:40px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
            <div style="font-size:4rem;margin-bottom:14px;animation:pulseZ 1.5s ease-in-out infinite;"><img class="zi-logo" src="../assets/img/logo/logo.jpg" alt="Zoorigen" width="64" height="64"></div>
            <h2 style="font-family:var(--zoo-font-display);color:#fff;font-size:1.5rem;margin:0 0 10px;">Procesando tu pago...</h2>
            <p style="color:rgba(255,255,255,0.85);font-size:.95rem;margin:0 0 20px;line-height:1.5;">Estamos activando tu membresía VIP. Esto puede tomar <strong style="color:#E8A317;">hasta 1 minuto</strong>. No cierres esta ventana.</p>
            <div style="display:flex;justify-content:center;gap:6px;margin-bottom:20px;">
              <span class="zoo-dot" style="width:10px;height:10px;background:#E8A317;border-radius:50%;animation:bounceZ 1.4s ease-in-out infinite;"></span>
              <span class="zoo-dot" style="width:10px;height:10px;background:#E8A317;border-radius:50%;animation:bounceZ 1.4s ease-in-out 0.2s infinite;"></span>
              <span class="zoo-dot" style="width:10px;height:10px;background:#E8A317;border-radius:50%;animation:bounceZ 1.4s ease-in-out 0.4s infinite;"></span>
            </div>
            <div id="payWaitStatus" style="color:rgba(255,255,255,0.7);font-size:.82rem;">Verificando con el servidor...</div>
          </div>
          <style>
            @keyframes pulseZ { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
            @keyframes bounceZ { 0%,80%,100%{transform:translateY(0);opacity:0.3} 40%{transform:translateY(-8px);opacity:1} }
          

  </style>
        `;
        document.body.appendChild(overlay);

        let attempts = 0;
        const maxAttempts = 30; // 90 segundos
        const statusEl = () => document.getElementById('payWaitStatus');

        const autoCheck = setInterval(async () => {
          attempts++;
          if (statusEl()) statusEl().textContent = `Verificando... (${attempts}/${maxAttempts})`;

          try {
            const doc = await db.collection('miembros').doc(session.uid).get();
            const data = doc.data() || {};
            if (ZOORIGEN_CLUB.hasActiveMembership(data)) {
              clearInterval(autoCheck);
              // Éxito: cambiar overlay a mensaje de bienvenida + redirect
              overlay.innerHTML = `
                <div style="max-width:480px;width:100%;background:var(--zoo-solid, #1F5F3A);border:2px solid #6FBF73;border-radius:20px;padding:40px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
                  <div style="font-size:4rem;margin-bottom:14px;"><svg class="zi" aria-hidden="true"><use href="#zi-party-popper"/></svg></div>
                  <h2 style="font-family:var(--zoo-font-display);color:#fff;font-size:1.6rem;margin:0 0 10px;">¡Bienvenido al Club VIP!</h2>
                  <p style="color:rgba(255,255,255,0.9);font-size:1rem;margin:0 0 20px;line-height:1.5;">Tu membresía está <strong style="color:#6FBF73;">ACTIVA</strong>. Ya tienes acceso a todo el contenido exclusivo.</p>
                  <div style="color:#E8A317;font-size:.85rem;">Redirigiendo al dashboard en 2 segundos...</div>
                </div>
              `;
              setTimeout(() => { window.location.href = 'club-dashboard.html'; }, 2000);
              return;
            }
          } catch (e) { console.warn('Auto-check error', e); }

          if (attempts >= maxAttempts) {
            clearInterval(autoCheck);
            overlay.innerHTML = `
              <div style="max-width:480px;width:100%;background:var(--zoo-bg-card,#171B20);border:2px solid rgba(232,163,23,0.4);border-radius:20px;padding:40px 30px;text-align:center;">
                <div style="font-size:3.5rem;margin-bottom:14px;"><svg class="zi" aria-hidden="true"><use href="#zi-timer"/></svg></div>
                <h2 style="font-family:var(--zoo-font-display);color:#fff;font-size:1.4rem;margin:0 0 10px;">El pago aún no se confirma</h2>
                <p style="color:rgba(255,255,255,0.85);font-size:.92rem;margin:0 0 18px;line-height:1.5;">A veces tarda unos minutos. Si ya pagaste, espera un momento y presiona verificar. Si NO pagaste, puedes hacerlo ahora.</p>
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                  <button onclick="location.reload()" style="background:var(--zoo-amber, #E8A317);color:#1f1d17;border:0;padding:12px 22px;border-radius:10px;font-family:var(--zoo-font-display);font-weight:700;cursor:pointer;"><svg class="zi" aria-hidden="true"><use href="#zi-refresh-cw"/></svg> Verificar ahora</button>
                  <button onclick="document.getElementById('payWaitOverlay').remove()" style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);padding:12px 22px;border-radius:10px;cursor:pointer;">Cerrar</button>
                </div>
              </div>
            `;
          }
        }, 3000);
      }

      // ═══════════════ VERIFICAR PAGO MANUAL ═══════════════
      const verifyBtn = document.getElementById('verifyPaymentBtn');
      if (verifyBtn) {
        verifyBtn.addEventListener('click', async () => {
          const msgEl = document.getElementById('verifyMsg');
          verifyBtn.disabled = true;
          verifyBtn.textContent = 'Verificando...';
          msgEl.innerHTML = '';

          try {
            const currentUser = firebase.auth().currentUser;
            const idToken = await currentUser.getIdToken();
            const response = await fetch(WEBHOOK_SERVER_URL + '/verify-membership', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${idToken}`,
              },
              body: JSON.stringify({}),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'No se pudo verificar');

            if (data.active === true) {
              msgEl.innerHTML = `<div style="color:var(--zoo-green-500);background:rgba(111,191,115,0.1);border:1px solid rgba(111,191,115,0.3);padding:10px 14px;border-radius:8px;font-size:.88rem;"><svg class="zi" aria-hidden="true"><use href="#zi-circle-check"/></svg> Pago confirmado. Tu acceso está vigente${data.expiresAt ? ' hasta ' + ZOORIGEN_CLUB.formatShort(data.expiresAt) : ''}. Recargando...</div>`;
              setTimeout(() => window.location.href = 'club-dashboard.html', 1500);
              return;
            }

            // Si el webhook no ha activado, mostrar info de contacto
            msgEl.innerHTML = `
              <div style="background:rgba(232,163,23,0.08);border:1px solid rgba(232,163,23,0.3);padding:14px;border-radius:8px;margin-top:6px;">
                <div style="color:var(--zoo-amber);font-weight:700;margin-bottom:8px;font-size:.92rem;">No hay una membresía pagada vigente</div>
                <p style="color:var(--zoo-text-muted);font-size:.84rem;line-height:1.5;margin-bottom:10px;">
                  Puedes seguir usando tu acceso gratuito. Si tu cargo ya aparece en el banco, contacta a soporte para revisar el pago sin cobrarte de nuevo:
                </p>
                <a href="https://wa.me/5212361113237?text=Hola%2C%20ya%20pagu%C3%A9%20Club%20VIP%20Zoorigen%20pero%20no%20se%20activa%20mi%20membres%C3%ADa.%20Mi%20email%20es%3A%20${encodeURIComponent(session.email)}" target="_blank" style="display:inline-block;background:#25D366;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.88rem;">
                  Contactar soporte por WhatsApp
                </a>
              </div>
            `;
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Verificar mi pago';
          } catch (err) {
            console.error(err);
            msgEl.innerHTML = '<div style="color:var(--zoo-orange);font-size:.88rem;"></div>';
            msgEl.firstElementChild.textContent = err.message || 'No se pudo verificar. Intenta de nuevo.';
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Verificar mi pago';
          }
        });
      }

      const cancelBtn = document.getElementById('cancelBtn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', async () => {
          if (!confirm('¿Seguro que quieres cancelar tu membresía VIP? Mantendrás acceso hasta ' + ZOORIGEN_CLUB.formatShort(session.planVence))) return;
          cancelBtn.disabled = true;
          cancelBtn.textContent = 'Cancelando...';
          const result = await ZOORIGEN_CLUB.cancelSubscription();
          const msg = document.getElementById('cancelMsg');
          if (result.ok) {
            msg.innerHTML = `<div class="success-msg show"><svg class="zi" aria-hidden="true"><use href="#zi-circle-check"/></svg> Cancelación procesada. Tienes acceso hasta ${ZOORIGEN_CLUB.formatShort(result.accesoHasta)}.</div>`;
            setTimeout(() => location.reload(), 2500);
          } else {
            msg.innerHTML = `<div class="error-msg show"><svg class="zi" aria-hidden="true"><use href="#zi-triangle-alert"/></svg> ${result.msg}</div>`;
            cancelBtn.disabled = false;
            cancelBtn.textContent = 'Cancelar membresía';
          }
        });
      }

      // ═══════════════ REANUDAR MEMBRESÍA CANCELADA (sin costo) ═══════════════
      const reanudarBtn = document.getElementById('reanudarBtn');
      if (reanudarBtn) {
        reanudarBtn.addEventListener('click', async () => {
          if (!confirm('¿Reanudar tu membresía? Volverá a renovarse automáticamente al vencer.')) return;
          reanudarBtn.disabled = true;
          reanudarBtn.textContent = 'Reanudando...';
          const msgEl = document.getElementById('reanudarMsg');
          try {
            // Llamar al webhook para reactivar en Stripe
            const currentUser = firebase.auth().currentUser;
            const idToken = await currentUser.getIdToken();
            const res = await fetch(WEBHOOK_SERVER_URL + '/reactivate-subscription', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${idToken}`,
              },
              body: JSON.stringify({}),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error al reanudar');
            
            // Mostrar popup de felicitación
            const popup = document.createElement('div');
            popup.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;animation:zooFadeIn .4s ease;';
            popup.innerHTML = `
              <style>
                @keyframes zooFadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
                @keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
                .zoo-confetti-r{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100000;overflow:hidden;}
                .zoo-confetti-r div{position:absolute;top:-20px;animation:confettiFall linear forwards;}
              </style>
              <div class="zoo-confetti-r" id="confettiReanudar"></div>
              <div style="max-width:440px;width:100%;background:var(--zoo-solid, #1F5F3A);border:2px solid rgba(232,163,23,0.3);border-radius:24px;padding:40px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.6);z-index:100001;position:relative;">
                <div style="font-size:4rem;margin-bottom:12px;"><svg class="zi" aria-hidden="true"><use href="#zi-party-popper"/></svg></div>
                <h2 style="color:#fff;font-family:var(--zoo-font-display);font-size:1.5rem;margin:0 0 8px;">¡Bienvenido de regreso!</h2>
                <p style="color:#E8A317;font-size:1.1rem;font-weight:700;margin:0 0 12px;">Tu membresía VIP está activa</p>
                <p style="color:rgba(255,255,255,0.7);font-size:.9rem;margin:0 0 24px;line-height:1.5;">Nos alegra tenerte de vuelta. Tu suscripción se renovará automáticamente y seguirás disfrutando de todos los beneficios VIP.</p>
                <button onclick="this.closest('div[style]').parentElement.remove();location.reload();" style="display:block;width:100%;padding:14px;background:var(--zoo-amber, #E8A317);color:#1f1d17;border:0;border-radius:14px;font-family:var(--zoo-font-display);font-size:1rem;font-weight:700;cursor:pointer;">Explorar mi Club VIP <svg class="zi" aria-hidden="true"><use href="#zi-rocket"/></svg></button>
              </div>
            `;
            document.body.appendChild(popup);
            // Confetti
            const cc = document.getElementById('confettiReanudar');
            const cols = ['#E8A317','#6FBF73','#D55A28','#2AA4D5','#fff','#F5C62E','#ff6b9d'];
            for(let i=0;i<50;i++){const p=document.createElement('div');const s=6+Math.random()*8;p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*1.5}s;`;cc.appendChild(p);}
            setTimeout(()=>{if(cc)cc.remove();},5000);
          } catch (err) {
            console.error(err);
            msgEl.innerHTML = `<div class="error-msg show"><svg class="zi" aria-hidden="true"><use href="#zi-triangle-alert"/></svg> No se pudo reanudar. Escríbenos por WhatsApp.</div>`;
            reanudarBtn.disabled = false;
            reanudarBtn.textContent = 'Reanudar mi membresía';
          }
        });
      }
    })();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
</html>
