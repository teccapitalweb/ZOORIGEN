<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca · Club VIP Zoorigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
  <style>
    .player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .player-overlay.is-open { display: flex; }
    .player-box { width: 100%; max-width: 960px; background: var(--zoo-bg-card); border-radius: var(--zoo-radius); overflow: hidden; }
    .player-box__header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--zoo-border); }
    .player-box__header h3 { color: #fff; font-size: 1.04rem; margin: 0; }
    .player-box__close { background: transparent; border: 0; color: #fff; font-size: 1.8rem; cursor: pointer; padding: 0; line-height: 1; }
    .player-box__video { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
    .player-box__video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player-box__info { padding: 18px 20px; }
    .player-box__info p { color: var(--zoo-text-muted); font-size: .92rem; margin: 0; }
  </style>
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="page-header">
        <h1>📚 Biblioteca exclusiva</h1>
        <p>Cursos completos seleccionados para miembros VIP · Acceso ilimitado</p>
      </div>
      <div id="lockedNotice"></div>
      <div class="filter-bar" id="filterBar"></div>
      <div class="course-grid-club" id="coursesGrid">Cargando cursos...</div>
    </main>
  </div>

  <div class="player-overlay" id="playerOverlay">
    <div class="player-box">
      <div class="player-box__header">
        <h3 id="playerTitle">—</h3>
        <button class="player-box__close" onclick="closePlayer()">×</button>
      </div>
      <div class="player-box__video" id="playerVideo"></div>
      <div class="player-box__info"><p id="playerDesc"></p></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('biblioteca', session);

      if (session.planStatus !== 'active') {
        document.getElementById('lockedNotice').innerHTML = `<div class="status-banner" style="margin-bottom:20px;"><span>🔒</span>Necesitas membresía activa para ver los cursos completos. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Activar $199/mes →</a></div>`;
      }

      const cursos = await ZOORIGEN_CLUB.getCursos();
      const grid = document.getElementById('coursesGrid');

      if (cursos.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--zoo-text-dim);background:var(--zoo-bg-card);border-radius:var(--zoo-radius);"><div style="font-size:3rem;margin-bottom:10px;">🦒</div><h3 style="color:#fff;margin-bottom:8px;">Biblioteca en construcción</h3><p>El equipo Zoorigen está preparando los cursos. Muy pronto tendrás acceso ilimitado.</p></div>`;
        document.getElementById('filterBar').innerHTML = '';
        return;
      }

      const areas = ['Todas', ...new Set(cursos.map(c => c.area).filter(Boolean))];
      const filterBar = document.getElementById('filterBar');
      filterBar.innerHTML = areas.map((a, i) => `<button class="filter-chip-club ${i === 0 ? 'is-active' : ''}" data-area="${a}">${a}</button>`).join('');

      const isActive = session.planStatus === 'active';
      const render = (filter = 'Todas') => {
        const list = filter === 'Todas' ? cursos : cursos.filter(c => c.area === filter);
        grid.innerHTML = list.map(c => {
          // Determinar lecciones: si no hay array, convertir el driveId viejo en una sola clase
          const lecciones = (c.lecciones && c.lecciones.length) ? c.lecciones : (c.driveId ? [{titulo: c.title, driveId: c.driveId, duration: c.duration}] : []);
          const totalClases = lecciones.length;
          const hasContent = totalClases > 0;

          return `
            <article class="course-card-club">
              <div class="course-card-club__img" ${c.image ? `style="background-image:url('${c.image}');"` : 'style="background:var(--zoo-green-800);"'}>
                ${c.tag ? `<span class="course-card-club__tag">${c.tag}</span>` : ''}
                ${totalClases > 1 ? `<span class="course-card-club__classes">📹 ${totalClases} clases</span>` : ''}
              </div>
              <div class="course-card-club__body">
                <div class="course-card-club__area">${c.area || ''}</div>
                <h3 class="course-card-club__title">${c.title}</h3>
                <p class="course-card-club__desc">${c.description || `Duración: ${c.duration || '—'} · Nivel: ${c.level || '—'}`}</p>
                ${isActive && hasContent
                  ? `<button class="course-card-club__action" onclick='openCourseDetail(${JSON.stringify({...c, lecciones}).replace(/'/g, "&#39;")})'>${totalClases > 1 ? `▶ Ver ${totalClases} clases` : '▶ Ver curso'}</button>`
                  : !isActive ? `<a href="club-suscripcion.html" class="course-card-club__action" style="background:var(--zoo-orange);">🔒 Activar membresía</a>`
                  : `<a href="https://wa.me/5212361113237?text=Hola%2C%20soy%20VIP%20y%20quiero%20el%20curso%3A%20${encodeURIComponent(c.title)}" target="_blank" class="course-card-club__action">▶ Solicitar acceso</a>`}
              </div>
            </article>
          `;
        }).join('');
      };
      render();

      filterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-chip-club');
        if (!btn) return;
        filterBar.querySelectorAll('.filter-chip-club').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        render(btn.dataset.area);
      });
    })();

    function openCourseDetail(course) {
      const lecciones = course.lecciones || [];
      if (lecciones.length === 1) {
        // Solo 1 clase → abrir player directo
        openPlayer(lecciones[0].driveId, course.title, course.description || '');
        return;
      }
      // Mostrar lista de clases
      const modal = document.getElementById('playerOverlay');
      document.getElementById('playerTitle').textContent = course.title;
      document.getElementById('playerVideo').innerHTML = `
        <div style="background:var(--zoo-bg-card);padding:20px;position:absolute;inset:0;overflow-y:auto;">
          <h4 style="color:var(--zoo-amber);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px;">📚 ${lecciones.length} clases disponibles</h4>
          ${lecciones.map((l, i) => `
            <div onclick='openPlayer("${l.driveId}", ${JSON.stringify(l.titulo || "Clase " + (i+1))}, ${JSON.stringify(l.duration || "")})' style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:all .15s;" onmouseover="this.style.background='rgba(232,163,23,0.08)';this.style.borderColor='rgba(232,163,23,0.3)';" onmouseout="this.style.background='rgba(255,255,255,0.03)';this.style.borderColor='rgba(255,255,255,0.08)';">
              <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#E8A317,#D68A0A);display:flex;align-items:center;justify-content:center;color:#1f1d17;font-weight:800;flex-shrink:0;">${i + 1}</div>
              <div style="flex:1;">
                <div style="color:#fff;font-weight:600;font-size:.96rem;">${l.titulo || 'Clase ' + (i + 1)}</div>
                ${l.duration ? `<div style="color:var(--zoo-text-dim);font-size:.78rem;margin-top:2px;">⏱️ ${l.duration}</div>` : ''}
              </div>
              <div style="color:var(--zoo-amber);font-size:1.2rem;">▶</div>
            </div>
          `).join('')}
        </div>`;
      document.getElementById('playerDesc').textContent = course.description || '';
      modal.classList.add('is-open');
    }

    function openPlayer(driveId, title, desc) {
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('playerDesc').textContent = desc || '';
      document.getElementById('playerVideo').innerHTML = `<iframe src="https://drive.google.com/file/d/${driveId}/preview" allow="autoplay" allowfullscreen></iframe>`;
      document.getElementById('playerOverlay').classList.add('is-open');
    }
    function closePlayer() {
      document.getElementById('playerOverlay').classList.remove('is-open');
      document.getElementById('playerVideo').innerHTML = '';
    }
    document.getElementById('playerOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'playerOverlay') closePlayer();
    });
  </script>
</body>
</html>
