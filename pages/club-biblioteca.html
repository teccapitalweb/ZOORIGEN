  <style>
    /* Overlay centrado, con scroll si contenido excede */
    .player-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      z-index: 1000;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .player-overlay.is-open { display: flex; }

    .course-card-club.is-clickable {
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .course-card-club.is-clickable:hover,
    .course-card-club.is-clickable:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(232,163,23,.42);
      box-shadow: 0 16px 38px rgba(0,0,0,.28);
      outline: none;
    }

    .player-box {
      width: 100%;
      max-width: 760px;
      background: var(--zoo-bg-card);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(232,163,23,0.22);
      box-shadow: 0 30px 90px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.4);
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      margin: auto 0;
    }

    .player-box__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: linear-gradient(135deg, #1F5F3A 0%, #103a22 100%);
      border-bottom: 1px solid rgba(232,163,23,0.28);
      flex-shrink: 0;
      gap: 12px;
    }
    .player-box__header h3 {
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1.02rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: .01em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-box__header h3::before {
      content: '<svg class="zi" aria-hidden="true"><use href="#zi-play"/></svg>';
      color: var(--zoo-amber, #E8A317);
      font-size: .7rem;
      margin-right: 8px;
      vertical-align: middle;
    }
    .player-box__close,
    .player-box__fs {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      cursor: pointer;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      line-height: 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .18s;
    }
    .player-box__close { font-size: 1.35rem; }
    .player-box__fs   { font-size: 1.05rem; }
    .player-box__fs:hover {
      background: rgba(232,163,23,0.25);
      border-color: rgba(232,163,23,0.5);
      transform: scale(1.06);
    }
    .player-box__close:hover {
      background: rgba(213,90,40,0.35);
      border-color: rgba(213,90,40,0.6);
      transform: scale(1.06);
    }
    /* En modo cine el botón ampliar se resalta para indicar que está activo */
    .player-box.is-cinema .player-box__fs {
      background: rgba(111,191,115,0.32);
      border-color: rgba(111,191,115,0.6);
    }

    /* Video container 16:9 */
    .player-box__video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      flex-shrink: 0;
    }
    .player-box__video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Oculta visualmente + bloquea el botón "abrir en Drive" (pop-out) del iframe.
       Degradado oscuro que se funde con el fondo negro del video. */
    .drive-popout-blocker {
      position: absolute;
      top: 0;
      right: 0;
      width: 130px;
      height: 88px;
      z-index: 6;
      cursor: default;
      pointer-events: auto;
      background: radial-gradient(ellipse at top right, #000 0%, #000 38%, rgba(0,0,0,0) 78%);
    }

    /* Botón ampliar (modo cine) — estilos base compartidos arriba */
    .player-box__fs:hover { transform: scale(1.06); }

    /* Modo cine: el video ocupa toda la altura disponible y se oculta el resto */
    .player-box.is-cinema { height: calc(100vh - 80px); }
    .player-box.is-cinema .player-box__video {
      aspect-ratio: auto;
      flex: 1;
      height: auto;
      min-height: 0;
    }
    .player-box.is-cinema .player-box__info,
    .player-box.is-cinema .classes-list-box { display: none !important; }

    .player-box__info {
      padding: 14px 20px 18px;
      flex-shrink: 0;
    }
    .player-box__info p {
      color: var(--zoo-text-muted);
      font-size: .88rem;
      margin: 0;
      line-height: 1.5;
    }

    /* Lista de clases — compacta y scrolleable */
    .classes-list-box {
      background: var(--zoo-bg-card);
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .classes-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .classes-list-title {
      color: var(--zoo-amber);
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      margin: 0;
    }
    .classes-progress-bar {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .classes-progress-bar__fill {
      height: 100%;
      background: linear-gradient(90deg, #3d8b42, #6FBF73);
      border-radius: 100px;
      transition: width .6s;
    }
    .class-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .class-item.is-done {
      background: rgba(111,191,115,0.08);
      border-color: rgba(111,191,115,0.25);
    }
    .class-item.is-paywalled {
      background: rgba(232,163,23,0.055);
      border-color: rgba(232,163,23,0.2);
    }
    .class-item.is-free-preview {
      background: rgba(111,191,115,0.09);
      border-color: rgba(111,191,115,0.32);
    }
    .class-item__num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f1d17;
      font-weight: 800;
      font-size: .9rem;
      flex-shrink: 0;
      background: linear-gradient(135deg, #E8A317, #D68A0A);
    }
    .class-item.is-done .class-item__num {
      background: linear-gradient(135deg, #6FBF73, #3d8b42);
    }
    .class-item__body {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .class-item__title {
      color: #fff;
      font-weight: 600;
      font-size: .92rem;
      line-height: 1.3;
    }
    .class-item__desc {
      color: var(--zoo-text-muted);
      font-size: .82rem;
      line-height: 1.45;
      margin-top: 4px;
      margin-bottom: 2px;
    }
    .class-item.is-locked .class-item__desc {
      opacity: 0.5;
    }
    .class-item__meta {
      color: var(--zoo-text-dim);
      font-size: .76rem;
      margin-top: 4px;
    }
    .class-item.is-done .class-item__meta {
      color: #6FBF73;
    }
    .class-item__btn {
      background: rgba(111,191,115,0.15);
      border: 1px solid rgba(111,191,115,0.3);
      color: #6FBF73;
      padding: 6px 11px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      font-size: .74rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .class-item.is-done .class-item__btn {
      background: rgba(213,90,40,0.15);
      border-color: rgba(213,90,40,0.3);
      color: #D55A28;
    }
    .cert-btn-top {
      background: linear-gradient(135deg, #E8A317, #D68A0A);
      color: #1f1d17;
      border: 0;
      padding: 8px 16px;
      border-radius: 100px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: .8rem;
      white-space: nowrap;
    }
    .cert-btn-top--done {
      background: rgba(111,191,115,0.15);
      color: #6FBF73;
      border: 1px solid rgba(111,191,115,0.3);
    }

    @media (max-width: 640px) {
      .player-overlay { padding: 0; align-items: flex-start; }
      .player-box {
        max-width: 100%;
        max-height: 100vh;
        border-radius: 0;
        border: 0;
      }
      /* En modo cine el video llena toda la pantalla disponible */
      .player-box.is-cinema { height: 100vh; }
      .player-box__header { padding: 12px 16px; }
      .player-box__header h3 { font-size: .95rem; }
      .classes-list-box { padding: 14px 16px; }
    }
  </style>

<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" style="margin-bottom:12px;" aria-label="Menú"><svg class="zi" aria-hidden="true"><use href="#zi-menu"/></svg></button>

  <script src="../assets/js/club-curso-premio.js?v=20261022"></script>
  <script>
    // Solo esta clase es gratuita en todo Zoorigen.
    const ZOORIGEN_FREE_VIDEO_ID = 'befd1641-850a-4099-88a8-047a1badc703';

    function tieneMembresiaActiva() {
      const session = window.__zooSession;
      return ZOORIGEN_CLUB.hasActiveMembership(session);
    }

    const escHtml = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // La regla (clase gratis de siempre + clases marcadas en el panel) vive en club-acceso.js
    function esClaseGratis(lesson, curso, idx) {
      if (!window.ZOO_ACCESO) return String(lesson?.videoId || '') === ZOORIGEN_FREE_VIDEO_ID;
      // Con membresía no importa la prueba; sin ella rige el estado de la prueba gratuita
      const prueba = window.__zooSession && tieneMembresiaActiva() ? null : window.__zooPrueba;
      return ZOO_ACCESO.esClaseGratis(lesson, curso, prueba, idx);
    }
    // Estado de la prueba gratuita (hasta que el servidor responda, "no aplica" y todo sigue como antes)
    window.__zooPrueba = window.ZOO_ACCESO ? ZOO_ACCESO.estadoPrueba(null) : { elegible: false, elegida: null, aplica: false, cursosElegibles: [], cursoPorDefectoId: null };

    function mostrarPaywallCurso() {
      if (document.getElementById('zooCoursePaywall')) return;
      const overlay = document.createElement('div');
      overlay.id = 'zooCoursePaywall';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(7,12,9,.94);backdrop-filter:blur(12px);z-index:200000;display:flex;align-items:center;justify-content:center;padding:20px;';
      overlay.innerHTML = `
        <div style="width:min(500px,100%);position:relative;background:linear-gradient(145deg,#1F5F3A,#0F3B22 62%,#173c2a);border:2px solid rgba(232,163,23,.5);border-radius:22px;padding:38px 30px;text-align:center;box-shadow:0 32px 90px rgba(0,0,0,.72);">
          <button id="zooCoursePaywallClose" aria-label="Cerrar" style="position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:#fff;cursor:pointer;font-size:1rem;"><svg class="zi" aria-hidden="true"><use href="#zi-x"/></svg></button>
          <div style="font-size:3.5rem;margin-bottom:12px;"><svg class="zi" aria-hidden="true"><use href="#zi-lock"/></svg></div>
          <div style="display:inline-block;background:rgba(232,163,23,.18);color:#F2BC4A;border-radius:100px;padding:5px 13px;font-size:.72rem;font-weight:800;letter-spacing:.1em;margin-bottom:14px;">CONTENIDO VIP</div>
          <h2 style="font-family:Poppins;color:#fff;font-size:1.55rem;line-height:1.25;margin:0 0 12px;">Continúa aprendiendo con Zoorigen</h2>
          <p style="color:rgba(255,255,255,.88);font-size:.96rem;line-height:1.6;margin:0 0 24px;">Activa tu membresía para continuar con esta clase y acceder a todos los cursos de Zoorigen.</p>
          <button id="zooCourseSubscribe" style="width:100%;background:linear-gradient(135deg,#E8A317,#D68A0A);border:0;color:#1f1d17;padding:14px 20px;border-radius:12px;font:800 .95rem Poppins;cursor:pointer;box-shadow:0 8px 24px rgba(232,163,23,.3);">Ver planes de membresía</button>
          <button id="zooCourseContinue" style="margin-top:10px;background:transparent;border:0;color:rgba(255,255,255,.65);padding:8px;cursor:pointer;">Seguir explorando</button>
        </div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      document.getElementById('zooCoursePaywallClose').addEventListener('click', close);
      document.getElementById('zooCourseContinue').addEventListener('click', close);
      document.getElementById('zooCourseSubscribe').addEventListener('click', () => {
        closePlayer();
        close();
        window.location.href = 'club-suscripcion.html';
      });
    }

    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('biblioteca', session);
      if (ZOORIGEN_CLUB.initTheme) ZOORIGEN_CLUB.initTheme();
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();


      if (!ZOORIGEN_CLUB.hasActiveMembership(session)) {
        document.getElementById('lockedNotice').innerHTML = `<div class="status-banner" style="margin-bottom:20px;"><span><svg class="zi" aria-hidden="true"><use href="#zi-gift"/></svg></span>Tienes gratis la clase 1 del primer curso. Desde la clase 2 necesitas una membresía vigente. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Ver planes →</a></div>`;
      }

      // Estado de la prueba gratuita y cursos que el miembro ya abrió con un premio (en paralelo; si el servidor no responde, sin adelantados)
      const [estadoPrueba, adelantados] = await Promise.all([cargarEstadoPrueba(), cargarAdelantados(session)]);
      window.__zooPrueba = estadoPrueba;
      window.__zooAdelantados = adelantados;
      // Curso que la persona eligió en la guía o la encuesta de la portada (localStorage "zoo_curso_pref"):
      // solo se DESTACA, nunca se elige solo. Si ya eligió, tiene membresía o el curso ya no es elegible, se borra.
      window.__zooPref = window.ZOO_CURSO_PREF
        ? ZOO_CURSO_PREF.aplicar(estadoPrueba, window.localStorage, { tieneMembresia: ZOORIGEN_CLUB.hasActiveMembership(session) })
        : null;
      const cursosDeFirestore = await ZOORIGEN_CLUB.getCursos();
      // Los cursos nuevos (con "ordenVip") van al final de la fila de desbloqueo; los de siempre no se mueven.
      // Además, el curso que contiene la única clase gratuita aparece siempre primero, sin depender de la fecha de Firestore.
      const cursos = ZOO_ACCESO.ordenParaDesbloqueo(cursosDeFirestore);
      const grid = document.getElementById('coursesGrid');

      if (cursos.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--zoo-text-dim);background:var(--zoo-bg-card);border-radius:var(--zoo-radius);"><div style="font-size:3rem;margin-bottom:10px;"><img class="zi-logo" src="../assets/img/logo/logo.jpg" alt="Zoorigen" width="64" height="64"></div><h3 style="color:#fff;margin-bottom:8px;">Biblioteca en construcción</h3><p>El equipo Zoorigen está preparando los cursos. Muy pronto tendrás acceso ilimitado.</p></div>`;
        document.getElementById('filterBar').innerHTML = '';
        return;
      }

      const areas = ['Todas', ...new Set(cursos.map(c => c.area).filter(Boolean))];
      const filterBar = document.getElementById('filterBar');
      filterBar.innerHTML = areas.map((a, i) => `<button class="filter-chip-club ${i === 0 ? 'is-active' : ''}" data-area="${a}">${a}</button>`).join('');

      const isActive = ZOORIGEN_CLUB.hasActiveMembership(session);

      // El avance lo guarda y lo valida el servidor (GET /api/cursos/progreso). Si no responde, se muestra lo último
      // que se vio (solo para mostrar: guardar clases y certificar siempre pasa por el servidor).
      const progress = await ZOORIGEN_CLUB.getCourseProgress(session.uid);
      window.__zooCourseProgress = progress;
      window.__zooSession = session;
      if (progress.__desdeCache === true) zcToast('No pudimos conectar con el servidor. Mostramos tu último avance guardado; se actualiza cuando vuelva la conexión.', true);

      // Convertir URL de Google Drive a URL directa de imagen
      // Soporta varios formatos:
      // - https://drive.google.com/file/d/FILE_ID/view
      // - https://drive.google.com/open?id=FILE_ID
      // - https://drive.google.com/uc?id=FILE_ID
      // - https://drive.google.com/thumbnail?id=FILE_ID
      function convertImageUrl(url) {
        if (!url) return '';
        url = String(url).trim();

        // Ya es URL directa de imagen
        if (!url.includes('drive.google.com')) return url;

        // Extraer FILE_ID de Drive
        let fileId = null;
        const patterns = [
          /\/file\/d\/([a-zA-Z0-9_-]+)/,
          /\/open\?id=([a-zA-Z0-9_-]+)/,
          /[?&]id=([a-zA-Z0-9_-]+)/,
          /\/d\/([a-zA-Z0-9_-]+)/
        ];
        for (const p of patterns) {
          const m = url.match(p);
          if (m) { fileId = m[1]; break; }
        }

        if (!fileId) return url; // No pudo extraer, dejar original

        // Usar endpoint de thumbnail (más confiable para hotlink que uc?export=view)
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
      }
      window.__convertImg = convertImageUrl;

      // ═══════════════ CATÁLOGO (diseño de tarjetas estilo alintecfood) ═══════════════
      // Modo según quién entra:
      //   miembro   → con membresía vigente (desbloqueo: 1 curso cada 8 días, o tras su curso de prueba)
      //   pendiente → nunca pagó y todavía no elige su prueba gratuita
      //   prueba    → ya eligió su curso de prueba
      //   libre     → el servidor de la prueba no respondió o no aplica (se comporta como antes)
      const modoCatalogo = () => {
        const p = window.__zooPrueba;
        return isActive ? 'miembro' : (p.elegible ? 'pendiente' : (p.elegida ? 'prueba' : 'libre'));
      };
      const diasComoMiembro = () => ZOO_ACCESO.diasComoMiembro(session);
      // Desbloqueo de un curso (se calcula sobre la lista COMPLETA, no sobre el filtro de área)
      window.__zooDesbloqueo = (curso) => {
        const dias = diasComoMiembro();
        const i = cursos.findIndex(x => x.id === curso.id);
        if (!isActive || !window.ZOO_ACCESO) return { desbloqueado: true, diasFalta: 0, motivo: null };
        return ZOO_ACCESO.desbloqueoCurso({ lista: cursos, i, dias, prueba: window.__zooPrueba, progreso: window.__zooCourseProgress, adelantados: window.__zooAdelantados });
      };
      window.__zooCursosLista = cursos;

      const avisoSuperior = (modo, dias) => {
        const caja = document.getElementById('unlockInfo');
        const aviso = document.getElementById('lockedNotice');
        const p = window.__zooPrueba;
        caja.innerHTML = '';
        if (modo === 'pendiente') {
          const pref = window.__zooPref && p.cursosElegibles.includes(window.__zooPref.id) ? cursos.find(c => c.id === window.__zooPref.id) : null;
          caja.innerHTML = window.ZOO_CURSOS_UI.bannerPruebaHTML(pref ? { id: pref.id, titulo: pref.title } : null);
          aviso.innerHTML = '';
        } else if (modo === 'prueba') {
          const elegido = cursos.find(c => c.id === p.elegida);
          aviso.innerHTML = `<div class="status-banner" style="margin-bottom:20px;"><span><svg class="zi" aria-hidden="true"><use href="#zi-gift"/></svg></span>Tu prueba gratuita: <strong>${escHtml(elegido ? elegido.title : 'curso elegido')}</strong>. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Ver planes →</a></div>`;
        } else if (modo === 'miembro') {
          const lista = cursos;
          if (p.elegida && lista.some(c => c.id === p.elegida)) {
            const fin = window.ZOO_ACCESO.terminoPruebaEn((window.__zooCourseProgress || {})[p.elegida]);
            caja.innerHTML = fin === null
              ? `<div class="unlock-schedule-banner"><div class="unlock-schedule-banner__icon"><svg class="zi" aria-hidden="true"><use href="#zi-lock-open"/></svg></div><div class="unlock-schedule-banner__text">Termina tu curso de prueba para empezar tu ruta VIP: <strong>1 curso nuevo cada 8 días</strong>. El conteo empieza cuando lo termines.</div></div>`
              : `<div class="unlock-schedule-banner"><div class="unlock-schedule-banner__icon"><svg class="zi" aria-hidden="true"><use href="#zi-lock-open"/></svg></div><div class="unlock-schedule-banner__text">Tu ruta VIP: <strong>1 curso nuevo cada 8 días</strong> desde que terminaste tu curso de prueba.</div></div>`;
          } else {
            const maxIdx = ZOO_ACCESO.maxDesbloqueado(dias);
            const enFila = ZOO_ACCESO.cursosEnFila(lista);
            // Sin premios usados la cuenta es la de siempre; con premios se cuentan también los cursos adelantados.
            let ruta = null;
            if ((window.__zooAdelantados || []).length) {
              const r = ZOO_ACCESO.resumenDesbloqueo({ lista, dias, adelantados: window.__zooAdelantados });
              if (r.bloqueados > 0) ruta = { disponibles: r.disponibles, faltan: r.faltan };
            } else if (enFila > maxIdx + 1) {
              ruta = { disponibles: Math.min(enFila, maxIdx + 1) + (lista.length - enFila), faltan: Math.max(0, ((maxIdx + 1) * 8) - dias) };
            }
            if (ruta) {
              const faltan = ruta.faltan;
              caja.innerHTML = `<div class="unlock-schedule-banner"><div class="unlock-schedule-banner__icon"><svg class="zi" aria-hidden="true"><use href="#zi-lock-open"/></svg></div><div class="unlock-schedule-banner__text">Tu ruta VIP: <strong>1 curso nuevo cada 8 días</strong>. Llevas <strong>${dias} día${dias !== 1 ? 's' : ''}</strong> como miembro, tienes <strong>${ruta.disponibles}</strong> de ${lista.length} cursos disponibles.${faltan > 0 ? ` El siguiente se desbloquea en <strong>${faltan} día${faltan !== 1 ? 's' : ''}</strong>.` : ''}</div></div>`;
            }
          }
        }
      };

      const render = (filter = 'Todas') => {
        window.__zooFiltro = filter;
        const UI = window.ZOO_CURSOS_UI, ACC = window.ZOO_ACCESO;
        const modo = modoCatalogo();
        const p = window.__zooPrueba;
        const dias = diasComoMiembro();
        window.__zooCardsPorId = {};
        avisoSuperior(modo, dias);

        let lista = filter === 'Todas' ? cursos : cursos.filter(c => c.area === filter);
        // El curso de prueba (si lo hay) se muestra primero; no cambia el orden de desbloqueo de los demás.
        if (p.elegida) lista = lista.slice().sort((a, b) => (b.id === p.elegida ? 1 : 0) - (a.id === p.elegida ? 1 : 0));
        // Pendiente de elegir: el curso que escogió en la guía (si sigue siendo elegible) va primero y destacado.
        const prefId = modo === 'pendiente' && window.__zooPref && p.cursosElegibles.includes(window.__zooPref.id) ? window.__zooPref.id : null;
        if (prefId) lista = lista.slice().sort((a, b) => (b.id === prefId ? 1 : 0) - (a.id === prefId ? 1 : 0));

        window.__zooCourseCards = {};
        grid.className = 'zc-grid';
        grid.innerHTML = lista.map(c => {
          const lecciones = (c.lecciones && c.lecciones.length) ? c.lecciones : (c.driveId ? [{ titulo: c.title, driveId: c.driveId, duration: c.duration }] : []);
          window.__zooCourseCards[c.id] = { ...c, lecciones };
          const imagen = convertImageUrl(c.image);
          const hasContent = lecciones.length > 0;
          if (modo === 'pendiente') {
            const esElegible = p.cursosElegibles.includes(c.id);
            // Ningún curso está impuesto como prueba: se puede elegir cualquiera que el servidor marque como elegible
            return UI.tarjetaPendienteHTML(c, { imagen, elegible: esElegible, motivoNo: 'No disponible como prueba', destacado: c.id === prefId });
          }
          const prog = (window.__zooCourseProgress || {})[c.id] || { completedLessons: [], isCompleted: false };
          const pruebaGratis = isActive ? null : p;
          const clasesGratis = isActive ? 0 : lecciones.filter((l, i) => esClaseGratis(l, { ...c, lecciones }, i)).length;
          return UI.tarjetaHTML({ ...c, lecciones }, {
            imagen, modo, completadas: prog.completedLessons.length, certificado: prog.isCompleted === true,
            desbloqueo: isActive ? window.__zooDesbloqueo(c) : null,
            esPrueba: modo === 'prueba' && c.id === p.elegida, clasesGratis,
            abrible: hasContent
          });
        }).join('');
      };

      window.__zooRender = render;
      render();

      // Un solo juego de eventos para todas las tarjetas
      grid.addEventListener('click', (ev) => {
        const elegir = ev.target.closest('[data-elegir]');
        if (elegir) { ev.stopPropagation(); confirmarPrueba(elegir.dataset.elegir); return; }
        const card = ev.target.closest('.zc-card');
        if (card && card.dataset.id) openCourseCard({ type: 'click', target: ev.target, currentTarget: card }, card.dataset.id);
      });
      grid.addEventListener('keydown', (ev) => {
        const card = ev.target.closest && ev.target.closest('.zc-card');
        if (card && ev.target === card && card.dataset.id) openCourseCard(ev, card.dataset.id);
      });

      // El botón "Elegir este curso" del aviso (curso sugerido por la guía) abre la MISMA confirmación de siempre
      document.getElementById('unlockInfo').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-elegir]');
        if (b) confirmarPrueba(b.dataset.elegir);
      });

      // Llegó desde "Elegir mi curso" de la bienvenida: lleva a la selección y la resalta
      if (new URLSearchParams(location.search).get('elegir') === '1') {
        const b = document.getElementById('prueba-card');
        if (b) { b.scrollIntoView({ behavior: 'smooth', block: 'center' }); b.classList.add('zc-banner--pulso'); }
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
      }

      filterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-chip-club');
        if (!btn) return;
        filterBar.querySelectorAll('.filter-chip-club').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        render(btn.dataset.area);
      });
    })();

    // ═══════════════ PRUEBA GRATUITA A ELEGIR ═══════════════
    const URL_PRUEBA = 'https://zoorigen-webhook-production.up.railway.app/api/prueba-gratuita';

    async function llamarPrueba(metodo, cuerpo) {
      const user = firebase.auth().currentUser;
      if (!user) throw new Error('Tu sesión expiró. Vuelve a iniciar sesión.');
      const token = await user.getIdToken();
      const ctl = new AbortController();
      const corte = setTimeout(() => ctl.abort(), 9000);
      try {
        const r = await fetch(URL_PRUEBA, {
          method: metodo, signal: ctl.signal,
          headers: Object.assign({ Authorization: 'Bearer ' + token }, cuerpo ? { 'Content-Type': 'application/json' } : {}),
          body: cuerpo ? JSON.stringify(cuerpo) : undefined
        });
        const datos = await r.json().catch(() => ({}));
        return { ok: r.ok, status: r.status, datos };
      } finally { clearTimeout(corte); }
    }

    // Estado de la prueba gratuita. Si el servidor no responde, la prueba "no aplica" y todo sigue como antes.
    async function cargarEstadoPrueba() {
      try {
        const r = await llamarPrueba('GET');
        return ZOO_ACCESO.estadoPrueba(r.ok ? r.datos : null);
      } catch (e) {
        console.warn('[prueba gratuita] sin respuesta del servidor:', e.message || e);
        return ZOO_ACCESO.estadoPrueba(null);
      }
    }

    // Cursos que el miembro ya abrió con un premio (GET /api/premios). Solo con membresía vigente y con un tiempo corto de espera:
    // si el servidor no responde, no hay adelantados y la biblioteca funciona exactamente como siempre.
    async function cargarAdelantados(session) {
      try {
        if (!window.ZOO_PREMIOS || !ZOORIGEN_CLUB.hasActiveMembership(session)) return [];
        const r = await ZOO_PREMIOS.consultar(4000);
        return r.ok ? ZOO_ACCESO.adelantadosDeRespuesta(r.crudo) : [];
      } catch (e) {
        console.warn('[premios] sin respuesta del servidor:', e.message || e);
        return [];
      }
    }

    function zcToast(texto, error) {
      const t = document.createElement('div');
      t.className = 'zc-toast' + (error ? ' zc-toast--error' : '');
      t.setAttribute('role', 'status');
      t.textContent = texto;
      document.body.appendChild(t);
      setTimeout(() => t.classList.add('is-in'), 20);
      setTimeout(() => { t.classList.remove('is-in'); setTimeout(() => t.remove(), 300); }, 4200);
    }

    // "Selecciona tu prueba gratuita": se muestra al tocar un curso o una clase antes de elegir
    function avisoSeleccionaPrueba(cursoId) {
      const elegible = cursoId && window.__zooPrueba.cursosElegibles.includes(cursoId);
      ZOO_CURSOS_UI.ventana({
        titulo: 'Selecciona tu prueba gratuita',
        cuerpoHTML: '<p>Elige el curso de tu preferencia para poder ver el contenido de los cursos.</p>',
        botones: [{ texto: 'Cerrar' }].concat(elegible
          ? [{ texto: 'Elegir este curso', clase: 'zc-btn--main', alPulsar: () => { setTimeout(() => confirmarPrueba(cursoId), 0); } }]
          : [])
      });
    }

    function confirmarPrueba(cursoId) {
      const curso = window.__zooCourseCards?.[cursoId];
      if (!curso || !window.__zooPrueba.cursosElegibles.includes(cursoId)) return;
      const img = ZOO_CURSOS_UI.urlSegura(window.__convertImg ? window.__convertImg(curso.image) : curso.image);
      ZOO_CURSOS_UI.ventana({
        titulo: '¿Seguro que deseas este curso?',
        subtitulo: 'Tu prueba gratuita',
        cuerpoHTML: `<div class="zc-conf"><span class="zc-conf__img"${img ? ` style="--zc-img:url('${ZOO_CURSOS_UI.esc(img)}')"` : ''}></span><strong>${ZOO_CURSOS_UI.esc(curso.title)}</strong></div>
          <p>Será tu <b>prueba gratuita</b>.</p>
          <p><b>Solo puedes elegir uno y después no se puede cambiar.</b></p>`,
        botones: [
          { texto: 'No, ver otros cursos' },
          { texto: 'Sí, es mi prueba gratuita', clase: 'zc-btn--main', alPulsar: async ({ boton }) => {
              boton.disabled = true; boton.textContent = 'Guardando…';
              try {
                const r = await llamarPrueba('POST', { cursoId });
                if (!r.ok) {
                  zcToast(r.datos && r.datos.error ? r.datos.error : 'No se pudo guardar tu elección. Intenta de nuevo.', true);
                  if (r.status === 409 || r.status === 403) { window.__zooPrueba = await cargarEstadoPrueba(); window.__zooRender(window.__zooFiltro); }
                  else { boton.disabled = false; boton.textContent = 'Sí, es mi prueba gratuita'; return false; }
                  return;
                }
              } catch (e) {
                zcToast('No se pudo guardar tu elección. Revisa tu conexión e intenta de nuevo.', true);
                boton.disabled = false; boton.textContent = 'Sí, es mi prueba gratuita';
                return false;
              }
              window.__zooPrueba = ZOO_ACCESO.estadoPrueba({ elegible: false, elegida: { cursoId } });
              // Ya eligió: la sugerencia de la guía deja de aplicar
              window.__zooPref = null;
              if (window.ZOO_CURSO_PREF) ZOO_CURSO_PREF.borrar(window.localStorage);
              window.__zooRender(window.__zooFiltro);
              zcToast('¡Listo! Tu prueba gratuita está activa. Ya puedes ver las clases de «' + curso.title + '».');
              setTimeout(() => openCourseDetail(window.__zooCourseCards[cursoId]), 150);
            } }
        ]
      });
    }

    // ═══════════════ TARJETAS Y DETALLE DEL CURSO ═══════════════
    function openCourseCard(event, courseId) {
      const isKeyboard = event.type === 'keydown';
      if (isKeyboard && event.key !== 'Enter' && event.key !== ' ') return;
      if (isKeyboard && event.target !== event.currentTarget) return;
      // Los botones y enlaces internos conservan su acción sin abrir dos veces.
      if (!isKeyboard && event.target.closest('button,a')) return;
      const course = window.__zooCourseCards?.[courseId];
      if (!course) return;
      if (isKeyboard) event.preventDefault();
      // Quien todavía no eligió su prueba gratuita debe elegir primero
      if (!tieneMembresiaActiva() && window.__zooPrueba.elegible) { avisoSeleccionaPrueba(courseId); return; }
      openCourseDetail(course);
    }
    window.openCourseCard = openCourseCard;

    function openCourseDetail(course) {
      window.__currentCourse = course;
      window.__currentLecciones = course.lecciones || [];
      renderCourseModal();
    }

    function aviso(titulo, cuerpoHTML) {
      ZOO_CURSOS_UI.ventana({ titulo, cuerpoHTML, botones: [{ texto: 'Entendido', clase: 'zc-btn--main' }] });
    }

    // Clic en una clase de la lista del detalle
    function zcClickClase(i, accion) {
      const desbloqueo = tieneMembresiaActiva() ? window.__zooDesbloqueo(window.__currentCourse) : { desbloqueado: true };
      if (accion === 'abrir') { openLessonByIndex(i); return; }
      if (accion === 'paywall') { mostrarPaywallCurso(); return; }
      if (accion === 'aviso-espera') {
        if (desbloqueo.motivo === 'termina-prueba') {
          aviso('Termina primero tu curso de prueba', '<p>Cuando termines tu curso de prueba con tu membresía activa empieza tu ruta VIP: tu siguiente curso se abre 8 días después y los demás cada 8 días.</p>');
        } else {
          aviso(ZOO_CURSOS_UI.textoFaltan(desbloqueo), '<p>Este curso se abre pronto. Los cursos se desbloquean uno cada 8 días. Mientras tanto puedes ver de qué trata y qué clases incluye.</p>');
        }
        return;
      }
      aviso('Completa la clase anterior', '<p>Marca como vista la clase anterior (terminando sus preguntas y su juego, si los tiene) para desbloquear esta.</p>');
    }

    function zcAccion(id) {
      const curso = window.__currentCourse;
      if (id === 'continuar') { if (Number.isInteger(window.__zcSiguiente)) openLessonByIndex(window.__zcSiguiente); }
      else if (id === 'cert') terminarCurso(curso.id);
      else if (id === 'vercert') verCertificado(curso.id);
    }

    function renderCourseModal() {
      const course = window.__currentCourse;
      const lecciones = window.__currentLecciones;
      const UI = window.ZOO_CURSOS_UI;
      const esMiembro = tieneMembresiaActiva();
      const progress = window.__zooCourseProgress[course.id] || { completedLessons: [], isCompleted: false };
      const hechas = progress.completedLessons;
      const total = lecciones.length;
      const todas = hechas.length >= total && total > 0;
      const imagen = window.__convertImg ? window.__convertImg(course.image) : course.image;
      const espera = esMiembro ? window.__zooDesbloqueo(course) : { desbloqueado: true, diasFalta: 0, motivo: null };
      const enPrueba = !esMiembro && window.__zooPrueba.elegida === course.id;
      const nextAvailable = lecciones.findIndex((_, i) => !hechas.includes(i));

      const filas = lecciones.map((l, i) => {
        const est = UI.estadoClase({
          hecha: hechas.includes(i), anteriorHecha: i > 0 && hechas.includes(i - 1), esPrimera: i === 0,
          esMiembro, gratis: esClaseGratis(l, course, i), espera, esSiguiente: i === nextAvailable
        });
        return { i, titulo: l.titulo || 'Clase ' + (i + 1), duracion: l.duration || '', estado: est.estado, texto: est.texto, accion: est.accion,
          preguntas: cantidadPreguntas(l), juego: nombreJuegoDeClase(l) };
      });

      // Botón principal: comenzar / continuar (solo si el curso está disponible)
      let accionPrincipal = null;
      window.__zcSiguiente = null;
      if (espera.desbloqueado && nextAvailable >= 0 && total > 0) {
        const f = filas[nextAvailable];
        if (f && f.accion === 'abrir') {
          window.__zcSiguiente = nextAvailable;
          accionPrincipal = { id: 'continuar', texto: hechas.length ? `Continuar con la clase ${nextAvailable + 1}` : 'Comenzar el curso' };
        }
      }
      // El certificado lo emite el servidor al completar la última clase. "Ver certificado" solo abre el que ya existe;
      // si todas las clases están vistas pero el servidor aún no lo emitió, el botón vuelve a pedirlo al servidor.
      const certificadoHTML = progress.isCompleted && progress.certificateFolio
        ? '<button type="button" class="zc-cert-btn" data-zc="vercert">Ver certificado</button>'
        : (todas ? '<button type="button" class="zc-cert-btn" data-zc="cert">Terminar curso y pedir mi certificado</button>' : '');

      const modal = document.getElementById('playerOverlay');
      document.getElementById('playerTitle').textContent = 'Detalle del curso';
      document.getElementById('playerVideo').innerHTML = '';
      document.getElementById('playerDesc').textContent = '';

      const box = modal.querySelector('.player-box');
      const oldList = box.querySelector('.classes-list-box');
      if (oldList) oldList.remove();
      box.querySelector('.player-box__video').style.display = 'none';
      box.querySelector('.player-box__info').style.display = 'none';

      const listEl = document.createElement('div');
      listEl.className = 'classes-list-box';
      listEl.innerHTML = UI.detalleHTML({
        curso: { ...course, description: course.description }, imagen, completadas: hechas.length, total, filas, espera,
        accionPrincipal, certificadoHTML, etiquetaPrueba: enPrueba ? 'Prueba gratuita' : ''
      });
      box.appendChild(listEl);
      modal.classList.add('is-open');
    }

    // Un solo juego de eventos para la lista de clases y los botones del detalle
    (function () {
      const ov = document.getElementById('playerOverlay');
      ov.addEventListener('click', (ev) => {
        const fila = ev.target.closest('.zc-fila');
        if (fila) { zcClickClase(parseInt(fila.dataset.i, 10), fila.dataset.accion); return; }
        const b = ev.target.closest('[data-zc]');
        if (b) zcAccion(b.dataset.zc);
      });
      ov.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        const fila = ev.target.closest && ev.target.closest('.zc-fila');
        if (fila && ev.target === fila) { ev.preventDefault(); zcClickClase(parseInt(fila.dataset.i, 10), fila.dataset.accion); }
      });
    })();

    // Genera una descripción breve y útil basada en el título de la clase
    function generarDescripcionClase(titulo, index, total) {
      const t = (titulo || '').toLowerCase();
      if (index === 0) return 'Introducción, conceptos clave y lo que aprenderás en este curso.';
      if (index === total - 1) return 'Cierre del curso, aplicaciones prácticas y siguientes pasos.';
      // Detectar temas por palabras clave en el título
      if (/introducci|bienvenid|presenta/.test(t)) return 'Conceptos fundamentales y bienvenida al tema.';
      if (/fundamen|bas[ei]|princip/.test(t)) return 'Principios teóricos esenciales antes de ver los casos prácticos.';
      if (/identifica|morfolog|anatom/.test(t)) return 'Cómo identificar características clave en campo.';
      if (/manejo|captur|conteni|inmoviliz/.test(t)) return 'Técnicas y protocolos profesionales de manejo seguro.';
      if (/rehabilita|rescate|atenci/.test(t)) return 'Procedimientos paso a paso desde la recepción hasta la liberación.';
      if (/alimenta|nutric|diet/.test(t)) return 'Requerimientos nutricionales y planes de alimentación.';
      if (/enfermedad|patolog|zoono|sanitar/.test(t)) return 'Principales patologías, diagnóstico y tratamiento.';
      if (/legisla|norm|cites|uma|permiso/.test(t)) return 'Marco legal mexicano vigente y documentación requerida.';
      if (/monitoreo|fototrampeo|telemetr|seguimien/.test(t)) return 'Métodos científicos de monitoreo y análisis de datos.';
      if (/conserva|protecci|amenaz/.test(t)) return 'Estado actual, amenazas y estrategias de conservación.';
      if (/reproducci|cría|crianza/.test(t)) return 'Técnicas de reproducción en cautiverio y manejo de crías.';
      if (/habitat|ecosistem|distribuci/.test(t)) return 'Hábitat natural, distribución geográfica y requerimientos ecológicos.';
      if (/caso|clínico|ejemplo/.test(t)) return 'Caso real paso a paso con diagnóstico y resolución.';
      if (/práctic|ejercici|taller/.test(t)) return 'Práctica guiada para aplicar lo aprendido.';
      if (/primer.*auxil|emergencia/.test(t)) return 'Atención inmediata ante casos de urgencia en campo.';
      return `Contenido clave de la clase ${index + 1}: conceptos, ejemplos y aplicación práctica.`;
    }

    // ═══════════════ AVANCE Y CERTIFICADO (los guarda y valida el servidor) ═══════════════
    // El navegador ya no guarda el avance ni crea certificados. Cada clase vista se manda a
    // POST /api/cursos/:id/progreso: el servidor revisa el orden de las clases y las preguntas, y emite el
    // certificado (con su folio) solo cuando se completa la última clase. Una clase vista no se puede des-marcar.

    const clasesEnProceso = new Set();   // 'curso:indice' que esperan la respuesta del servidor
    const quizzesValidados = new Set();  // 'curso:indice' cuyas preguntas el servidor ya registró en esta sesión

    // Error del servidor en una ventana propia de la página (no en un cuadro del navegador). Quien no tiene membresía ve además el acceso a los planes.
    function avisoErrorProgreso(err, titulo) {
      const esMiembro = tieneMembresiaActiva();
      const texto = (err && err.mensajeUsuario) || ZOO_PROGRESO.mensajeError(err, { accion: 'clase', esMiembro });
      const botones = [{ texto: 'Cerrar' }];
      if (err && err.status === 403 && !esMiembro) {
        botones.push({ texto: 'Ver planes de membresía', clase: 'zc-btn--main', alPulsar: () => { window.location.href = 'club-suscripcion.html'; } });
      }
      ZOO_CURSOS_UI.ventana({ titulo: titulo || 'No se pudo guardar tu avance', cuerpoHTML: '<p>' + escHtml(texto) + '</p>', botones });
    }

    // Manda al servidor que la clase se vio. Devuelve la respuesta ({ entrada, completado, nuevoCompletado, certificado })
    // o null si falló (el error ya se mostró) o si ya había una petición igual en curso.
    // Una clase que ya estaba vista no se vuelve a mandar (salvo la última de un curso sin certificado).
    async function guardarClaseVista(courseId, lessonIdx, opciones) {
      const o = opciones || {};
      const progress = window.__zooCourseProgress;
      const previa = progress[courseId];
      const total = (window.__currentLecciones || []).length;
      const esUltima = total > 0 && lessonIdx === total - 1;
      if (previa && previa.completedLessons.includes(lessonIdx) && (previa.isCompleted === true || !esUltima)) {
        return { entrada: previa, completado: previa.isCompleted === true, nuevoCompletado: false, certificado: null, repetida: true };
      }
      const clave = courseId + ':' + lessonIdx;
      if (clasesEnProceso.has(clave)) return null;
      clasesEnProceso.add(clave);
      try {
        const r = await ZOORIGEN_CLUB.registrarClaseVista(String(courseId), lessonIdx, { esMiembro: tieneMembresiaActiva() });
        progress[courseId] = r.entrada;
        return r;
      } catch (err) {
        console.warn('[progreso] no se pudo registrar la clase:', err && err.message);
        const texto = (err && err.mensajeUsuario) || 'No se pudo guardar tu avance. Inténtalo de nuevo.';
        if (o.discreto) zcToast(texto, true); else avisoErrorProgreso(err);
        return null;
      } finally {
        clasesEnProceso.delete(clave);
      }
    }

    // Tarjeta "Curso completado" (XP ganado) y después el certificado, con el folio que emitió el servidor.
    async function celebrarCursoCompletado(courseId, r) {
      const folio = r && r.entrada && r.entrada.certificateFolio;
      const curso = (window.__zooCourseCards || {})[courseId] || window.__currentCourse || {};
      const titulo = (r && r.certificado && r.certificado.curso) || curso.title || 'Curso Zoorigen';
      closePlayer();
      if (!folio) {
        zcToast('¡Completaste el curso! Tu certificado aparecerá en "Mis certificados".');
        renderCourseModal();
        return;
      }
      const abrirCertificado = () => {
        window.open('ver-certificado.html?folio=' + encodeURIComponent(folio), '_blank');
        setTimeout(() => window.location.reload(), 800);
      };
      if (window.ZOO_CURSO_PREMIO && typeof ZOO_CURSO_PREMIO.mostrar === 'function') {
        // Si el servidor no responde, abre el certificado directo. Si cierran la tarjeta sin abrirlo, solo se recarga.
        const res = await ZOO_CURSO_PREMIO.mostrar({ courseId: String(courseId), titulo, alVerCertificado: abrirCertificado });
        if (res && res.tarjeta && !res.abrio) window.location.reload();
      } else {
        setTimeout(abrirCertificado, 300);
      }
    }

    // Botón "Terminar curso" del detalle: pide al servidor la última clase otra vez (con sus preguntas si aún faltan).
    function terminarCurso(courseId) {
      const total = (window.__currentLecciones || []).length;
      if (!total || !window.__currentCourse || String(window.__currentCourse.id) !== String(courseId)) return;
      marcarYSiguiente(courseId, total - 1);
    }

    // "Ver certificado": abre el certificado con el folio que guardó el servidor.
    function verCertificado(courseId) {
      const progress = window.__zooCourseProgress[courseId];
      if (!progress || !progress.certificateFolio) {
        aviso('Certificado no disponible', '<p>Todavía no encontramos el folio de este certificado. Recarga la página; si el problema sigue, escribe a soporte.</p>');
        return;
      }
      window.open('ver-certificado.html?folio=' + encodeURIComponent(progress.certificateFolio), '_blank');
    }

    function openLessonByIndex(lessonIdx) {
      const lesson = window.__currentLecciones?.[lessonIdx];
      if (!lesson || !window.__currentCourse) return;
      if (tieneMembresiaActiva() && !window.__zooDesbloqueo(window.__currentCourse).desbloqueado) { zcClickClase(lessonIdx, 'aviso-espera'); return; }
      openPlayer(
        lesson,
        lesson.titulo || 'Clase ' + (lessonIdx + 1),
        lesson.duration || '',
        window.__currentCourse.id,
        lessonIdx
      );
    }
    window.openLessonByIndex = openLessonByIndex;

    async function openPlayer(lessonOrId, title, desc, courseId, lessonIdx) {
      const lesson = typeof lessonOrId === 'object' && lessonOrId !== null
        ? lessonOrId
        : { driveId: lessonOrId };

      // Una sola clase es gratuita en toda la plataforma. Todas las demás
      // muestran el paywall por encima del detalle antes de cargar el video.
      if (!tieneMembresiaActiva() && !esClaseGratis(lesson, window.__currentCourse, lessonIdx)) {
        mostrarPaywallCurso();
        return;
      }
      const modal = document.getElementById('playerOverlay');
      const box = modal.querySelector('.player-box');

      const oldList = box.querySelector('.classes-list-box');
      if (oldList) oldList.remove();

      box.querySelector('.player-box__video').style.display = '';
      box.querySelector('.player-box__info').style.display = '';

      document.getElementById('playerTitle').textContent = title;

      // Info del player con detalle + botón volver a lista
      const descDiv = document.getElementById('playerDesc');
      descDiv.innerHTML = '';

      const infoContent = document.createElement('div');
      infoContent.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;';
      const hayLista = courseId !== undefined && window.__currentLecciones?.length > 1;
      const esUltimaClase = lessonIdx !== undefined && lessonIdx === (window.__currentLecciones?.length || 0) - 1;
      const puedeCompletar = courseId !== undefined && lessonIdx !== undefined;
      infoContent.innerHTML = `
        <span style="color:var(--zoo-text-muted);font-size:.88rem;">
          ${desc ? '' + desc : ''}
          ${courseId !== undefined && lessonIdx !== undefined ? `${desc ? ' · ' : ''}Clase ${lessonIdx + 1} de ${window.__currentLecciones?.length || 1}` : ''}
        </span>
        ${hayLista || puedeCompletar ? `
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${hayLista ? `<button onclick="renderCourseModal()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:7px 14px;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.8rem;">
              ← Lista de clases
            </button>` : ''}
            ${puedeCompletar ? `<button id="zooBtnCompletarClase" onclick="marcarYSiguiente('${courseId}', ${lessonIdx})" style="background:linear-gradient(135deg,#6FBF73,#3d8b42);border:0;color:#fff;padding:7px 14px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;font-size:.8rem;">
              ${esUltimaClase ? 'Terminar curso' : 'Completada, siguiente →'}
            </button>` : ''}
          </div>
        ` : ''}
      `;
      descDiv.appendChild(infoContent);

      const playerVideo = document.getElementById('playerVideo');
      playerVideo.innerHTML = '<div style="display:grid;place-items:center;min-height:420px;color:#fff;font-weight:700;"><svg class="zi" aria-hidden="true"><use href="#zi-hourglass"/></svg> Preparando reproducción segura…</div>';
      modal.classList.add('is-open');

      try {
        if (lesson.videoId) {
          const currentUser = firebase.auth().currentUser;
          if (!currentUser) throw new Error('Tu sesión expiró. Vuelve a iniciar sesión.');

          const idToken = await currentUser.getIdToken();
          const response = await fetch('https://zoorigen-webhook-production.up.railway.app/api/bunny/embed-token', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${idToken}`
            },
            body: JSON.stringify({ videoId: lesson.videoId })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.embedUrl) {
            throw new Error(payload.error || `No se pudo abrir la clase (HTTP ${response.status})`);
          }
          playerVideo.innerHTML = `<iframe src="${payload.embedUrl}" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen></iframe>`;
        } else if (lesson.driveId) {
          // Compatibilidad temporal para cursos que todavía no se hayan sincronizado.
          playerVideo.innerHTML = `<iframe src="https://drive.google.com/file/d/${lesson.driveId}/preview" allow="autoplay" allowfullscreen></iframe><div class="drive-popout-blocker"></div>`;
        } else {
          throw new Error('Esta clase todavía no tiene un video vinculado.');
        }
      } catch (error) {
        console.error('[Bunny player]', error);
        playerVideo.innerHTML = `<div style="display:grid;place-items:center;min-height:420px;padding:28px;text-align:center;color:#fff;"><div><div style="font-size:2rem;margin-bottom:12px;"><svg class="zi" aria-hidden="true"><use href="#zi-triangle-alert"/></svg></div><strong>No se pudo reproducir la clase</strong><p style="color:var(--zoo-text-muted);margin-top:8px;">${String(error.message || error)}</p></div></div>`;
      }

      clearTimeout(window.__autoCompleteTimer);
      // Una clase sin preguntas ni juego se registra sola a los 30 s, pero la ÚLTIMA nunca: terminar el curso (y
      // recibir el certificado) es siempre una acción explícita con el botón "Terminar curso".
      const totalClases = window.__currentLecciones?.length || 0;
      if (courseId !== undefined && lessonIdx !== undefined && !leccionTieneActividad(lesson) && lessonIdx < totalClases - 1) {
        window.__autoCompleteTimer = setTimeout(() => {
          guardarClaseVista(courseId, lessonIdx, { discreto: true });
        }, 30000);
      }
    }

    // ¿La clase tiene preguntas o juego que hay que completar para darla por vista?
    function leccionTieneActividad(lesson) {
      return cantidadPreguntas(lesson) > 0 || !!nombreJuegoDeClase(lesson);
    }

    async function marcarYSiguiente(courseId, lessonIdx) {
      const lecciones = window.__currentLecciones;
      const nextIdx = lessonIdx + 1;
      const clave = courseId + ':' + lessonIdx;
      const boton = document.getElementById('zooBtnCompletarClase');

      const continuar = () => {
        if (nextIdx < lecciones.length) {
          // Abrir siguiente clase
          const l = lecciones[nextIdx];
          openPlayer(l, l.titulo || 'Clase ' + (nextIdx + 1), l.duration || '', courseId, nextIdx);
        } else {
          // Era la última: volver a la lista del curso
          renderCourseModal();
        }
      };

      // La clase se registra en el servidor (que revisa el orden y las preguntas). Si falla, el error ya se
      // mostró y nos quedamos en esta clase para poder reintentar. Si era la última, el servidor emite el certificado.
      const registrar = async () => {
        if (boton) { boton.disabled = true; boton.textContent = 'Guardando…'; }
        let r = null;
        try { r = await guardarClaseVista(courseId, lessonIdx); }
        finally {
          const b = document.getElementById('zooBtnCompletarClase');
          if (b && !r) { b.disabled = false; b.textContent = lessonIdx === lecciones.length - 1 ? 'Terminar curso' : 'Completada, siguiente →'; }
        }
        if (!r) return;
        if (r.nuevoCompletado) { await celebrarCursoCompletado(courseId, r); return; }
        continuar();
      };

      // Una clase ya registrada, o cuyas preguntas el servidor ya recibió en esta sesión, no repite preguntas ni juego.
      // La última clase de un curso que aún no tiene certificado sí pasa por sus preguntas (el servidor las pide).
      const previa = window.__zooCourseProgress[courseId];
      const esUltima = lessonIdx === lecciones.length - 1;
      const yaVista = !!(previa && previa.completedLessons.includes(lessonIdx) && (previa.isCompleted === true || !esUltima));
      if (yaVista || quizzesValidados.has(clave)) { await registrar(); return; }

      // Como en alintecfood: si la clase trae preguntas o juego, hay que completarlos (no se pueden cerrar)
      // y SOLO entonces la clase se manda al servidor y se avanza. Sin actividad, se manda de inmediato.
      abrirActividadesDeClase(lessonIdx, async () => {
        await registrar();
      }, { obligatorio: true });
    }

    function cantidadPreguntas(lesson) {
      return window.ZOO_QUIZ && lesson ? ZOO_QUIZ.preguntasDeClase(lesson).length : 0;
    }

    // Al terminar una clase: primero sus preguntas (si tiene), luego su juego (si tiene) y al final se continúa.
    // opciones.obligatorio: sin botón de cerrar (la clase no cuenta como vista hasta terminar). Si una actividad
    // está mal armada o no se puede dibujar, se salta sola para no dejar atorado a nadie.
    function abrirActividadesDeClase(lessonIdx, despues, opciones) {
      const obligatorio = !!(opciones && opciones.obligatorio);
      const lesson = window.__currentLecciones?.[lessonIdx];
      let pasado = false;
      const aJuego = () => { if (pasado) return; pasado = true; abrirJuegoDeClase(lessonIdx, despues, { obligatorio }); };
      if (!cantidadPreguntas(lesson)) { aJuego(); return; }
      const curso = window.__currentCourse || {};
      // Las respuestas se mandan al servidor (POST /api/cursos/:id/quiz): él las califica y registra que la clase
      // se contestó. El quiz es de práctica (equivocarse no frena), pero sin esa respuesta del servidor la clase
      // no puede completarse.
      ZOO_QUIZ.abrir(lesson.preguntas, {
        validar: async (respuestas) => {
          const r = await ZOORIGEN_CLUB.validarQuizClase(String(curso.id), lessonIdx, respuestas, { esMiembro: tieneMembresiaActiva() });
          quizzesValidados.add(curso.id + ':' + lessonIdx);
          return r;
        },
        subtitulo: (lesson.titulo || 'Clase ' + (lessonIdx + 1)) + (curso.title ? ' · ' + curso.title : ''),
        obligatorio,
        alTerminar: aJuego,
        alCerrar: aJuego
      });
    }

    // Nombre legible del juego de una clase ('' si no tiene uno válido)
    function nombreJuegoDeClase(lesson) {
      if (!window.ZOO_JUEGOS || !lesson || !lesson.juego) return '';
      const limpio = ZOO_JUEGOS.limpiarJuego(lesson.juego);
      return limpio ? ZOO_JUEGOS.esc(ZOO_JUEGOS.TIPOS[limpio.tipo]) : '';
    }

    // Abre el juego de la clase; `despues` se ejecuta una sola vez al terminar (o al cerrar, si no es obligatorio).
    function abrirJuegoDeClase(lessonIdx, despues, opciones) {
      const lesson = window.__currentLecciones?.[lessonIdx];
      if (!window.ZOO_JUEGOS || !lesson || !lesson.juego) { despues(); return; }
      const curso = window.__currentCourse || {};
      let seguido = false;
      const seguir = () => { if (seguido) return; seguido = true; despues(); };
      ZOO_JUEGOS.abrir(lesson.juego, {
        subtitulo: (lesson.titulo || 'Clase ' + (lessonIdx + 1)) + (curso.title ? ' · ' + curso.title : ''),
        portada: curso.image,
        imagenPorDefecto: '../assets/img/banner/banner.png',
        obligatorio: !!(opciones && opciones.obligatorio),
        textoContinuar: 'Continuar',
        alTerminar: seguir,
        alCerrar: seguir
      });
    }

    function closePlayer() {
      const modal = document.getElementById('playerOverlay');
      modal.classList.remove('is-open');
      document.getElementById('playerVideo').innerHTML = '';
      // Limpiar lista de clases si existe
      const oldList = modal.querySelector('.classes-list-box');
      if (oldList) oldList.remove();
      // Restaurar display del video y info para la próxima
      modal.querySelector('.player-box__video').style.display = '';
      modal.querySelector('.player-box__info').style.display = '';
      const box = modal.querySelector('.player-box');
      if (box) box.classList.remove('is-cinema');
    }
    function togglePlayerCine() {
      const box = document.querySelector('#playerOverlay .player-box');
      if (box) box.classList.toggle('is-cinema');
    }
    document.getElementById('playerOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'playerOverlay') closePlayer();
    });
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
