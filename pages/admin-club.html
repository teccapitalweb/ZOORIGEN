<!DOCTYPE html>
<html lang="es" data-tema="jirafa" data-modo="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Club VIP Zoorigen</title>
  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F5F3A">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icon-apple-touch.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zoorigen">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/club-theme.css?v=20261101-solidos">
  <style>
    body { background: var(--zoo-bg-darker); }

    /* LOGIN SCREEN */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius-lg); padding: 40px; max-width: 420px; width: 100%; text-align: center; }
    .login-card__logo { width: 72px; height: 72px; border-radius: 50%; background: var(--zoo-green-900); border: 3px solid var(--zoo-amber); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 2rem; }
    .login-card h1 { color: #fff; font-size: 1.4rem; margin-bottom: 6px; }
    .login-card p.subtitle { color: var(--zoo-text-muted); font-size: .9rem; margin-bottom: 28px; }
    .login-card .field { text-align: left; margin-bottom: 16px; }
    .login-card .field label { display: block; color: #fff; font-size: .86rem; font-weight: 600; margin-bottom: 6px; }
    .login-card .field input { width: 100%; background: var(--zoo-bg-darker); border: 1px solid var(--zoo-border); color: #fff; padding: 11px 14px; border-radius: var(--zoo-radius-sm); font-family: inherit; font-size: .94rem; }
    .login-card .field input:focus { outline: none; border-color: var(--zoo-amber); }
    /* iOS hace zoom automatico al enfocar un campo de menos de 16px.
       Solo en movil; el valor de escritorio queda intacto. */
    @media (max-width: 768px) {
      .login-card .field input { font-size: 16px; }
    }
    .login-card button { width: 100%; background: var(--zoo-amber); color: #1f1d17; padding: 12px; border-radius: var(--zoo-radius-sm); border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: .96rem; margin-top: 10px; }
    .login-card button:hover { filter: brightness(1.06); }
    .login-card button:disabled { opacity: .5; cursor: not-allowed; }
    .login-err { background: rgba(213,90,40,0.15); border: 1px solid rgba(213,90,40,0.4); color: #FF9770; padding: 9px 12px; border-radius: 8px; font-size: .84rem; margin-bottom: 14px; display: none; }
    .login-err.show { display: block; }
    .login-hint { font-size: .78rem; color: var(--zoo-text-dim); margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--zoo-border); }
    .login-hint code { background: var(--zoo-bg-darker); padding: 2px 6px; border-radius: 4px; color: var(--zoo-amber); font-family: monospace; font-size: .78rem; }

    /* ADMIN APP */
    .admin-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .asb { background: var(--zoo-bg-darker); border-right: 1px solid var(--zoo-border); padding: 22px 14px; display: flex; flex-direction: column; gap: 3px; }
    .asb-brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 18px; border-bottom: 1px solid var(--zoo-border); margin-bottom: 14px; }
    .asb-brand .icon { width: 42px; height: 42px; border-radius: 50%; background: var(--zoo-amber); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #1f1d17; font-weight: 800; }
    .asb-brand h3 { color: #fff; font-size: 1rem; margin: 0; line-height: 1.1; }
    .asb-brand small { color: var(--zoo-amber); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .asb-section { color: var(--zoo-text-dim); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding: 10px 10px 6px; font-weight: 700; }
    .asb-item { display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: var(--zoo-radius-sm); color: var(--zoo-text-muted); font-size: .92rem; font-weight: 600; cursor: pointer; border: 0; background: transparent; font-family: inherit; text-align: left; width: 100%; }
    .asb-item:hover { background: rgba(232,163,23,0.08); color: #fff; }
    .asb-item.is-active { background: var(--zoo-amber); color: #1f1d17; }
    .asb-item.is-active .nbg { background: rgba(0,0,0,0.25); color: #1f1d17; }
    .asb-item .nbg { margin-left: auto; background: var(--zoo-green-700); color: #fff; font-size: .72rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
    .asb-ft { margin-top: auto; border-top: 1px solid var(--zoo-border); padding-top: 14px; }
    .asb-ft a { display: block; padding: 8px 12px; color: var(--zoo-text-muted); font-size: .82rem; border-radius: 6px; }
    .asb-ft a:hover { color: var(--zoo-text); background: rgba(255,255,255,0.04); }

    .am { padding: 28px 36px; min-width: 0; }
    .am h1 { color: #fff; font-size: 1.7rem; margin-bottom: 4px; }
    .am p.sub { color: var(--zoo-text-muted); font-size: .92rem; margin-bottom: 22px; }

    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .stat-box { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius); padding: 16px; }
    .stat-box__label { color: var(--zoo-text-dim); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
    .stat-box__value { font-family: 'Poppins', sans-serif; font-size: 1.8rem; font-weight: 800; color: #fff; line-height: 1; margin-top: 6px; }
    .stat-box.green { border-color: var(--zoo-green-500); } .stat-box.green .stat-box__value { color: var(--zoo-green-500); }
    .stat-box.amber { border-color: var(--zoo-amber); } .stat-box.amber .stat-box__value { color: var(--zoo-amber); }
    .stat-box.orange { border-color: var(--zoo-orange); } .stat-box.orange .stat-box__value { color: var(--zoo-orange); }

    .mtable { width: 100%; background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius); overflow: auto; }
    .mtable table { width: 100%; border-collapse: collapse; min-width: 680px; }
    .mtable th { background: rgba(232,163,23,0.08); color: var(--zoo-amber); font-weight: 700; padding: 12px 14px; text-align: left; font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--zoo-border); }
    .mtable td { padding: 12px 14px; border-bottom: 1px solid var(--zoo-border); font-size: .88rem; color: #fff; }
    .mtable tr:last-child td { border-bottom: 0; }
    .mtable tr:hover td { background: rgba(232,163,23,0.04); }

    .status-pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: .72rem; font-weight: 700; }
    .status-pill.active { background: rgba(111,191,115,0.15); color: var(--zoo-green-500); }
    .status-pill.pending { background: rgba(232,163,23,0.15); color: var(--zoo-amber); }
    .status-pill.cancelled { background: rgba(213,90,40,0.15); color: var(--zoo-orange); }

    .admin-search { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); color: #fff; padding: 10px 14px; border-radius: var(--zoo-radius-sm); width: 100%; max-width: 420px; margin-bottom: 16px; font-family: inherit; font-size: .92rem; }
    .admin-search:focus { outline: none; border-color: var(--zoo-amber); }
    /* Anti-zoom iOS (>=16px) solo en movil. */
    @media (max-width: 768px) {
      .admin-search { font-size: 16px; }
    }

    .btn-small { padding: 5px 11px; border-radius: 8px; font-size: .74rem; font-weight: 700; cursor: pointer; border: 0; margin-right: 4px; font-family: inherit; }
    .btn-small.activate { background: var(--zoo-green-700); color: #fff; }
    .btn-small.cancel { background: var(--zoo-orange); color: #fff; }
    .btn-small.edit { background: var(--zoo-blue); color: #fff; }
    .btn-small.delete { background: var(--zoo-orange); color: #fff; }
    .btn-small:hover { filter: brightness(1.12); }

    .content-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .btn-add { background: var(--zoo-amber); color: #1f1d17; padding: 10px 20px; border-radius: var(--zoo-radius-sm); font-weight: 700; border: 0; cursor: pointer; font-family: inherit; font-size: .9rem; }
    .btn-add:hover { filter: brightness(1.08); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.is-open { display: flex; }
    .modal-form { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border-strong); border-radius: var(--zoo-radius); padding: 28px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-form h3 { color: #fff; font-size: 1.25rem; margin-bottom: 18px; }
    .modal-form .field { margin-bottom: 14px; }
    .modal-form label { display: block; color: #fff; font-size: .86rem; font-weight: 600; margin-bottom: 6px; }
    .modal-form input, .modal-form select, .modal-form textarea { width: 100%; background: var(--zoo-bg-darker); border: 1px solid var(--zoo-border); color: #fff; padding: 10px 12px; border-radius: var(--zoo-radius-sm); font-family: inherit; font-size: .9rem; }
    .modal-form textarea { min-height: 80px; resize: vertical; }
    .modal-form input:focus, .modal-form select:focus, .modal-form textarea:focus { outline: none; border-color: var(--zoo-amber); }
    /* Anti-zoom iOS (>=16px) solo en movil. */
    @media (max-width: 768px) {
      .modal-form input, .modal-form select, .modal-form textarea { font-size: 16px; }
    }
    .modal-form .hint { color: var(--zoo-text-dim); font-size: .78rem; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--zoo-border); }
    .btn-cancel { background: transparent; border: 1px solid var(--zoo-border); color: var(--zoo-text-muted); padding: 10px 20px; border-radius: var(--zoo-radius-sm); cursor: pointer; font-family: inherit; font-weight: 600; }
    .btn-save { background: var(--zoo-amber); color: #1f1d17; padding: 10px 22px; border-radius: var(--zoo-radius-sm); border: 0; cursor: pointer; font-family: inherit; font-weight: 700; }

    .admin-content-list { display: flex; flex-direction: column; gap: 8px; }
    .admin-content-item { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius-sm); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
    .admin-content-item__thumb { width: 52px; height: 52px; border-radius: var(--zoo-radius-sm); background: var(--zoo-green-900); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .admin-content-item__info { flex: 1; min-width: 0; }
    .admin-content-item__title { color: #fff; font-weight: 600; font-size: .94rem; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-content-item__meta { color: var(--zoo-text-dim); font-size: .82rem; }
    .admin-content-item__actions { display: flex; gap: 6px; flex-shrink: 0; }

    .no-data { text-align: center; padding: 40px 20px; color: var(--zoo-text-dim); background: var(--zoo-bg-card); border: 1px dashed var(--zoo-border); border-radius: var(--zoo-radius); }

    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--zoo-green-700); color: #fff; padding: 12px 20px; border-radius: var(--zoo-radius-sm); box-shadow: 0 10px 30px rgba(0,0,0,.3); display: none; z-index: 1001; font-weight: 600; font-size: .9rem; }
    .toast.show { display: block; animation: slideUp 0.3s ease-out; }
    .toast.error { background: var(--zoo-orange); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .sec { display: none; }
    .sec.is-active { display: block; }

    @media (max-width: 860px) {
      /* El grid tenia align-content:normal (=stretch): con min-height:100vh
         repartia el sobrante entre sus filas y resolvia a "372px 328px" en
         vez de ajustarse al contenido. Esa altura sobrante bajaba a .asb y,
         por su propio align-content, inflaba las lineas del wrap: los
         botones pasaban de sus 44px naturales a 76px. Ambos start cortan la
         cadena. Van dentro del media query, asi que no tocan el escritorio. */
      .admin-shell { grid-template-columns: 1fr; align-content: start; }
      .asb {
        flex-direction: row; flex-wrap: wrap; padding: 12px; gap: 6px;
        align-content: flex-start;
        align-items: flex-start;
      }
      /* Solo marca del panel (icono + "Zoorigen / Admin"), markup estatico:
         no identifica al admin de la sesion, asi que en movil se oculta para
         recuperar su fila. La identidad de quien esta logueado no se muestra
         en ningun punto de este shell. */
      .asb-brand { display: none; }
      /* Un solo grupo ("Gestion"): el titulo no desambigua nada y en una
         tira horizontal gastaria una fila entera. Se mantiene oculto. */
      .asb-section { display: none; }

      /* La regla base .asb-item{width:100%} apilaba los 6 botones en 6
         filas (484px antes de cualquier contenido). En movil la nav es
         una tira que envuelve. */
      .asb-item {
        width: auto;
        flex: 0 0 auto;
        min-height: 44px;
        padding: 8px 12px;
        font-size: .84rem;
      }

      /* El pie es la UNICA via de cerrar sesion en todo el panel: no
         puede seguir oculto en movil. Va como fila propia justo debajo
         de la tira de navegacion, sin quedar enterrado. */
      .asb-ft {
        display: flex;
        flex: 1 0 100%;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
        padding-top: 10px;
      }
      .asb-ft a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 8px 14px;
        border: 1px solid var(--zoo-border);
        border-radius: var(--zoo-radius-sm);
      }

      /* Acciones de fila: eran de ~25px de alto para operaciones
         destructivas (eliminar miembro). min-height + padding, sin
         height fijo, para no cortar el texto. */
      .btn-small {
        min-height: 44px;
        padding: 10px 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }

      .am { padding: 18px; }
    }
  </style>

<body>

  <!-- ═══════════ LOGIN SCREEN ═══════════ -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <div class="login-card__logo"><img src="../assets/img/logo/zoorigen-logo-remaster-v1.png" alt="Zoorigen"></div>
      <h1>Panel Admin Zoorigen</h1>
      <p class="subtitle">Acceso exclusivo para administradores</p>
      <div class="login-err" id="loginErr"></div>
      <div class="field">
        <label>Contraseña de acceso</label>
        <input type="password" id="accessPwd" placeholder="Contraseña admin" autocomplete="off">
      </div>
      <button id="loginBtn">Ingresar al panel</button>
      <p class="login-hint"><svg class="zi" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg> Requiere sesión activa con cuenta admin en Firebase + contraseña del panel.</p>
    </div>
  </div>

  <!-- ═══════════ ADMIN APP ═══════════ -->
  <div class="admin-shell" id="adminApp" style="display:none;">

    <aside class="asb">
      <div class="asb-brand">
        <img class="asb-logo" src="../assets/img/logo/zoorigen-logo-remaster-v1.png" alt="Zoorigen">
        <small>Panel admin</small>
      </div>

      <div class="asb-section">Gestión</div>
      <button class="asb-item is-active" data-sec="miembros"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg><span class="asb-label">Miembros</span> <span class="nbg" id="nb-miembros">0</span></button>
      <button class="asb-item" data-sec="cursos"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v16" /><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" /></svg><span class="asb-label">Cursos</span> <span class="nbg" id="nb-cursos">0</span></button>
      <button class="asb-item" data-sec="certificados"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" /><circle cx="12" cy="8" r="6" /></svg><span class="asb-label">Certificados</span> <span class="nbg" id="nb-certificados">0</span></button>
      <button class="asb-item" data-sec="videos"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12.296 3.464 3.02 3.956" /><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z" /><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><path d="m6.18 5.276 3.1 3.899" /></svg><span class="asb-label">Videos</span> <span class="nbg" id="nb-videos">0</span></button>
      <button class="asb-item" data-sec="pdfs"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg><span class="asb-label">PDFs</span> <span class="nbg" id="nb-pdfs">0</span></button>
      <button class="asb-item" data-sec="sesiones"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16.247 7.761a6 6 0 0 1 0 8.478" /><path d="M19.075 4.933a10 10 0 0 1 0 14.134" /><path d="M4.925 19.067a10 10 0 0 1 0-14.134" /><path d="M7.753 16.239a6 6 0 0 1 0-8.478" /><circle cx="12" cy="12" r="2" /></svg><span class="asb-label">Sesiones</span> <span class="nbg" id="nb-sesiones">0</span></button>
      <button class="asb-item" data-sec="noticias"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 18h-5" /><path d="M18 14h-8" /><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2" /><rect width="8" height="4" x="10" y="6" rx="1" /></svg><span class="asb-label">Noticias y avisos</span> <span class="nbg" id="nb-noticias">0</span></button>

      <button class="asb-item" data-sec="encuesta"><svg class="zi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="M12 11h4" /><path d="M12 16h4" /><path d="M8 11h.01" /><path d="M8 16h.01" /></svg><span class="asb-label">Encuesta</span> <span class="nbg" id="nb-encuesta">-</span></button>

      <div class="asb-ft">
        <a href="club-dashboard.html"><svg class="zi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg><span>Ver como miembro</span></a>
        <a href="#" onclick="adminLogout();return false;"><svg class="zi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></svg><span>Cerrar sesión</span></a>
      </div>
    </aside>

    <main class="am">
      <div id="secView">Cargando...</div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-form" id="modalForm"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/herramientas-iconos.js?v=20261029-iconos"></script>
  <script src="../assets/js/club.js?v=20261101-solidos"></script>
  <script src="../assets/js/admin-iconos.js?v=20261020"></script>
  <script src="../assets/js/club-juegos.js?v=20261009"></script>
  <script src="../assets/js/club-quiz.js?v=20261031"></script>
  <script src="../assets/js/admin-miembros.js?v=20261008"></script>
  <script src="../assets/js/admin-cursos.js?v=20261012"></script>
  <script src="../assets/js/admin-certificados.js?v=20261031"></script>
  <script src="../assets/js/club-noticias-ui.js?v=20261027-noticias"></script>
  <script src="../assets/js/admin-noticias.js?v=20261024-noticias"></script>
  <script src="../assets/js/encuesta-motor.js?v=20261031-guia"></script>
  <script src="../assets/js/admin-encuesta.js?v=20261031-guia"></script>
  <script src="../assets/js/zoorigen-bunny-catalog.js?v=20260820"></script>
  <script>
    // ═══════════════════════════════════════════════════════════
    // CONFIGURACIÓN: Contraseña del panel (2º factor)
    // Además del role admin en Firebase, pide esta contraseña.
    // Igual que OdonTeck (OdonTeck2026!) e ICADEM.
    // ═══════════════════════════════════════════════════════════
    const ADMIN_PWD = 'Zoorigen2026!';
    const PWD_KEY = 'zoorigen_admin_pwd_ok';

    const AREAS = ['Fauna silvestre', 'Fauna ponzoñosa', 'Apicultura', 'Etología', 'Investigación', 'Manejo en cautiverio', 'Conservación'];

    // ═══════════ FLOW DE ACCESO ═══════════
    async function checkAccess() {
      // 1. Firebase Auth obligatorio
      await new Promise(resolve => {
        auth.onAuthStateChanged(async (user) => {
          if (!user) {
            window.location.href = 'club-login.html?redirect=admin';
            return;
          }
          // 2. Role admin obligatorio
          try {
            const doc = await db.collection('miembros').doc(user.uid).get();
            const data = doc.data() || {};
            if (data.role !== 'admin') {
              document.getElementById('loginScreen').innerHTML = `
                <div class="login-card">
                  <div class="login-card__logo is-icon" style="background:var(--zoo-orange);">${ZOO_ICONOS.svg('lock', { size: 32 })}</div>
                  <h1>Acceso denegado</h1>
                  <p class="subtitle">Tu cuenta no tiene permisos de administrador.</p>
                  <a href="club-dashboard.html" style="display:inline-block;margin-top:20px;color:var(--zoo-green-500);font-weight:600;text-decoration:none;">← Volver al club</a>
                </div>`;
              return;
            }
            // 3. Contraseña del panel
            if (sessionStorage.getItem(PWD_KEY) === 'yes') {
              showAdmin();
            } else {
              document.getElementById('loginScreen').style.display = 'flex';
              document.getElementById('accessPwd').focus();
            }
          } catch (err) {
            console.error(err);
          }
          resolve();
        });
      });
    }

    function showAdmin() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'grid';
      initAdmin();
    }

    window.adminLogout = () => {
      sessionStorage.removeItem(PWD_KEY);
      auth.signOut().then(() => window.location.href = 'club-login.html');
    };

    // ═══════════ LOGIN HANDLER ═══════════
    document.getElementById('loginBtn').addEventListener('click', () => {
      const pwd = document.getElementById('accessPwd').value;
      const err = document.getElementById('loginErr');
      if (pwd === ADMIN_PWD) {
        sessionStorage.setItem(PWD_KEY, 'yes');
        err.classList.remove('show');
        showAdmin();
      } else {
        err.textContent = 'Contraseña incorrecta';
        err.classList.add('show');
        document.getElementById('accessPwd').value = '';
      }
    });
    document.getElementById('accessPwd').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    // ═══════════ TOAST / MODAL HELPERS ═══════════
    const toast = (msg, isError = false) => {
      const t = document.getElementById('toast');
      // sin emojis: el ícono lo pone la propia notificación
      const texto = String(msg).replace(/^[^\p{L}\p{N}¿¡"'(]+/u, '').trim();
      t.innerHTML = ZOO_ICONOS.svg(isError ? 'circle-alert' : 'circle-check', { size: 18 }) + '<span class="toast__txt"></span>';
      t.querySelector('.toast__txt').textContent = texto;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.classList.remove('show'), 2800);
    };
    const openModal = (html) => { document.getElementById('modalForm').classList.remove('ce-host'); document.getElementById('modalForm').innerHTML = html; document.getElementById('modalOverlay').classList.add('is-open'); };
    const closeModal = () => { document.getElementById('modalForm').classList.remove('ce-host'); document.getElementById('modalOverlay').classList.remove('is-open'); };
    window.closeM = closeModal;
    document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

    const extractDriveId = (url) => {
      if (!url) return '';
      if (/^[a-zA-Z0-9_-]{15,}$/.test(url.trim())) return url.trim();
      const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if (m1) return m1[1];
      const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m2) return m2[1];
      return url.trim();
    };

    // ═══════════ INIT ═══════════
    let currentSec = 'miembros';

    function initAdmin() {
      document.querySelectorAll('.asb-item').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.asb-item').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentSec = btn.dataset.sec;
          renderSection(currentSec);
        });
      });
      renderSection('miembros');
      // Actualizar badges en sidebar
      loadBadges();
    }

    async function loadBadges() {
      const cols = ['cursos', 'certificados', 'videos', 'pdfs', 'sesiones', 'noticias'];
      for (const c of cols) {
        try {
          const snap = await db.collection(c).get();
          document.getElementById(`nb-${c}`).textContent = snap.size;
        } catch {}
      }
      try {
        const snap = await db.collection('miembros').get();
        document.getElementById(`nb-miembros`).textContent = snap.size;
      } catch {}
    }

    function renderSection(sec) {
      if (sec === 'miembros') loadMiembros();
      else if (sec === 'cursos') loadCursos();
      else if (sec === 'certificados') loadCertificados();
      else if (sec === 'videos') loadVideos();
      else if (sec === 'pdfs') loadPdfs();
      else if (sec === 'sesiones') loadSesiones();
      else if (sec === 'noticias') loadNoticias();
      else if (sec === 'encuesta') loadEncuesta();
    }

    // ═══════════ MIEMBROS ═══════════
    async function loadMiembros() {
      const v = document.getElementById('secView');
      v.innerHTML = '<h1>Miembros</h1><p class="sub">Gestión de miembros y suscripciones</p><p>Cargando...</p>';
      try {
        // Sin orderBy: ordenar en Firestore deja fuera a quien no tenga el campo (createdAt).
        const snap = await db.collection('miembros').get();
        const members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMiembros(members);
      } catch (err) { v.innerHTML += `<div class="error-msg show">Error: ${ZOO_ADMIN_MIEMBROS.esc(err.message)}</div>`; }
    }

    function renderMiembros(members) {
      const A = ZOO_ADMIN_MIEMBROS;
      const analizados = A.ordenar(members.map(m => A.analizar(m, ZOORIGEN_CLUB)));
      const porId = new Map(members.map(m => [m.id, m]));
      const r = A.resumen(analizados);
      let filtro = 'todos', texto = '';
      const v = document.getElementById('secView');
      const hoy = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
      v.innerHTML = `
        <header class="m-head">
          <div>
            <h1>Miembros</h1>
            <p class="sub">Datos reales de Firestore · ${hoy}</p>
          </div>
          <button type="button" id="copiarResumen" class="btn-small extend m-copy">${ZOO_ICONOS.svg('clipboard-copy', { size: 16 })}Copiar resumen</button>
        </header>
        ${A.tarjetasHTML(r)}
        <div class="m-controls">
          <div class="zoo-chips" id="miembrosChips" role="group" aria-label="Filtrar miembros"></div>
          <div class="m-search">${ZOO_ICONOS.svg('search', { size: 16 })}<input type="search" class="admin-search" id="searchMembers" placeholder="Buscar nombre, correo o WhatsApp" aria-label="Buscar miembros"></div>
        </div>
        <div class="mtable">
          <table>
            <thead><tr><th>Miembro</th><th>Estado</th><th>Vence</th><th><span class="sr-only">Acciones</span></th></tr></thead>
            <tbody id="miembrosBody"></tbody>
          </table>
        </div>`;
      const pintar = () => {
        document.getElementById('miembrosChips').innerHTML = A.chipsHTML(filtro, r);
        document.getElementById('miembrosBody').innerHTML = A.filasHTML(A.filtrar(analizados, { filtro, texto }), ZOORIGEN_CLUB);
      };
      pintar();
      document.getElementById('searchMembers').addEventListener('input', e => { texto = e.target.value; pintar(); });
      document.getElementById('miembrosChips').addEventListener('click', e => {
        const b = e.target.closest('[data-filtro]');
        if (b) { filtro = b.dataset.filtro; pintar(); }
      });
      document.getElementById('miembrosBody').addEventListener('click', e => {
        const b = e.target.closest('[data-accion]');
        const m = b && porId.get(b.dataset.uid);
        if (!m) return;
        if (b.dataset.accion === 'activar') adminActivar(m.id, m.name || '', m.email || '');
        else if (b.dataset.accion === 'cancelar') adminCancelar(m.id, m.name || '');
      });
      document.getElementById('copiarResumen').addEventListener('click', async () => {
        const txt = A.resumenTexto(r);
        try { await navigator.clipboard.writeText(txt); toast('Resumen copiado (sin datos personales)'); }
        catch { window.prompt('Copia el resumen:', txt); }
      });
    }

    window.adminActivar = (uid, name, email) => {
      openModal(`
        <h3>Activar membresía manualmente</h3>
        <p style="color:var(--zoo-text-muted);font-size:.9rem;margin-bottom:14px;">
          Activarás la membresía VIP de <strong style="color:#fff;">${ZOO_ADMIN_MIEMBROS.esc(name || email || uid)}</strong>.<br>
          Útil cuando el pago se hizo fuera de Stripe (transferencia, efectivo, cortesía, etc.).
        </p>

        <div class="field">
          <label>Tipo de plan</label>
          <select id="f_actTipo" style="width:100%;padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;font-family:inherit;">
            <option value="mensual">Mensual (30 días) · $199 MXN</option>
            <option value="anual">Anual (365 días) · $1,899 MXN</option>
            <option value="custom">Personalizado (elige días)</option>
          </select>
        </div>

        <div class="field" id="f_actDiasWrap" style="display:none;">
          <label>Días de acceso</label>
          <input type="number" id="f_actDias" min="1" max="3650" value="30">
        </div>

        <div class="field">
          <label>Método de pago (opcional, solo para tu registro)</label>
          <input type="text" id="f_actMetodo" placeholder="Transferencia / Efectivo / Cortesía / etc.">
        </div>

        <div class="field">
          <label>Monto cobrado (opcional)</label>
          <input type="text" id="f_actMonto" placeholder="Ej. 199">
        </div>

        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeM()">Cancelar</button>
          <button class="btn-save" onclick="adminActivarConfirm('${uid}')">Activar ahora</button>
        </div>
      `);

      // Toggle días custom
      setTimeout(() => {
        const tipoSel = document.getElementById('f_actTipo');
        const diasWrap = document.getElementById('f_actDiasWrap');
        const diasInput = document.getElementById('f_actDias');
        if (tipoSel) {
          tipoSel.addEventListener('change', () => {
            if (tipoSel.value === 'custom') {
              diasWrap.style.display = 'block';
            } else {
              diasWrap.style.display = 'none';
              diasInput.value = tipoSel.value === 'anual' ? 365 : 30;
            }
          });
        }
      }, 50);
    };

    window.adminActivarConfirm = async (uid) => {
      const tipoSel = document.getElementById('f_actTipo').value;
      const diasCustom = parseInt(document.getElementById('f_actDias').value) || 30;
      const metodo = document.getElementById('f_actMetodo').value.trim();
      const monto = document.getElementById('f_actMonto').value.trim();

      const dias = tipoSel === 'anual' ? 365 : tipoSel === 'mensual' ? 30 : diasCustom;
      const tipoPlan = tipoSel === 'custom' ? 'mensual' : tipoSel;

      try {
        const now = new Date();
        const vence = new Date(now.getTime() + dias * 86400000);

        // Usar SET con merge: true para crear los campos que falten
        // Esto soluciona el problema de miembros sin todos los campos (ej. creados por webhook)
        await db.collection('miembros').doc(uid).set({
          planActivo: true,
          planCancelado: false,
          planTipo: tipoPlan,
          planInicio: firebase.firestore.Timestamp.fromDate(now),
          planVence: firebase.firestore.Timestamp.fromDate(vence),
          ultimoPago: firebase.firestore.Timestamp.fromDate(now),
          planActivadoEn: firebase.firestore.Timestamp.fromDate(now),
          planStatus: 'active',
          activadoManualmente: true,
          activadoPor: 'admin',
          metodoPago: metodo || 'Admin manual',
          montoPagado: monto || null,
          needsLinkToAuth: firebase.firestore.FieldValue.delete()
        }, { merge: true });

        toast(`Plan ${tipoPlan} activado (${dias} días)`);
        closeModal();
        loadMiembros();
      } catch (err) {
        console.error('adminActivar error:', err);
        toast('Error: ' + err.message, true);
      }
    };
    window.adminCancelar = async (uid, name) => {
      if (!confirm(`¿Cancelar membresía de ${name}?`)) return;
      try { await db.collection('miembros').doc(uid).update({ planCancelado: true, planStatus: 'cancelled_active', canceladoEn: firebase.firestore.FieldValue.serverTimestamp() }); toast('Cancelado'); loadMiembros(); }
      catch (err) { toast('Error: ' + err.message, true); }
    };

    // ═══════════ CURSOS ═══════════
    const CURSOS = window.ZOO_ADMIN_CURSOS;
    const cursosEstado = { items: [], texto: '', area: 'todas', orden: 'recientes', vista: 'grid' };
    try {
      const vistaGuardada = localStorage.getItem('zoo_admin_cursos_vista');
      if (vistaGuardada === 'lista' || vistaGuardada === 'grid') cursosEstado.vista = vistaGuardada;
    } catch (e) { /* sin almacenamiento: se usa la vista por defecto */ }

    async function loadCursos() {
      const v = document.getElementById('secView');
      v.innerHTML = '<h1>Cursos</h1><p class="sub">Cargando cursos…</p>';
      try {
        // Sin orderBy: ordenar en Firestore deja fuera a los cursos que no tengan el campo createdAt.
        const snap = await db.collection('cursos').get();
        cursosEstado.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCursos();
      } catch (err) { v.innerHTML += `<div class="error-msg show">Error: ${CURSOS.esc(err.message)}</div>`; }
    }

    function renderCursos() {
      const v = document.getElementById('secView');
      const e = cursosEstado, items = e.items;
      v.innerHTML = `
        <header class="sec-hero">
          <div class="sec-hero__txt">
            <span class="sec-eyebrow">Catálogo de cursos</span>
            <h1>Cursos</h1>
            <p>Busca, filtra y edita tus cursos, sus clases y los juegos que cierran cada clase.</p>
          </div>
          <div class="sec-hero__acc">
            <button class="btn-add btn-add--suave" id="syncBunnyBtn" onclick="sincronizarCatalogoBunny()">${ZOO_ICONOS.svg('cloud-download', { size: 16 })} Sincronizar 61 videos Bunny</button>
            <button class="btn-add" onclick="formCurso()">${ZOO_ICONOS.svg('plus', { size: 16 })} Nuevo curso</button>
          </div>
        </header>
        ${CURSOS.kpisHTML(CURSOS.resumenCursos(items))}
        <div class="cc-toolbar">
          <div class="m-search">${ZOO_ICONOS.svg('search', { size: 16 })}<input type="search" class="admin-search" id="cursoBuscar" placeholder="Buscar por título, área o etiqueta" aria-label="Buscar cursos" value="${CURSOS.esc(e.texto)}"></div>
          <div class="zoo-chips" id="cursoOrden" role="group" aria-label="Ordenar cursos"></div>
          <div class="cc-vistas" id="cursoVista" role="group" aria-label="Tipo de vista"></div>
        </div>
        <div class="cc-areas" id="cursoAreas" role="group" aria-label="Filtrar por área"></div>
        <div id="cursoLista"></div>`;

      const pintar = () => {
        const filtrados = CURSOS.filtrarCursos(items, { texto: e.texto, area: e.area, orden: e.orden });
        document.getElementById('cursoOrden').innerHTML = CURSOS.ordenHTML(e.orden);
        document.getElementById('cursoVista').innerHTML = CURSOS.vistaHTML(e.vista);
        document.getElementById('cursoAreas').innerHTML = CURSOS.chipsAreasHTML(CURSOS.areasConConteo(items), items.length, e.area);
        document.getElementById('cursoLista').innerHTML = CURSOS.listaHTML(filtrados, e.vista);
      };
      pintar();

      document.getElementById('cursoBuscar').addEventListener('input', ev => { e.texto = ev.target.value; pintar(); });
      document.getElementById('cursoOrden').addEventListener('click', ev => {
        const b = ev.target.closest('[data-orden]');
        if (b) { e.orden = b.dataset.orden; pintar(); }
      });
      document.getElementById('cursoVista').addEventListener('click', ev => {
        const b = ev.target.closest('[data-vista]');
        if (!b) return;
        e.vista = b.dataset.vista;
        try { localStorage.setItem('zoo_admin_cursos_vista', e.vista); } catch (err) { /* sin almacenamiento */ }
        pintar();
      });
      document.getElementById('cursoAreas').addEventListener('click', ev => {
        const b = ev.target.closest('[data-area]');
        if (b) { e.area = b.dataset.area; pintar(); }
      });
      document.getElementById('cursoLista').addEventListener('click', ev => {
        const b = ev.target.closest('[data-accion]');
        const c = b && items.find(x => x.id === b.dataset.id);
        if (!c) return;
        if (b.dataset.accion === 'editar') formCurso(c);
        else if (b.dataset.accion === 'eliminar') delDoc('cursos', c.id, c.title || '');
      });
    }

    // ── Formulario de curso (nuevo / editar) con editor de clases y juegos ──
    window.formCurso = (data = {}) => {
      // Copia profunda: lo que se edita no toca el curso hasta que se guarda.
      let lecciones = JSON.parse(JSON.stringify(Array.isArray(data.lecciones) ? data.lecciones : []));
      // Convertir lecciones viejas (driveId único) al formato nuevo de array
      if (!lecciones.length && data.driveId) {
        lecciones = [{ titulo: data.title || 'Clase 1', driveId: data.driveId, duration: data.duration || '' }];
      }
      if (!lecciones.length) lecciones = [CURSOS.leccionVacia()];
      window.__leccionesTemp = lecciones;
      window.__cursoEditandoId = data.id || '';

      openModal(CURSOS.modalCursoHTML(data, AREAS));
      document.getElementById('modalForm').classList.add('ce-host');
      renderLeccionesForm();
      enlazarLecciones();
    };

    window.renderLeccionesForm = () => {
      const cont = document.getElementById('leccionesContainer');
      if (cont) cont.innerHTML = CURSOS.leccionesHTML(window.__leccionesTemp);
    };

    // Un solo juego de eventos para todo el editor de clases (no se pierde el foco al escribir).
    function enlazarLecciones() {
      const cont = document.getElementById('leccionesContainer');
      if (!cont) return;
      const indice = el => { const c = el.closest('[data-lec]'); return c ? parseInt(c.dataset.lec, 10) : -1; };
      const redibujar = (enfocar) => {
        const caja = document.querySelector('#modalForm .ce-form');   // el área que se desplaza dentro de la ventana
        const y = caja ? caja.scrollTop : 0;
        renderLeccionesForm();
        if (caja) caja.scrollTop = y;
        if (enfocar !== undefined) {
          const filas = cont.querySelectorAll(`[data-lec="${enfocar}"] .ce-fila`);
          const campo = filas.length ? filas[filas.length - 1].querySelector('input') : null;
          if (campo) campo.focus();
        }
      };

      cont.addEventListener('input', ev => {
        const t = ev.target, i = indice(t);
        if (t.dataset.ruta && i >= 0) CURSOS.asignarRuta(window.__leccionesTemp[i], t.dataset.ruta, t.value);
      });
      cont.addEventListener('change', ev => {
        const t = ev.target, i = indice(t);
        if (i < 0) return;
        const lec = window.__leccionesTemp[i];
        const qi = (() => { const c = t.closest('[data-q]'); return c ? parseInt(c.dataset.q, 10) : -1; })();
        if (t.dataset.accion === 'juego-tipo') { lec.juego = CURSOS.nuevoJuego(t.value); redibujar(); }
        else if (t.dataset.accion === 'pregunta-tipo') { if (lec.preguntas && lec.preguntas[qi] && CURSOS.cambiarTipoPregunta(lec.preguntas[qi], t.value)) redibujar(); }
        else if (t.dataset.accion === 'gratis') lec.gratis = t.checked === true;
        else if (t.dataset.ruta && t.tagName === 'SELECT') CURSOS.asignarRuta(lec, t.dataset.ruta, t.value);
      });
      cont.addEventListener('click', ev => {
        const b = ev.target.closest('[data-accion]');
        if (!b || b.disabled || b.tagName === 'SELECT') return;
        const i = indice(b);
        if (i < 0) return;
        const lista = window.__leccionesTemp, lec = lista[i];
        switch (b.dataset.accion) {
          case 'lec-subir': if (CURSOS.moverLeccion(lista, i, -1)) redibujar(); break;
          case 'lec-bajar': if (CURSOS.moverLeccion(lista, i, 1)) redibujar(); break;
          case 'lec-quitar':
            if (lista.length <= 1) break;
            if (lec.juego && !confirm('Esta clase tiene un juego. ¿Quitarla de todos modos?')) break;
            lista.splice(i, 1); redibujar(); break;
          case 'juego-agregar': lec.juego = { tipo: '', datos: {} }; redibujar(); break;
          case 'juego-quitar': delete lec.juego; redibujar(); break;
          case 'fila-agregar': if (CURSOS.agregarFila(lec.juego)) redibujar(i); break;
          case 'fila-quitar': if (CURSOS.quitarFila(lec.juego, parseInt(b.dataset.fila, 10))) redibujar(); break;
          case 'pregunta-agregar':
            if (CURSOS.agregarPregunta(lec)) {
              redibujar();
              const cajas = cont.querySelectorAll(`[data-lec="${i}"] .ce-preg textarea`);
              if (cajas.length) cajas[cajas.length - 1].focus();
            }
            break;
          case 'pregunta-quitar': { const q = b.closest('[data-q]'); if (q && CURSOS.quitarPregunta(lec, parseInt(q.dataset.q, 10))) redibujar(); break; }
          case 'opcion-agregar': { const q = b.closest('[data-q]'); if (q && lec.preguntas && CURSOS.agregarOpcion(lec.preguntas[parseInt(q.dataset.q, 10)])) redibujar(); break; }
          case 'opcion-quitar': { const q = b.closest('[data-q]'); if (q && lec.preguntas && CURSOS.quitarOpcion(lec.preguntas[parseInt(q.dataset.q, 10)], parseInt(b.dataset.o, 10))) redibujar(); break; }
        }
      });
    }

    // Botón "Sincronizar con Bunny" del formulario: llena los videos de ESTE curso.
    // Pide la lista al servidor (Bunny en vivo). Si el servidor aún no tiene la clave de Bunny,
    // usa el catálogo guardado en el sitio (los 15 cursos ya conocidos).
    window.sincronizarCursoBunny = async () => {
      const btn = document.getElementById('cf-sync-bunny');
      const titulo = (document.getElementById('f_title') || {}).value || '';
      if (!titulo.trim()) { toast('Escribe primero el título del curso: con él se busca la colección en Bunny.', true); return; }
      const texto = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = ZOO_ICONOS.svg('refresh-cw', { size: 16, clase: 'zi-spin' }) + 'Consultando Bunny…'; }
      let catalogo = null, origen = 'vivo';
      try {
        const user = firebase.auth().currentUser;
        if (!user) throw new Error('sesion');
        const token = await user.getIdToken();
        const r = await fetch('https://zoorigen-webhook-production.up.railway.app/api/admin/bunny-catalogo', { headers: { Authorization: 'Bearer ' + token } });
        const data = await r.json().catch(() => ({}));
        if (r.ok && Array.isArray(data.catalogo)) catalogo = data.catalogo;
        else if (data && data.codigo !== 'sin_api_key' && r.status !== 404) throw new Error(data.error || ('HTTP ' + r.status));
      } catch (err) {
        if (btn) { btn.disabled = false; btn.innerHTML = texto; }
        toast('No se pudo consultar Bunny: ' + (err.message === 'sesion' ? 'tu sesión expiró, vuelve a entrar' : err.message), true);
        return;
      }
      if (!catalogo) { catalogo = CURSOS.catalogoDesdeArchivo(window.ZOORIGEN_BUNNY_CATALOG); origen = 'archivo'; }
      if (btn) { btn.disabled = false; btn.innerHTML = texto; }

      const hallada = CURSOS.mejorColeccion(titulo, catalogo);
      if (!hallada) {
        toast(origen === 'archivo'
          ? 'No encontré ese curso en el catálogo guardado en el sitio. Para ver videos nuevos de Bunny falta conectar la clave de Bunny en el servidor.'
          : `No encontré en Bunny una colección parecida a "${titulo.trim()}". Revisa que se llamen parecido.`, true);
        return;
      }
      const col = hallada.coleccion;
      const idActual = window.__cursoEditandoId || '';
      const enUso = CURSOS.videosUsadosPorOtros(cursosEstado.items, idActual, col);
      const aviso = `Se encontró la colección "${col.titulo}" en Bunny (${col.sesiones.length} videos).\n\n` +
        (hallada.puntaje < 0.9 ? 'OJO: el nombre no es igual al del curso, revisa que sea la correcta.\n\n' : '') +
        (enUso.length ? `OJO: esos videos ya están en: ${enUso.join(', ')}.\n\n` : '') +
        'Se llenará el video de cada clase por orden. No se cambian títulos que ya escribiste, preguntas, juegos ni clases gratis. Aún no se guarda nada hasta pulsar "Guardar". ¿Continuar?';
      if (!confirm(aviso)) return;
      const r = CURSOS.aplicarColeccion(window.__leccionesTemp, col);
      window.__leccionesTemp = r.lecciones.length ? r.lecciones : [CURSOS.leccionVacia()];
      renderLeccionesForm();
      toast(`${r.actualizadas + r.nuevas} clases vinculadas desde "${col.titulo}"${r.sobrantes ? ` · ${r.sobrantes} clase(s) del curso no tienen video en Bunny` : ''}${origen === 'archivo' ? ' (catálogo guardado en el sitio)' : ''}. Pulsa Guardar para terminar.`);
    };

    window.saveCurso = async (id) => {
      // Valida y limpia las clases (descarta las vacías y revisa que cada juego esté completo)
      const { lecciones, errores } = CURSOS.limpiarLecciones(window.__leccionesTemp);

      if (cursoMuestraGratis) {

        if (!hayClaseGratis) { toast('Marca al menos una clase como gratis, o desactiva "clases gratis de muestra".', true); return; }

      // Orden de desbloqueo: solo para cursos nuevos (o los que antes no hacían fila). Los de siempre no se mueven.
      const actual = id ? (cursosEstado.items || []).find(c => c.id === id) : null;

    function normalizarTituloBunny(valor) {
      return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function similitudTituloBunny(a, b) {
      const stop = new Set(['de','del','la','las','los','el','en','para','por','y','con','un','una']);
      const tokens = valor => new Set(normalizarTituloBunny(valor).split(' ').filter(x => x && !stop.has(x)));
      const aa = tokens(a), bb = tokens(b);
      if (!aa.size || !bb.size) return 0;
      let iguales = 0;
      aa.forEach(x => { if (bb.has(x)) iguales++; });
      // El título existente suele ser una versión corta del nombre de Bunny.
      // Medir contra el conjunto menor permite conservar su portada y textos.
      return iguales / Math.min(aa.size, bb.size);
    }

    function slugCursoBunny(valor) {
      return normalizarTituloBunny(valor).replace(/\s+/g, '-').slice(0, 90) || `curso-${Date.now()}`;
    }

    // Importación idempotente: reemplaza las clases, pero conserva portadas,
    // descripciones, materiales, disponibilidad y documentos de progreso.
    window.sincronizarCatalogoBunny = async () => {
      const catalogo = window.ZOORIGEN_BUNNY_CATALOG;
      const btn = document.getElementById('syncBunnyBtn');
      if (!Array.isArray(catalogo) || catalogo.length !== 15) {
        toast('No se encontró el catálogo completo de Bunny', true);
        return;
      }
      const totalVideos = catalogo.reduce((n, c) => n + (c.lecciones?.length || 0), 0);
      if (totalVideos !== 61) {
        toast(`Catálogo incompleto: ${totalVideos} de 61 videos`, true);
        return;
      }
      if (!confirm(`Se vincularán ${totalVideos} videos Bunny con ${catalogo.length} cursos.\n\nSe conservarán portadas, textos, materiales y progreso. ¿Continuar?`)) return;

      if (btn) { btn.disabled = true; btn.innerHTML = ZOO_ICONOS.svg('refresh-cw', { size: 16, clase: 'zi-spin' }) + ' Sincronizando…'; }
      try {
        const snap = await db.collection('cursos').get();
        const existentes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const usados = new Set();
        let actualizados = 0;
        let creados = 0;
        const creadosEnEstaCorrida = [];

        for (const item of catalogo) {
          const exacto = existentes.find(c => !usados.has(c.id) && normalizarTituloBunny(c.title) === normalizarTituloBunny(item.title));
          const aproximado = exacto || existentes
            .filter(c => !usados.has(c.id))
            .map(c => ({ curso: c, score: similitudTituloBunny(c.title, item.title) }))
            .filter(x => x.score >= 0.75)
            .sort((a, b) => b.score - a.score)[0]?.curso;
          const previo = aproximado || null;
          const docId = previo?.id || `bunny-${slugCursoBunny(item.title)}`;
          if (previo) usados.add(previo.id);

          const leccionesAnteriores = Array.isArray(previo?.lecciones) ? previo.lecciones : [];
          // Conserva títulos y juegos de cada clase (función probada en tests/admin-cursos.test.js)
          const lecciones = CURSOS.migrarLecciones(leccionesAnteriores, item.lecciones);

          const data = {
            lecciones,
            totalClases: lecciones.length,
            videoProvider: 'bunny',
            bunnyLibraryId: 731751,
            bunnyCourseKey: normalizarTituloBunny(item.title),
            migradoDesdeDrive: true,
            bunnySincronizadoEn: firebase.firestore.FieldValue.serverTimestamp()
          };

          if (!previo) {
            // Un curso creado por la sincronización también va al final de la fila, no al principio
            const nuevoOrden = CURSOS.siguienteOrdenVip(existentes.concat(creadosEnEstaCorrida));
            creadosEnEstaCorrida.push({ ordenVip: nuevoOrden });
            data.ordenVip = nuevoOrden;
            Object.assign(data, {
              title: item.title,
              area: 'Fauna silvestre',
              duration: '',
              level: 'Intermedio',
              image: '',
              description: '',
              tag: 'Bunny',
              createdAt: new Date().toISOString()
            });
            creados++;
          } else {
            actualizados++;
          }

          await db.collection('cursos').doc(docId).set(data, { merge: true });
        }

        toast(`61 videos sincronizados · ${actualizados} cursos actualizados · ${creados} creados`);
        await loadCursos();
        loadBadges();
      } catch (error) {
        console.error('[Bunny sync]', error);
        toast('No se pudo sincronizar: ' + (error.message || error), true);
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = ZOO_ICONOS.svg('cloud-download', { size: 16 }) + ' Sincronizar 61 videos Bunny'; }
      }
    };

      openModal(`
        <h3>${data.id ? 'Editar' : 'Nuevo'} webinar</h3>
        <div class="field"><label>Título del webinar *</label><input type="text" id="f_title" value="${data.title || ''}" placeholder="Ej. Manejo de fauna silvestre en UMAs"></div>
        <div class="field"><label>Ponente / Especialista</label><input type="text" id="f_speaker" value="${data.speaker || ''}" placeholder="Ej. Dr. Iván Coronel"></div>
        <div class="field"><label>Fecha *</label><input type="date" id="f_date" value="${data.date || ''}"></div>
        <div class="field"><label>Hora</label><input type="time" id="f_time" value="${data.time || '19:00'}"></div>
        <div class="field"><label>Duración estimada</label><input type="text" id="f_duration" value="${data.duration || '60 min'}" placeholder="Ej. 60 min"></div>
        <div class="field"><label>Link de Google Meet *</label><input type="text" id="f_meet" value="${data.meetUrl || data.zoomUrl || ''}" placeholder="https://meet.google.com/xxx-xxxx-xxx"><p class="hint">Solo miembros VIP activos verán este link</p></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeM()">Cancelar</button>
          <button class="btn-save" onclick="saveSesion('${data.id || ''}')">${data.id ? 'Guardar' : 'Crear webinar'}</button>
        </div>`);
    };

    window.saveSesion = async (id) => {
      const data = {
        title: document.getElementById('f_title').value.trim(),
        speaker: document.getElementById('f_speaker').value.trim(),
        date: document.getElementById('f_date').value,
        time: document.getElementById('f_time').value,
        duration: document.getElementById('f_duration').value.trim(),
        meetUrl: document.getElementById('f_meet').value.trim()
      };
      if (!data.title) { toast('Título requerido', true); return; }
      if (!data.date) { toast('Fecha requerida', true); return; }
      try {
        if (id) await db.collection('sesiones').doc(id).update(data);
        else { data.createdAt = new Date().toISOString(); await db.collection('sesiones').add(data); }
        toast('Guardado'); closeModal(); loadSesiones(); loadBadges();
      } catch (err) { toast('Error: ' + err.message, true); }
    };

    // ═══════════ NOTICIAS Y AVISOS ═══════════
    // Todo va por el servidor (admin-noticias.js): noticias del sector, datos curiosos y avisos de la campana.
    function loadNoticias() {
      ZOO_ADMIN_NOTICIAS.montar({
        contenedor: document.getElementById('secView'),
        base: 'https://zoorigen-webhook-production.up.railway.app',
        getToken: () => auth.currentUser.getIdToken(),
        toast: (m, malo) => toast(m, malo),
        confirmar: (m) => confirm(m)
      });
    }

    // ═══════════ DELETE GENERIC ═══════════
    window.delDoc = async (col, id, name) => {
      if (!confirm(`¿Eliminar "${name}"?`)) return;
      try {
        await db.collection(col).doc(id).delete();
        toast('Eliminado');
        renderSection(currentSec);
        loadBadges();
      } catch (err) { toast('Error: ' + err.message, true); }
    };

    // ═══════════ CERTIFICADOS EMITIDOS ═══════════
    const CERTS = window.ZOO_ADMIN_CERTS;
    const certEstado = { items: [], texto: '', curso: 'todos', orden: 'recientes' };

    async function loadCertificados() {
      const v = document.getElementById('secView');
      v.innerHTML = '<h1>Certificados emitidos</h1><p class="sub">Cargando certificados…</p>';
      try {
        // Sin orderBy: se ordena aquí para no dejar fuera ningún certificado.
        const snap = await db.collection('certificados').get();
        certEstado.items = snap.docs.map(d => CERTS.normalizar({ id: d.id, ...d.data() }));
        renderCertificados();
      } catch (err) { v.innerHTML += `<div class="error-msg show">Error: ${CERTS.esc(err.message)}</div>`; }
    }

    function renderCertificados() {
      const v = document.getElementById('secView');
      const e = certEstado, items = e.items;
      v.innerHTML = `
        <header class="sec-hero">
          <div class="sec-hero__txt">
            <span class="sec-eyebrow">Emisión</span>
            <h1>Certificados emitidos</h1>
            <p>Consulta los certificados que han obtenido tus alumnos, comparte su enlace de verificación o descarga la lista. Los certificados los emite el servidor al terminar cada curso; desde aquí solo puedes emitir uno manualmente.</p>
          </div>
          <div class="sec-hero__acc">
            <button class="btn-add" id="certEmitir">${ZOO_ICONOS.svg('plus', { size: 16 })} Emitir certificado</button>
            <button class="btn-add btn-add--suave" id="certCsv">${ZOO_ICONOS.svg('download', { size: 16 })} Descargar lista (CSV)</button>
          </div>
        </header>
        ${CERTS.kpisHTML(CERTS.resumen(items))}
        <div class="cc-toolbar">
          <div class="m-search">${ZOO_ICONOS.svg('search', { size: 16 })}<input type="search" class="admin-search" id="certBuscar" placeholder="Buscar por alumno, correo, curso o folio" aria-label="Buscar certificados" value="${CERTS.esc(e.texto)}"></div>
          <label class="cf-selector"><span class="sr-only">Filtrar por curso</span><select id="certCurso" class="ce-input"></select></label>
          <div class="zoo-chips" id="certOrden" role="group" aria-label="Ordenar certificados"></div>
        </div>
        <div id="certLista"></div>`;

      let filtrados = [];
      const pintar = () => {
        filtrados = CERTS.filtrar(items, { texto: e.texto, curso: e.curso, orden: e.orden });
        document.getElementById('certCurso').innerHTML = CERTS.opcionesCursoHTML(CERTS.cursosConConteo(items), e.curso, items.length);
        document.getElementById('certOrden').innerHTML = CERTS.ordenHTML(e.orden);
        document.getElementById('certLista').innerHTML = CERTS.listaHTML(filtrados);
        document.getElementById('certCsv').disabled = filtrados.length === 0;
      };
      pintar();

      document.getElementById('certEmitir').addEventListener('click', emitirCertificadoManual);
      document.getElementById('certBuscar').addEventListener('input', ev => { e.texto = ev.target.value; pintar(); });
      document.getElementById('certCurso').addEventListener('change', ev => { e.curso = ev.target.value; pintar(); });
      document.getElementById('certOrden').addEventListener('click', ev => {
        const b = ev.target.closest('[data-orden]');
        if (b) { e.orden = b.dataset.orden; pintar(); }
      });
      document.getElementById('certLista').addEventListener('click', async ev => {
        const b = ev.target.closest('[data-accion="copiar"]');
        if (!b) return;
        const url = CERTS.urlVerificar(b.dataset.folio);
        try { await navigator.clipboard.writeText(url); toast('Enlace de verificación copiado'); }
        catch (err) { window.prompt('Copia el enlace de verificación:', url); }
      });
      document.getElementById('certCsv').addEventListener('click', () => {
        const blob = new Blob(['﻿' + CERTS.csv(filtrados)], { type: 'text/csv;charset=utf-8' });
        const enlace = document.createElement('a');
        enlace.href = URL.createObjectURL(blob);
        enlace.download = `certificados-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(enlace); enlace.click(); enlace.remove();
        setTimeout(() => URL.revokeObjectURL(enlace.href), 1000);
        toast(`Se descargaron ${filtrados.length} certificado${filtrados.length === 1 ? '' : 's'}`);
      });
    }

    // Emisión manual: el servidor crea el certificado (POST /api/admin/certificados); aquí no se escribe en Firestore.
    async function emitirCertificadoManual() {
      const boton = document.getElementById('certEmitir');
      if (boton) boton.disabled = true;
      try {
        const [ms, cs] = await Promise.all([db.collection('miembros').get(), db.collection('cursos').get()]);
        const miembros = ms.docs.map(d => ({ id: d.id, name: d.data().name, email: d.data().email }));
        const cursos = cs.docs.map(d => ({ id: d.id, title: d.data().title }));
        openModal(CERTS.modalEmitirHTML(miembros, cursos));
      } catch (err) {
        toast('No se pudieron cargar alumnos y cursos: ' + err.message, true);
        return;
      } finally {
        if (boton) boton.disabled = false;
      }
      const enviar = document.getElementById('certEmEnviar');
      const errorEl = document.getElementById('certEmError');
      enviar.addEventListener('click', async () => {
        const r = CERTS.cuerpoEmision({
          uid: document.getElementById('certEmUid').value,
          cursoId: document.getElementById('certEmCurso').value,
          nombre: document.getElementById('certEmNombre').value,
          horas: document.getElementById('certEmHoras').value,
          sesiones: document.getElementById('certEmSesiones').value
        });
        if (!r.ok) { errorEl.textContent = r.error; errorEl.style.display = 'block'; return; }
        errorEl.style.display = 'none';
        enviar.disabled = true; enviar.textContent = 'Emitiendo…';
        try {
          const resp = await ZOORIGEN_CLUB.apiFetch('/api/admin/certificados', { method: 'POST', body: r.cuerpo });
          const folio = resp && resp.certificado && resp.certificado.folio;
          closeModal();
          toast(folio ? 'Certificado emitido: ' + folio : 'Certificado emitido');
          loadCertificados();
        } catch (err) {
          errorEl.textContent = CERTS.mensajeErrorEmision(err);
          errorEl.style.display = 'block';
          enviar.disabled = false; enviar.textContent = 'Emitir certificado';
        }
      });
    }

    // ═══════════ ENCUESTA DE LA PORTADA ═══════════
    // Los datos los lee el servidor con el Admin SDK (GET /api/admin/encuesta y /api/admin/chatbot/sin-respuesta);
    // aquí no se lee Firestore directo. La agregación está en assets/js/admin-encuesta.js.
    async function loadEncuesta() {
      const v = document.getElementById('secView');
      const A = window.ZOO_ADMIN_ENCUESTA;
      v.innerHTML = A.cargandoHTML();
      const estado = await A.cargar((ruta, op) => ZOORIGEN_CLUB.apiFetch(ruta, op));
      if (currentSec !== 'encuesta') return; // cambió de sección mientras cargaba
      v.innerHTML = A.vistaHTML(estado);
      if (estado.encuesta.ok) document.getElementById('nb-encuesta').textContent = A.consolidar(estado.encuesta.docs).length;
      const recargar = document.getElementById('encRecargar');
      if (recargar) recargar.addEventListener('click', loadEncuesta);
    }

    // ═══════════ ARRANCAR ═══════════
    checkAccess();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
</html>
