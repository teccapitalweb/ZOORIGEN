  <style>
    body { background: var(--zoo-bg-darker); }
    /* Misma transición corta entre documentos que el Club: al pasar del Club al panel no queda una transición abortada. */
    @media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }

    /* LOGIN SCREEN */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius-lg); padding: 40px; max-width: 420px; width: 100%; text-align: center; }
    .login-card__logo { width: 72px; height: 72px; border-radius: 50%; background: var(--zoo-green-900); border: 3px solid var(--zoo-amber); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 2rem; }
    .login-card h1 { color: #fff; font-size: 1.4rem; margin-bottom: 6px; }
    .login-card p.subtitle { color: var(--zoo-text-muted); font-size: .9rem; margin-bottom: 28px; }
    .login-card .field { text-align: left; margin-bottom: 16px; }
    .login-card .field label { display: block; color: #fff; font-size: .86rem; font-weight: 600; margin-bottom: 6px; }
    .login-card .field input { width: 100%; background: var(--zoo-bg-darker); border: 1px solid var(--zoo-border); color: #fff; padding: 11px 14px; border-radius: var(--zoo-radius-sm); font-family: inherit; font-size: .94rem; }
    .login-card .field input:focus { outline: none; border-color: var(--zoo-amber); }
    /* iOS hace zoom automatico al enfocar un campo de menos de 16px.
       Solo en movil; el valor de escritorio queda intacto. */
    @media (max-width: 768px) {
      .login-card .field input { font-size: 16px; }
    }
    .login-card button { width: 100%; background: var(--zoo-amber); color: #1f1d17; padding: 12px; border-radius: var(--zoo-radius-sm); border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: .96rem; margin-top: 10px; }
    .login-card button:hover { filter: brightness(1.06); }
    .login-card button:disabled { opacity: .5; cursor: not-allowed; }
    .login-err { background: rgba(213,90,40,0.15); border: 1px solid rgba(213,90,40,0.4); color: #FF9770; padding: 9px 12px; border-radius: 8px; font-size: .84rem; margin-bottom: 14px; display: none; }
    .login-err.show { display: block; }
    .login-hint { font-size: .78rem; color: var(--zoo-text-dim); margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--zoo-border); }
    .login-hint code { background: var(--zoo-bg-darker); padding: 2px 6px; border-radius: 4px; color: var(--zoo-amber); font-family: monospace; font-size: .78rem; }

    /* ADMIN APP */
    .admin-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .asb { background: var(--zoo-bg-darker); border-right: 1px solid var(--zoo-border); padding: 22px 14px; display: flex; flex-direction: column; gap: 3px; }
    .asb-brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 18px; border-bottom: 1px solid var(--zoo-border); margin-bottom: 14px; }
    .asb-brand .icon { width: 42px; height: 42px; border-radius: 50%; background: var(--zoo-amber); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #1f1d17; font-weight: 800; }
    .asb-brand h3 { color: #fff; font-size: 1rem; margin: 0; line-height: 1.1; }
    .asb-brand small { color: var(--zoo-amber); font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .asb-section { color: var(--zoo-text-dim); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; padding: 10px 10px 6px; font-weight: 700; }
    .asb-item { display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: var(--zoo-radius-sm); color: var(--zoo-text-muted); font-size: .92rem; font-weight: 600; cursor: pointer; border: 0; background: transparent; font-family: inherit; text-align: left; width: 100%; }
    .asb-item:hover { background: rgba(232,163,23,0.08); color: #fff; }
    .asb-item.is-active { background: var(--zoo-amber); color: #1f1d17; }
    .asb-item.is-active .nbg { background: rgba(0,0,0,0.25); color: #1f1d17; }
    .asb-item .nbg { margin-left: auto; background: var(--zoo-green-700); color: #fff; font-size: .75rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
    .asb-ft { margin-top: auto; border-top: 1px solid var(--zoo-border); padding-top: 14px; }
    .asb-ft a { display: block; padding: 8px 12px; color: var(--zoo-text-muted); font-size: .82rem; border-radius: 6px; }
    .asb-ft a:hover { color: var(--zoo-text); background: rgba(255,255,255,0.04); }

    .am { padding: 28px 36px; min-width: 0; }
    .am h1 { color: #fff; font-size: 1.7rem; margin-bottom: 4px; }
    .am p.sub { color: var(--zoo-text-muted); font-size: .92rem; margin-bottom: 22px; }

    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; margin-bottom: 22px; }
    .stat-box { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius); padding: 16px; }
    .stat-box__label { color: var(--zoo-text-dim); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
    .stat-box__value { font-family: var(--zoo-font-display); font-size: 1.8rem; font-weight: 800; color: #fff; line-height: 1; margin-top: 6px; }
    .stat-box.green { border-color: var(--zoo-green-500); } .stat-box.green .stat-box__value { color: var(--zoo-green-500); }
    .stat-box.amber { border-color: var(--zoo-amber); } .stat-box.amber .stat-box__value { color: var(--zoo-amber); }
    .stat-box.orange { border-color: var(--zoo-orange); } .stat-box.orange .stat-box__value { color: var(--zoo-orange); }

    .mtable { width: 100%; background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius); overflow: auto; }
    .mtable table { width: 100%; border-collapse: collapse; min-width: 680px; }
    .mtable th { background: rgba(232,163,23,0.08); color: var(--zoo-amber); font-weight: 700; padding: 12px 14px; text-align: left; font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--zoo-border); }
    .mtable td { padding: 12px 14px; border-bottom: 1px solid var(--zoo-border); font-size: .88rem; color: #fff; }
    .mtable tr:last-child td { border-bottom: 0; }
    .mtable tr:hover td { background: rgba(232,163,23,0.04); }

    .status-pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: .75rem; font-weight: 700; }
    .status-pill.active { background: rgba(111,191,115,0.15); color: var(--zoo-green-500); }
    .status-pill.pending { background: rgba(232,163,23,0.15); color: var(--zoo-amber); }
    .status-pill.cancelled { background: rgba(213,90,40,0.15); color: var(--zoo-orange); }

    .admin-search { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); color: #fff; padding: 10px 14px; border-radius: var(--zoo-radius-sm); width: 100%; max-width: 420px; margin-bottom: 16px; font-family: inherit; font-size: .92rem; }
    .admin-search:focus { outline: none; border-color: var(--zoo-amber); }
    /* Anti-zoom iOS (>=16px) solo en movil. */
    @media (max-width: 768px) {
      .admin-search { font-size: 16px; }
    }

    .btn-small { padding: 5px 11px; border-radius: 8px; font-size: .75rem; font-weight: 700; cursor: pointer; border: 0; margin-right: 4px; font-family: inherit; }
    .btn-small.activate { background: var(--zoo-green-700); color: #fff; }
    .btn-small.cancel { background: var(--zoo-orange); color: #fff; }
    .btn-small.edit { background: var(--zoo-blue); color: #fff; }
    .btn-small.delete { background: var(--zoo-orange); color: #fff; }
    .btn-small:hover { filter: brightness(1.12); }

    .content-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .btn-add { background: var(--zoo-amber); color: #1f1d17; padding: 10px 20px; border-radius: var(--zoo-radius-sm); font-weight: 700; border: 0; cursor: pointer; font-family: inherit; font-size: .9rem; }
    .btn-add:hover { filter: brightness(1.08); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.is-open { display: flex; }
    .modal-form { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border-strong); border-radius: var(--zoo-radius); padding: 28px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-form h3 { color: #fff; font-size: 1.25rem; margin-bottom: 18px; }
    .modal-form .field { margin-bottom: 14px; }
    .modal-form label { display: block; color: #fff; font-size: .86rem; font-weight: 600; margin-bottom: 6px; }
    .modal-form input, .modal-form select, .modal-form textarea { width: 100%; background: var(--zoo-bg-darker); border: 1px solid var(--zoo-border); color: #fff; padding: 10px 12px; border-radius: var(--zoo-radius-sm); font-family: inherit; font-size: .9rem; }
    .modal-form textarea { min-height: 80px; resize: vertical; }
    .modal-form input:focus, .modal-form select:focus, .modal-form textarea:focus { outline: none; border-color: var(--zoo-amber); }
    /* Anti-zoom iOS (>=16px) solo en movil. */
    @media (max-width: 768px) {
      .modal-form input, .modal-form select, .modal-form textarea { font-size: 16px; }
    }
    .modal-form .hint { color: var(--zoo-text-dim); font-size: .78rem; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--zoo-border); }
    .btn-cancel { background: transparent; border: 1px solid var(--zoo-border); color: var(--zoo-text-muted); padding: 10px 20px; border-radius: var(--zoo-radius-sm); cursor: pointer; font-family: inherit; font-weight: 600; }
    .btn-save { background: var(--zoo-amber); color: #1f1d17; padding: 10px 22px; border-radius: var(--zoo-radius-sm); border: 0; cursor: pointer; font-family: inherit; font-weight: 700; }

    .admin-content-list { display: flex; flex-direction: column; gap: 8px; }
    .admin-content-item { background: var(--zoo-bg-card); border: 1px solid var(--zoo-border); border-radius: var(--zoo-radius-sm); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
    .admin-content-item__thumb { width: 52px; height: 52px; border-radius: var(--zoo-radius-sm); background: var(--zoo-green-900); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .admin-content-item__info { flex: 1; min-width: 0; }
    .admin-content-item__title { color: #fff; font-weight: 600; font-size: .94rem; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-content-item__meta { color: var(--zoo-text-dim); font-size: .82rem; }
    .admin-content-item__actions { display: flex; gap: 6px; flex-shrink: 0; }

    .no-data { text-align: center; padding: 40px 20px; color: var(--zoo-text-dim); background: var(--zoo-bg-card); border: 1px dashed var(--zoo-border); border-radius: var(--zoo-radius); }

    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--zoo-green-700); color: #fff; padding: 12px 20px; border-radius: var(--zoo-radius-sm); box-shadow: 0 10px 30px rgba(0,0,0,.3); display: none; z-index: 1001; font-weight: 600; font-size: .9rem; }
    .toast.show { display: block; animation: slideUp 0.3s ease-out; }
    .toast.error { background: var(--zoo-orange); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .sec { display: none; }
    .sec.is-active { display: block; }

    @media (max-width: 860px) {
      /* El grid tenia align-content:normal (=stretch): con min-height:100vh
         repartia el sobrante entre sus filas y resolvia a "372px 328px" en
         vez de ajustarse al contenido. Esa altura sobrante bajaba a .asb y,
         por su propio align-content, inflaba las lineas del wrap: los
         botones pasaban de sus 44px naturales a 76px. Ambos start cortan la
         cadena. Van dentro del media query, asi que no tocan el escritorio. */
      .admin-shell { grid-template-columns: 1fr; align-content: start; }
      .asb {
        flex-direction: row; flex-wrap: wrap; padding: 12px; gap: 6px;
        align-content: flex-start;
        align-items: flex-start;
      }
      /* Solo marca del panel (icono + "Zoorigen / Admin"), markup estatico:
         no identifica al admin de la sesion, asi que en movil se oculta para
         recuperar su fila. La identidad de quien esta logueado no se muestra
         en ningun punto de este shell. */
      .asb-brand { display: none; }
      /* Un solo grupo ("Gestion"): el titulo no desambigua nada y en una
         tira horizontal gastaria una fila entera. Se mantiene oculto. */
      .asb-section { display: none; }

      /* La regla base .asb-item{width:100%} apilaba los 6 botones en 6
         filas (484px antes de cualquier contenido). En movil la nav es
         una tira que envuelve. */
      .asb-item {
        width: auto;
        flex: 0 0 auto;
        min-height: 44px;
        padding: 8px 12px;
        font-size: .84rem;
      }

      /* El pie es la UNICA via de cerrar sesion en todo el panel: no
         puede seguir oculto en movil. Va como fila propia justo debajo
         de la tira de navegacion, sin quedar enterrado. */
      .asb-ft {
        display: flex;
        flex: 1 0 100%;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
        padding-top: 10px;
      }
      .asb-ft a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 8px 14px;
        border: 1px solid var(--zoo-border);
        border-radius: var(--zoo-radius-sm);
      }

      /* Acciones de fila: eran de ~25px de alto para operaciones
         destructivas (eliminar miembro). min-height + padding, sin
         height fijo, para no cortar el texto. */
      .btn-small {
        min-height: 44px;
        padding: 10px 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }

      .am { padding: 18px; }
    }
  </style>

  <script>
    // ═══════════════════════════════════════════════════════════
    // ACCESO
    // Nada de lo que decide el permiso está escrito en esta página: el navegador pide una sesión de Firebase y pregunta
    // al servidor (GET /api/admin/yo), que responde 200 solo a administradores (correos de ADMIN_EMAILS o marca en
    // Firestore). Si la respuesta no es 200, no se muestra ningún dato y se regresa al Club.
    // ═══════════════════════════════════════════════════════════
    const AREAS = ['Fauna silvestre', 'Fauna ponzoñosa', 'Apicultura', 'Etología', 'Investigación', 'Manejo en cautiverio', 'Conservación'];

    // ═══════════ FLOW DE ACCESO ═══════════
    function mostrarAcceso(icono, titulo, texto, botones) {
      document.getElementById('apAcceso').hidden = false;
      document.getElementById('adminApp').hidden = true;
      document.getElementById('apAccesoIco').innerHTML = ZOO_ICONOS.svg(icono, { size: 28 });
      document.getElementById('apAccesoTitulo').textContent = titulo;
      document.getElementById('apAccesoTexto').textContent = texto;
      const caja = document.getElementById('apAccesoAcciones');
      caja.innerHTML = '';
      caja.hidden = !(botones && botones.length);
      (botones || []).forEach(b => {
        const a = document.createElement(b.href ? 'a' : 'button');
        a.className = 'ap-btn ap-btn--' + (b.tipo || 'primario');
        if (b.href) a.href = b.href; else { a.type = 'button'; a.addEventListener('click', b.alClic); }
        a.textContent = b.texto;
        caja.appendChild(a);
      });
    }

    let panelIniciado = false;
    async function verificarAcceso() {
      mostrarAcceso('shield-check', 'Verificando tu acceso', 'Estamos confirmando con el servidor que tu cuenta administra el sitio.');
      try {
        const yo = await ZOORIGEN_CLUB.apiFetch('/api/admin/yo');
        // Confirmado por el servidor: este navegador lo recuerda para que las páginas del Club de miembro lleven al panel sin
        // parpadeo, y se termina cualquier "Ver como usuario" que haya quedado en esta pestaña.
        ZOORIGEN_CLUB._marcarAdmin(true);
        try { sessionStorage.removeItem('zoo_como_usuario'); } catch (e) { /* sin almacenamiento */ }
        showAdmin(yo);
      } catch (err) {
        if (err.status === 401 || err.status === 403) {
          ZOORIGEN_CLUB._marcarAdmin(false);
          mostrarAcceso('lock', 'Esta zona es solo para administradores',
            'Tu cuenta no tiene permiso para entrar al panel de administración. Te llevamos de vuelta al Club.',
            [{ texto: 'Ir al Club ahora', href: 'club-dashboard.html' }]);
          setTimeout(() => { window.location.replace('club-dashboard.html'); }, 4000);
        } else {
          mostrarAcceso('cloud-off', 'No pudimos verificar tu acceso',
            err.status === 0 ? 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.' : 'El servidor no respondió como esperábamos. Inténtalo de nuevo en un momento.',
            [{ texto: 'Reintentar', alClic: verificarAcceso }, { texto: 'Ir al Club', href: 'club-dashboard.html', tipo: 'suave' }]);
        }
      }
    }

    function checkAccess() {
      auth.onAuthStateChanged((user) => {
        if (!user) { window.location.replace('club-login.html'); return; }
        if (!panelIniciado) verificarAcceso();
      });
    }

    function showAdmin(yo) {
      if (panelIniciado) return;
      panelIniciado = true;
      document.getElementById('apAcceso').hidden = true;
      document.getElementById('adminApp').hidden = false;
      initAdmin(yo);
    }

    window.adminLogout = () => { ZOORIGEN_CLUB.logout(); };

    // ═══════════ TOAST / MODAL HELPERS ═══════════
    const toast = (msg, isError = false) => {
      const t = document.getElementById('toast');
      // sin emojis: el ícono lo pone la propia notificación
      const texto = String(msg).replace(/^[^\p{L}\p{N}¿¡"'(]+/u, '').trim();
      t.innerHTML = ZOO_ICONOS.svg(isError ? 'circle-alert' : 'circle-check', { size: 18 }) + '<span class="toast__txt"></span>';
      t.querySelector('.toast__txt').textContent = texto;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.classList.remove('show'), 2800);
    };
    const openModal = (html) => { document.getElementById('modalForm').classList.remove('ce-host'); document.getElementById('modalForm').innerHTML = html; document.getElementById('modalOverlay').classList.add('is-open'); };
    const closeModal = () => { document.getElementById('modalForm').classList.remove('ce-host'); document.getElementById('modalOverlay').classList.remove('is-open'); };
    window.closeM = closeModal;
    document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

    const extractDriveId = (url) => {
      if (!url) return '';
      if (/^[a-zA-Z0-9_-]{15,}$/.test(url.trim())) return url.trim();
      const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if (m1) return m1[1];
      const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m2) return m2[1];
      return url.trim();
    };

    // ═══════════ INIT ═══════════
    let currentSec = 'resumen';

    function initAdmin() {
      const V = window.ZOO_ADMIN_VISTAS;
      V.iniciar({
        api: (ruta, op) => ZOORIGEN_CLUB.apiFetch(ruta, op),
        apiBase: () => ZOORIGEN_CLUB.apiBase(),
        toast,
        contenedor: () => document.getElementById('secView')
      });
      document.querySelectorAll('.asb-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const destino = '#/' + btn.dataset.sec;
          if (window.location.hash === destino) mostrarSeccion(btn.dataset.sec);
          else window.location.hash = destino;
          cerrarMenu();
        });
      });
      window.addEventListener('hashchange', () => mostrarSeccion(ZOO_ADMIN_PANEL.seccionDeHash(window.location.hash)));
      iniciarMenuMovil();
      iniciarTema();
      mostrarSeccion(ZOO_ADMIN_PANEL.seccionDeHash(window.location.hash));
      loadBadges();
    }

    function mostrarSeccion(sec) {
      const meta = ZOO_ADMIN_PANEL.seccion(sec) || ZOO_ADMIN_PANEL.seccion('resumen');
      currentSec = meta.id;
      document.body.setAttribute('data-zoo', meta.zoo);
      document.querySelectorAll('.asb-item').forEach(b => {
        const activo = b.dataset.sec === meta.id;
        b.classList.toggle('is-active', activo);
        if (activo) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
      document.getElementById('apMiga').textContent = meta.titulo;
      document.title = meta.titulo + ' · Panel de administración · Zoorigen';
      renderSection(meta.id);
      const v = document.getElementById('secView');
      window.scrollTo({ top: 0 });
      try { v.focus({ preventScroll: true }); } catch (e) { /* sin foco */ }
    }

    function iniciarMenuMovil() {
      const btn = document.getElementById('apMenuBtn');
      btn.addEventListener('click', () => {
        const abierto = document.getElementById('asb').classList.contains('is-abierto');
        if (abierto) cerrarMenu(); else abrirMenu();
      });
      document.getElementById('apVelo').addEventListener('click', cerrarMenu);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarMenu(); });
    }
    function abrirMenu() {
      document.getElementById('asb').classList.add('is-abierto');
      document.getElementById('apVelo').hidden = false;
      document.getElementById('apMenuBtn').setAttribute('aria-expanded', 'true');
    }
    function cerrarMenu() {
      document.getElementById('asb').classList.remove('is-abierto');
      document.getElementById('apVelo').hidden = true;
      document.getElementById('apMenuBtn').setAttribute('aria-expanded', 'false');
    }

    // Modo día / noche: el mismo del Club (localStorage "zoo_theme") y data-modo para los módulos anteriores.
    function iniciarTema() {
      const btn = document.getElementById('apTema');
      const aplicar = (modo) => {
        const h = document.documentElement;
        h.setAttribute('data-theme', modo);
        h.setAttribute('data-modo', modo === 'dark' ? 'oscuro' : 'claro');
        btn.innerHTML = ZOO_ICONOS.svg(modo === 'dark' ? 'sun' : 'moon', { size: 20 });
        btn.setAttribute('aria-label', modo === 'dark' ? 'Cambiar a modo día' : 'Cambiar a modo noche');
      };
      aplicar(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
      btn.addEventListener('click', () => {
        const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('zoo_theme', nuevo); } catch (e) { /* sin almacenamiento */ }
        aplicar(nuevo);
      });
    }

    async function loadBadges() {
      const cols = ['cursos', 'certificados', 'videos', 'pdfs', 'sesiones'];

    // Vista previa de la portada: se actualiza al escribir el enlace o el título (la portada automática depende del título).
    function enlazarPortada() {
      const campo = document.getElementById('f_image');
      const titulo = document.getElementById('f_title');
      const vista = document.getElementById('f_image_vista');
      const estado = document.getElementById('f_image_estado');

        vista.style.backgroundImage = vp.src ? `url('${vp.src.replace(/'/g, '%27')}')` : '';
        vista.dataset.origen = vp.origen;
        estado.textContent = vp.texto;
        estado.classList.toggle('is-error', !vp.valido);
        if (auto) auto.hidden = !campo.value.trim();
      };
      campo.addEventListener('input', pintar);
      if (titulo) titulo.addEventListener('input', pintar);
      if (auto) auto.addEventListener('click', () => { campo.value = ''; pintar(); campo.focus(); });

    window.renderLeccionesForm = () => {

    // Un solo juego de eventos para todo el editor de clases (no se pierde el foco al escribir).
    function enlazarLecciones() {
      const cont = document.getElementById('leccionesContainer');
      if (!cont) return;
      const indice = el => { const c = el.closest('[data-lec]'); return c ? parseInt(c.dataset.lec, 10) : -1; };
      const redibujar = (enfocar) => {
        const caja = document.querySelector('#modalForm .ce-form');   // el área que se desplaza dentro de la ventana
        const y = caja ? caja.scrollTop : 0;
        renderLeccionesForm();
        if (caja) caja.scrollTop = y;
        if (enfocar !== undefined) {
          const filas = cont.querySelectorAll(`[data-lec="${enfocar}"] .ce-fila`);
          const campo = filas.length ? filas[filas.length - 1].querySelector('input') : null;
          if (campo) campo.focus();
        }
      };

      cont.addEventListener('input', ev => {
        const t = ev.target, i = indice(t);
        if (t.dataset.ruta && i >= 0) CURSOS.asignarRuta(window.__leccionesTemp[i], t.dataset.ruta, t.value);
      });
      cont.addEventListener('change', ev => {
        const t = ev.target, i = indice(t);
        if (i < 0) return;
        const lec = window.__leccionesTemp[i];
        const qi = (() => { const c = t.closest('[data-q]'); return c ? parseInt(c.dataset.q, 10) : -1; })();
        if (t.dataset.accion === 'juego-tipo') { lec.juego = CURSOS.nuevoJuego(t.value); redibujar(); }
        else if (t.dataset.accion === 'pregunta-tipo') { if (lec.preguntas && lec.preguntas[qi] && CURSOS.cambiarTipoPregunta(lec.preguntas[qi], t.value)) redibujar(); }
        else if (t.dataset.accion === 'gratis') lec.gratis = t.checked === true;
        else if (t.dataset.ruta && t.tagName === 'SELECT') CURSOS.asignarRuta(lec, t.dataset.ruta, t.value);
      });
      cont.addEventListener('click', ev => {
        const b = ev.target.closest('[data-accion]');
        if (!b || b.disabled || b.tagName === 'SELECT') return;
        const i = indice(b);
        if (i < 0) return;
        const lista = window.__leccionesTemp, lec = lista[i];
        switch (b.dataset.accion) {
          case 'lec-subir': if (CURSOS.moverLeccion(lista, i, -1)) redibujar(); break;
          case 'lec-bajar': if (CURSOS.moverLeccion(lista, i, 1)) redibujar(); break;
          case 'lec-quitar':
            if (lista.length <= 1) break;
            if (lec.juego && !confirm('Esta clase tiene un juego. ¿Quitarla de todos modos?')) break;
            lista.splice(i, 1); redibujar(); break;
          case 'juego-agregar': lec.juego = { tipo: '', datos: {} }; redibujar(); break;
          case 'juego-quitar': delete lec.juego; redibujar(); break;
          case 'fila-agregar': if (CURSOS.agregarFila(lec.juego)) redibujar(i); break;
          case 'fila-quitar': if (CURSOS.quitarFila(lec.juego, parseInt(b.dataset.fila, 10))) redibujar(); break;
          case 'pregunta-agregar':
            if (CURSOS.agregarPregunta(lec)) {
              redibujar();
              const cajas = cont.querySelectorAll(`[data-lec="${i}"] .ce-preg textarea`);
              if (cajas.length) cajas[cajas.length - 1].focus();
            }
            break;
          case 'pregunta-quitar': { const q = b.closest('[data-q]'); if (q && CURSOS.quitarPregunta(lec, parseInt(q.dataset.q, 10))) redibujar(); break; }
          case 'opcion-agregar': { const q = b.closest('[data-q]'); if (q && lec.preguntas && CURSOS.agregarOpcion(lec.preguntas[parseInt(q.dataset.q, 10)])) redibujar(); break; }
          case 'opcion-quitar': { const q = b.closest('[data-q]'); if (q && lec.preguntas && CURSOS.quitarOpcion(lec.preguntas[parseInt(q.dataset.q, 10)], parseInt(b.dataset.o, 10))) redibujar(); break; }
        }
      });
    }

    // Botón "Sincronizar con Bunny" del formulario: llena los videos de ESTE curso.
    // Pide la lista al servidor (Bunny en vivo). Si el servidor aún no tiene la clave de Bunny,
    // usa el catálogo guardado en el sitio (los 15 cursos ya conocidos).
    window.sincronizarCursoBunny = async () => {
      const btn = document.getElementById('cf-sync-bunny');
      const titulo = (document.getElementById('f_title') || {}).value || '';
      if (!titulo.trim()) { toast('Escribe primero el título del curso: con él se busca la colección en Bunny.', true); return; }
      const texto = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = ZOO_ICONOS.svg('refresh-cw', { size: 16, clase: 'zi-spin' }) + 'Consultando Bunny…'; }
      let catalogo = null, origen = 'vivo';
      try {
        const user = firebase.auth().currentUser;
        if (!user) throw new Error('sesion');
        const token = await user.getIdToken();
        const r = await fetch('https://zoorigen-webhook-production.up.railway.app/api/admin/bunny-catalogo', { headers: { Authorization: 'Bearer ' + token } });
        const data = await r.json().catch(() => ({}));
        if (r.ok && Array.isArray(data.catalogo)) catalogo = data.catalogo;
        else if (data && data.codigo !== 'sin_api_key' && r.status !== 404) throw new Error(data.error || ('HTTP ' + r.status));
      } catch (err) {
        if (btn) { btn.disabled = false; btn.innerHTML = texto; }
        toast('No se pudo consultar Bunny: ' + (err.message === 'sesion' ? 'tu sesión expiró, vuelve a entrar' : err.message), true);
        return;
      }
      if (!catalogo) { catalogo = CURSOS.catalogoDesdeArchivo(window.ZOORIGEN_BUNNY_CATALOG); origen = 'archivo'; }
      if (btn) { btn.disabled = false; btn.innerHTML = texto; }

      const hallada = CURSOS.mejorColeccion(titulo, catalogo);
      if (!hallada) {
        toast(origen === 'archivo'
          ? 'No encontré ese curso en el catálogo guardado en el sitio. Para ver videos nuevos de Bunny falta conectar la clave de Bunny en el servidor.'
          : `No encontré en Bunny una colección parecida a "${titulo.trim()}". Revisa que se llamen parecido.`, true);
        return;
      }
      const col = hallada.coleccion;
      const idActual = window.__cursoEditandoId || '';
      const enUso = CURSOS.videosUsadosPorOtros(cursosEstado.items, idActual, col);
      const aviso = `Se encontró la colección "${col.titulo}" en Bunny (${col.sesiones.length} videos).\n\n` +
        (hallada.puntaje < 0.9 ? 'OJO: el nombre no es igual al del curso, revisa que sea la correcta.\n\n' : '') +
        (enUso.length ? `OJO: esos videos ya están en: ${enUso.join(', ')}.\n\n` : '') +
        'Se llenará el video de cada clase por orden. No se cambian títulos que ya escribiste, preguntas, juegos ni clases gratis. Aún no se guarda nada hasta pulsar "Guardar". ¿Continuar?';
      if (!confirm(aviso)) return;
      const r = CURSOS.aplicarColeccion(window.__leccionesTemp, col);
      window.__leccionesTemp = r.lecciones.length ? r.lecciones : [CURSOS.leccionVacia()];
      renderLeccionesForm();
      toast(`${r.actualizadas + r.nuevas} clases vinculadas desde "${col.titulo}"${r.sobrantes ? ` · ${r.sobrantes} clase(s) del curso no tienen video en Bunny` : ''}${origen === 'archivo' ? ' (catálogo guardado en el sitio)' : ''}. Pulsa Guardar para terminar.`);
    };

    window.agregarLeccion = () => {
      window.__leccionesTemp.push(CURSOS.leccionVacia());
      renderLeccionesForm();

    window.saveCurso = async (id) => {
      // Valida y limpia las clases (descarta las vacías y revisa que cada juego esté completo)
      const { lecciones, errores } = CURSOS.limpiarLecciones(window.__leccionesTemp);
      if (errores.length) { toast(`${errores[0].mensaje}.`, true); return; }
      const disponibleSiempre = (document.querySelector('input[name="f_disp"]:checked') || {}).value === 'siempre';
      const cursoMuestraGratis = !!(document.getElementById('f_muestra') || {}).checked;
      const hayClaseGratis = lecciones.some(l => l.gratis === true);
      if (cursoMuestraGratis) {
        const otro = (cursosEstado.items || []).find(c => c.id !== id && c.cursoMuestraGratis === true);
        if (otro) { toast(`Ya hay un curso con clases gratis de muestra: "${otro.title || 'otro curso'}". Desmárcalo primero.`, true); return; }
        if (!hayClaseGratis) { toast('Marca al menos una clase como gratis, o desactiva "clases gratis de muestra".', true); return; }
      } else if (hayClaseGratis) {
        toast('Hay clases marcadas como gratis, pero el curso no tiene activadas las "clases gratis de muestra".', true); return;
      }
      const data = {
        title: document.getElementById('f_title').value.trim(),
        area: document.getElementById('f_area').value,
        duration: document.getElementById('f_duration').value.trim(),
        level: document.getElementById('f_level').value,
        instructor: document.getElementById('f_instructor').value.trim(),
        disponibleSiempre,
        cursoMuestraGratis,
        lecciones: lecciones,
        totalClases: lecciones.length,
        // Mantener driveId de primera clase para retrocompatibilidad
        driveId: lecciones[0]?.driveId || '',
        description: document.getElementById('f_desc').value.trim(),
        tag: document.getElementById('f_tag').value.trim()
      };
      // Orden de desbloqueo: solo para cursos nuevos (o los que antes no hacían fila). Los de siempre no se mueven.
      const actual = id ? (cursosEstado.items || []).find(c => c.id === id) : null;
      // Portada: sin tocar el campo no cambia nada; con enlace se fija como propia; vacío usa la portada por título o la de la marca.
      const campoImagen = document.getElementById('f_image');
      const errorImagen = CURSOS.errorPortada(campoImagen.value);
      if (errorImagen) { toast(errorImagen, true); return; }
      Object.assign(data, CURSOS.cambiosPortada(actual, campoImagen.value, campoImagen.dataset.mostrado));
      const ordenVip = CURSOS.calcularOrdenVip(cursosEstado.items, actual, { disponibleSiempre, cursoMuestraGratis });
      if (ordenVip !== undefined) data.ordenVip = ordenVip;
      if (!data.title) { toast('Título requerido', true); return; }
      if (lecciones.length === 0) { toast('Agrega al menos 1 clase con video', true); return; }
      try {
        if (id) { await db.collection('cursos').doc(id).update(data); toast('Actualizado'); }
        else { data.createdAt = new Date().toISOString(); await db.collection('cursos').add(data); toast('Creado'); }
        closeModal(); loadCursos(); loadBadges();
      } catch (err) { toast('Error: ' + err.message, true); }
    };

    function normalizarTituloBunny(valor) {
      return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function similitudTituloBunny(a, b) {
      const stop = new Set(['de','del','la','las','los','el','en','para','por','y','con','un','una']);
      const tokens = valor => new Set(normalizarTituloBunny(valor).split(' ').filter(x => x && !stop.has(x)));
      const aa = tokens(a), bb = tokens(b);
      if (!aa.size || !bb.size) return 0;
      let iguales = 0;
      aa.forEach(x => { if (bb.has(x)) iguales++; });
      // El título existente suele ser una versión corta del nombre de Bunny.
      // Medir contra el conjunto menor permite conservar su portada y textos.
      return iguales / Math.min(aa.size, bb.size);
    }

    function slugCursoBunny(valor) {
      return normalizarTituloBunny(valor).replace(/\s+/g, '-').slice(0, 90) || `curso-${Date.now()}`;
    }

    // Importación idempotente: reemplaza las clases, pero conserva portadas,
    // descripciones, materiales, disponibilidad y documentos de progreso.
    window.sincronizarCatalogoBunny = async () => {
      const catalogo = window.ZOORIGEN_BUNNY_CATALOG;
      const btn = document.getElementById('syncBunnyBtn');
      if (!Array.isArray(catalogo) || catalogo.length !== 15) {
        toast('No se encontró el catálogo completo de Bunny', true);
        return;
      }
      const totalVideos = catalogo.reduce((n, c) => n + (c.lecciones?.length || 0), 0);
      if (totalVideos !== 61) {
        toast(`Catálogo incompleto: ${totalVideos} de 61 videos`, true);
        return;
      }
      if (!confirm(`Se vincularán ${totalVideos} videos Bunny con ${catalogo.length} cursos.\n\nSe conservarán portadas, textos, materiales y progreso. ¿Continuar?`)) return;

      if (btn) { btn.disabled = true; btn.innerHTML = ZOO_ICONOS.svg('refresh-cw', { size: 16, clase: 'zi-spin' }) + ' Sincronizando…'; }
      try {
        const snap = await db.collection('cursos').get();
        const existentes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const usados = new Set();
        let actualizados = 0;
        let creados = 0;
        const creadosEnEstaCorrida = [];

        for (const item of catalogo) {
          const exacto = existentes.find(c => !usados.has(c.id) && normalizarTituloBunny(c.title) === normalizarTituloBunny(item.title));
          const aproximado = exacto || existentes
            .filter(c => !usados.has(c.id))
            .map(c => ({ curso: c, score: similitudTituloBunny(c.title, item.title) }))
            .filter(x => x.score >= 0.75)
            .sort((a, b) => b.score - a.score)[0]?.curso;
          const previo = aproximado || null;
          const docId = previo?.id || `bunny-${slugCursoBunny(item.title)}`;
          if (previo) usados.add(previo.id);

          const leccionesAnteriores = Array.isArray(previo?.lecciones) ? previo.lecciones : [];
          // Conserva títulos y juegos de cada clase (función probada en tests/admin-cursos.test.js)
          const lecciones = CURSOS.migrarLecciones(leccionesAnteriores, item.lecciones);

          const data = {
            lecciones,
            totalClases: lecciones.length,
            videoProvider: 'bunny',
            bunnyLibraryId: 731751,
            bunnyCourseKey: normalizarTituloBunny(item.title),
            migradoDesdeDrive: true,
            bunnySincronizadoEn: firebase.firestore.FieldValue.serverTimestamp()
          };

          if (!previo) {
            // Un curso creado por la sincronización también va al final de la fila, no al principio
            const nuevoOrden = CURSOS.siguienteOrdenVip(existentes.concat(creadosEnEstaCorrida));
            creadosEnEstaCorrida.push({ ordenVip: nuevoOrden });
            data.ordenVip = nuevoOrden;
            Object.assign(data, {
              title: item.title,
              area: 'Fauna silvestre',
              duration: '',
              level: 'Intermedio',
              image: '',
              description: '',
              tag: 'Bunny',
              createdAt: new Date().toISOString()
            });
            creados++;
          } else {
            actualizados++;
          }

          await db.collection('cursos').doc(docId).set(data, { merge: true });
        }

        toast(`61 videos sincronizados · ${actualizados} cursos actualizados · ${creados} creados`);
        await loadCursos();

    const contenidoCache = {};
    function listaContenido(coleccion, items, icono, tono, meta, etiqueta) {
      const F = window.ZOO_ADMIN_FILAS;
      contenidoCache[coleccion] = items;

        avatar: '<span class="ap-ico-tile ap-tono-' + tono + '" aria-hidden="true">' + ZOO_ICONOS.svg(icono, { size: 18 }) + '</span>',
        titulo: x.title || 'Sin título', accion: { a: 'editar', datos: { col: coleccion, id: x.id } },
        meta: meta(x),
        acciones: [{ t: 'Editar', i: 'pencil', a: 'editar' }, { t: 'Eliminar', i: 'trash-2', a: 'eliminar', p: true, sep: true }],
        etiquetaMenu: 'Acciones de ' + (x.title || 'este elemento'), datos: { col: coleccion, id: x.id }
      })), { etiqueta });
    }
    function enlazarContenido() {
      document.getElementById('secView').onclick = (ev) => {
        const b = ev.target.closest('[data-accion]');
        if (!b || !b.dataset.col) return;
        const x = (contenidoCache[b.dataset.col] || []).find(i => i.id === b.dataset.id);
        if (!x) return;
        if (b.dataset.accion === 'editar') ({ videos: window.formVideo, pdfs: window.formPdf, sesiones: window.formSesion })[b.dataset.col](x);
        else if (b.dataset.accion === 'eliminar') window.delDoc(b.dataset.col, x.id, x.title || '');
      };
    }
    const esc = (v) => ZOO_ADMIN_FILAS.esc(v);

    async function loadPdfs() {
      const v = document.getElementById('secView');
      v.innerHTML = '<h1>PDFs</h1><p class="sub">Material descargable y guías científicas</p>';
      try {
        const snap = await db.collection('pdfs').orderBy('createdAt', 'desc').get();

    // ── Ligar un PDF a un curso y a una clase (opcional) ──
    // Sin curso: material general (se abre con la membresía, o con N retos si se pide). Con curso y clase: el servidor lo entrega
    // solo a quien ya terminó esa clase. Con curso y sin clase: material de todo el curso (se abre con la membresía).
    let cursosParaPdf = null;
    async function cargarCursosParaPdf() {
      if (cursosParaPdf) return cursosParaPdf;
      try {
        const snap = await db.collection('cursos').get();
        cursosParaPdf = snap.docs.map(d => {
          const c = d.data() || {};
          const lec = Array.isArray(c.lecciones) ? c.lecciones : [];
          return { id: d.id, titulo: String(c.title || c.titulo || d.id), clases: lec.map((l, k) => String((l && l.titulo) || ('Clase ' + (k + 1)))) };
        }).sort((a, b) => a.titulo.localeCompare(b.titulo, 'es'));
      } catch (err) { cursosParaPdf = []; }
      return cursosParaPdf;
    }
    const escPdf = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function textoLigaPdf(x, cursos) {
      if (x.cursoId) {
        const c = (cursos || []).find(k => k.id === x.cursoId);
        const clase = parseInt(x.clase, 10) > 0 ? 'se abre al terminar la clase ' + parseInt(x.clase, 10) : 'material de todo el curso';
        return ' · Curso: ' + escPdf(c ? c.titulo : x.cursoId + ' (no existe)') + ' · ' + clase;
      }
      return parseInt(x.requiereRetos, 10) > 0 ? ' · Se abre con ' + parseInt(x.requiereRetos, 10) + ' retos' : ' · General: se abre con la membresía';
    }
    // Al cambiar de curso se rehace la lista de clases y se muestran solo las casillas que aplican
    window.pdfCursoCambio = (claseActual) => {
      const id = document.getElementById('f_curso').value;
      const curso = (cursosParaPdf || []).find(k => k.id === id);
      const sel = document.getElementById('f_clase');
      const actual = claseActual === undefined ? parseInt(sel.value, 10) || 0 : claseActual;
      sel.innerHTML = '<option value="0">Todo el curso (se abre con la membresía)</option>' +
        (curso ? curso.clases.map((t, k) => '<option value="' + (k + 1) + '"' + (actual === k + 1 ? ' selected' : '') + '>Clase ' + (k + 1) + ' · ' + escPdf(t) + '</option>').join('') : '');
      document.getElementById('f_clase_caja').style.display = id ? '' : 'none';
      document.getElementById('f_retos_caja').style.display = id ? 'none' : '';
    };

    window.formPdf = async (data = {}) => {
      const cursos = await cargarCursosParaPdf();
      const idActual = data.cursoId || '';
      const huerfano = idActual && !cursos.some(k => k.id === idActual);
      openModal(`
        <h3>${data.id ? 'Editar' : 'Nuevo'} PDF</h3>
        <div class="field"><label>Título *</label><input type="text" id="f_title" value="${escPdf(data.title)}"></div>
        <div class="field"><label>Área *</label><select id="f_area">${AREAS.map(a => `<option ${data.area === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
        <div class="field"><label>Páginas</label><input type="number" id="f_pages" value="${data.pages || ''}"></div>
        <div class="field"><label>Link o ID de Drive *</label><input type="text" id="f_drive" value="${escPdf(data.driveId)}"><p class="hint">Drive → clic derecho al PDF → Compartir → "Cualquiera con el link"</p></div>
        <div class="field"><label>Curso (opcional)</label><select id="f_curso" onchange="pdfCursoCambio()">
          <option value="">Ninguno: material general del Club</option>
          ${huerfano ? `<option value="${escPdf(idActual)}" selected>(el curso ${escPdf(idActual)} ya no existe)</option>` : ''}
          ${cursos.map(k => `<option value="${escPdf(k.id)}" ${idActual === k.id ? 'selected' : ''}>${escPdf(k.titulo)}</option>`).join('')}
        </select><p class="hint">Si lo ligas a un curso, solo lo abren los miembros que ya terminaron la clase que elijas.</p></div>
        <div class="field" id="f_clase_caja"><label>Clase que lo desbloquea</label><select id="f_clase"></select><p class="hint">Se abre cuando la persona marca esa clase como vista (la primera clase es la 1).</p></div>
        <div class="field" id="f_retos_caja"><label>Retos para abrirlo (opcional)</label><input type="number" id="f_retos" min="0" max="200" value="${parseInt(data.requiereRetos, 10) > 0 ? parseInt(data.requiereRetos, 10) : ''}" placeholder="0"><p class="hint">Vacío o 0: se abre con la membresía. Solo aplica a materiales sin curso.</p></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeM()">Cancelar</button>
          <button class="btn-save" onclick="savePdf('${data.id || ''}')">${data.id ? 'Guardar' : 'Crear'}</button>
        </div>`);
      pdfCursoCambio(parseInt(data.clase, 10) || 0);
    };

    window.savePdf = async (id) => {
      const data = { title: document.getElementById('f_title').value.trim(), area: document.getElementById('f_area').value, pages: parseInt(document.getElementById('f_pages').value) || null, driveId: extractDriveId(document.getElementById('f_drive').value) };
      if (!data.title) { toast('Título requerido', true); return; }
      if (!data.driveId) { toast('Link requerido', true); return; }
      // Curso, clase y retos: al quitarlos de un PDF que ya existía se borran los campos (así vuelve a ser general)
      const cursoId = document.getElementById('f_curso').value;
      const clase = cursoId ? (parseInt(document.getElementById('f_clase').value, 10) || 0) : 0;
      const retos = cursoId ? 0 : Math.max(0, Math.min(200, parseInt(document.getElementById('f_retos').value, 10) || 0));
      const borrar = firebase.firestore.FieldValue.delete();
      if (id) {
        data.cursoId = cursoId || borrar; data.clase = clase > 0 ? clase : borrar; data.requiereRetos = retos > 0 ? retos : borrar;
      } else {
        if (cursoId) data.cursoId = cursoId;
        if (clase > 0) data.clase = clase;
        if (retos > 0) data.requiereRetos = retos;
      }
      try {
        if (id) await db.collection('pdfs').doc(id).update(data);
        else { data.createdAt = new Date().toISOString(); await db.collection('pdfs').add(data); }
        toast('Guardado'); closeModal(); loadPdfs(); loadBadges();
      } catch (err) { toast('Error: ' + err.message, true); }
    };

    // ═══════════ CERTIFICADOS EMITIDOS ═══════════
    const CERTS = window.ZOO_ADMIN_CERTS;
    const certEstado = { items: [], texto: '', curso: 'todos', orden: 'recientes' };

    async function loadCertificados() {
      const v = document.getElementById('secView');
      v.innerHTML = '<h1>Certificados emitidos</h1><p class="sub">Cargando certificados…</p>';
      try {
        // Sin orderBy: se ordena aquí para no dejar fuera ningún certificado.
        const snap = await db.collection('certificados').get();
        certEstado.items = snap.docs.map(d => CERTS.normalizar({ id: d.id, ...d.data() }));
        renderCertificados();
      } catch (err) { v.innerHTML += `<div class="error-msg show">Error: ${CERTS.esc(err.message)}</div>`; }
    }

    function renderCertificados() {
      const v = document.getElementById('secView');
      const e = certEstado, items = e.items;
      v.innerHTML = `
        <header class="sec-hero">
          <div class="sec-hero__txt">
            <span class="sec-eyebrow">Emisión</span>
            <h1>Certificados emitidos</h1>
            <p>Consulta los certificados que han obtenido tus alumnos, comparte su enlace de verificación o descarga la lista. Los certificados los emite el servidor al terminar cada curso; desde aquí solo puedes emitir uno manualmente.</p>
          </div>
          <div class="sec-hero__acc">
            <button class="btn-add" id="certEmitir">${ZOO_ICONOS.svg('plus', { size: 16 })} Emitir certificado</button>
            <button class="btn-add btn-add--suave" id="certCsv">${ZOO_ICONOS.svg('download', { size: 16 })} Descargar lista (CSV)</button>
          </div>
        </header>
        ${CERTS.kpisHTML(CERTS.resumen(items))}
        <div class="cc-toolbar">
          <div class="m-search">${ZOO_ICONOS.svg('search', { size: 16 })}<input type="search" class="admin-search" id="certBuscar" placeholder="Buscar por alumno, correo, curso o folio" aria-label="Buscar certificados" value="${CERTS.esc(e.texto)}"></div>
          <label class="cf-selector"><span class="sr-only">Filtrar por curso</span><select id="certCurso" class="ce-input"></select></label>
          <div class="zoo-chips" id="certOrden" role="group" aria-label="Ordenar certificados"></div>
        </div>
        <div id="certLista"></div>`;

      let filtrados = [];
      const pintar = () => {
        filtrados = CERTS.filtrar(items, { texto: e.texto, curso: e.curso, orden: e.orden });
        document.getElementById('certCurso').innerHTML = CERTS.opcionesCursoHTML(CERTS.cursosConConteo(items), e.curso, items.length);
        document.getElementById('certOrden').innerHTML = CERTS.ordenHTML(e.orden);
        document.getElementById('certLista').innerHTML = CERTS.listaHTML(filtrados);
        document.getElementById('certCsv').disabled = filtrados.length === 0;
      };
      pintar();

      document.getElementById('certEmitir').addEventListener('click', emitirCertificadoManual);
      document.getElementById('certBuscar').addEventListener('input', ev => { e.texto = ev.target.value; pintar(); });
      document.getElementById('certCurso').addEventListener('change', ev => { e.curso = ev.target.value; pintar(); });
      document.getElementById('certOrden').addEventListener('click', ev => {
        const b = ev.target.closest('[data-orden]');
        if (b) { e.orden = b.dataset.orden; pintar(); }
      });
      document.getElementById('certLista').addEventListener('click', async ev => {
        const b = ev.target.closest('[data-accion="copiar"]');
        if (!b) return;
        const url = CERTS.urlVerificar(b.dataset.folio);
        try { await navigator.clipboard.writeText(url); toast('Enlace de verificación copiado'); }
        catch (err) { window.prompt('Copia el enlace de verificación:', url); }
      });
      document.getElementById('certCsv').addEventListener('click', () => {
        const blob = new Blob(['﻿' + CERTS.csv(filtrados)], { type: 'text/csv;charset=utf-8' });
        const enlace = document.createElement('a');
        enlace.href = URL.createObjectURL(blob);
        enlace.download = `certificados-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(enlace); enlace.click(); enlace.remove();
        setTimeout(() => URL.revokeObjectURL(enlace.href), 1000);
        toast(`Se descargaron ${filtrados.length} certificado${filtrados.length === 1 ? '' : 's'}`);
      });
    }

    // Emisión manual: el servidor crea el certificado (POST /api/admin/certificados); aquí no se escribe en Firestore.
    async function emitirCertificadoManual() {
      const boton = document.getElementById('certEmitir');
      if (boton) boton.disabled = true;
      try {
        const [ms, cs] = await Promise.all([db.collection('miembros').get(), db.collection('cursos').get()]);
        const miembros = ms.docs.map(d => ({ id: d.id, name: d.data().name, email: d.data().email }));
        const cursos = cs.docs.map(d => ({ id: d.id, title: d.data().title }));
        openModal(CERTS.modalEmitirHTML(miembros, cursos));
      } catch (err) {
        toast('No se pudieron cargar alumnos y cursos: ' + err.message, true);
        return;
      } finally {
        if (boton) boton.disabled = false;
      }
      const enviar = document.getElementById('certEmEnviar');
      const errorEl = document.getElementById('certEmError');
      enviar.addEventListener('click', async () => {
        const r = CERTS.cuerpoEmision({
          uid: document.getElementById('certEmUid').value,
          cursoId: document.getElementById('certEmCurso').value,
          nombre: document.getElementById('certEmNombre').value,
          horas: document.getElementById('certEmHoras').value,
          sesiones: document.getElementById('certEmSesiones').value
        });
        if (!r.ok) { errorEl.textContent = r.error; errorEl.style.display = 'block'; return; }
        errorEl.style.display = 'none';
        enviar.disabled = true; enviar.textContent = 'Emitiendo…';
        try {
          const resp = await ZOORIGEN_CLUB.apiFetch('/api/admin/certificados', { method: 'POST', body: r.cuerpo });
          const folio = resp && resp.certificado && resp.certificado.folio;
          closeModal();
          toast(folio ? 'Certificado emitido: ' + folio : 'Certificado emitido');
          loadCertificados();
        } catch (err) {
          errorEl.textContent = CERTS.mensajeErrorEmision(err);
          errorEl.style.display = 'block';
          enviar.disabled = false; enviar.textContent = 'Emitir certificado';
        }
      });
    }

    // ═══════════ ENCUESTA DE LA PORTADA ═══════════
    // Los datos los lee el servidor con el Admin SDK (GET /api/admin/encuesta/detalle y /api/admin/chatbot/sin-respuesta/detalle, con las
    // rutas anteriores como respaldo); aquí no se lee Firestore directo. La agregación está en assets/js/admin-encuesta.js.
    async function loadEncuesta() {
      const v = document.getElementById('secView');
      const A = window.ZOO_ADMIN_ENCUESTA;
      v.innerHTML = A.cargandoHTML();
      const api = (ruta, op) => ZOORIGEN_CLUB.apiFetch(ruta, op);
      const estado = await A.cargar(api, { detalle: true });
      if (currentSec !== 'encuesta') return; // cambió de sección mientras cargaba
      const V = window.ZOO_ADMIN_VISTAS;
      A.montar(v, estado, { api, toast, modal: V.modal, confirmar: V.confirmar, recargar: loadEncuesta });
      if (estado.encuesta.ok) { const nb = document.getElementById('nb-encuesta'); nb.textContent = A.consolidar(estado.encuesta.docs).length; nb.hidden = false; }
    }

    // ═══════════ ARRANCAR ═══════════
    checkAccess();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
