<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foro VIP · Club Zoorigen</title>
  <meta name="theme-color" content="#1F5F3A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="club-main__header">
        <div class="club-main__greeting">
          <h1>💬 Foro VIP</h1>
          <p class="date">Comunidad privada de profesionales en fauna</p>
        </div>
        <button class="btn-club" id="newPostBtn" style="width:auto;padding:10px 22px;margin-top:0;">+ Nueva discusión</button>
      </div>

      <!-- Filtros de categoría -->
      <div class="foro-categories">
        <button class="foro-cat is-active" data-cat="all">📋 Todas</button>
        <button class="foro-cat" data-cat="casos">⚕️ Casos clínicos</button>
        <button class="foro-cat" data-cat="manejo">🧤 Manejo & captura</button>
        <button class="foro-cat" data-cat="identificacion">🔍 Identificación</button>
        <button class="foro-cat" data-cat="legal">⚖️ Legal & UMAs</button>
        <button class="foro-cat" data-cat="empleo">💼 Empleo & oportunidades</button>
        <button class="foro-cat" data-cat="consulta">❓ Consulta general</button>
      </div>

      <!-- Stats del foro -->
      <div class="foro-stats-bar">
        <div><strong id="totalPosts">0</strong> discusiones</div>
        <div><strong id="totalMembers">0</strong> miembros activos</div>
        <div>🔴 <strong>En vivo</strong></div>
      </div>

      <!-- Lista de posts -->
      <div class="foro-list" id="foroList">
        <div class="foro-loading">Cargando discusiones...</div>
      </div>
    </main>
  </div>

  <!-- Modal para crear nueva discusión -->
  <div id="newPostModal" class="foro-modal">
    <div class="foro-modal-backdrop" onclick="closeNewPost()"></div>
    <div class="foro-modal-box">
      <div class="foro-modal-header">
        <h2>📝 Nueva discusión</h2>
        <button class="foro-modal-close" onclick="closeNewPost()">×</button>
      </div>
      <div class="foro-modal-body">
        <div class="field">
          <label for="postTitle">Título de la discusión</label>
          <input type="text" id="postTitle" placeholder="Ej. Necropsia en tapir juvenil con signos de deshidratación" maxlength="150">
          <small style="color:var(--zoo-text-dim);">Sé específico — ayuda a otros colegas a encontrarla</small>
        </div>
        <div class="field">
          <label for="postCategory">Categoría</label>
          <select id="postCategory">
            <option value="casos">⚕️ Casos clínicos</option>
            <option value="manejo">🧤 Manejo & captura</option>
            <option value="identificacion">🔍 Identificación</option>
            <option value="legal">⚖️ Legal & UMAs</option>
            <option value="empleo">💼 Empleo & oportunidades</option>
            <option value="consulta">❓ Consulta general</option>
          </select>
        </div>
        <div class="field">
          <label for="postContent">Contenido</label>
          <textarea id="postContent" placeholder="Describe tu caso, pregunta u observación. Incluye detalles relevantes: especie, edad, síntomas, ubicación, etc." rows="8" maxlength="2000"></textarea>
          <small style="color:var(--zoo-text-dim);" id="charCount">0 / 2000 caracteres</small>
        </div>
        <div class="error-msg" id="postError"></div>
      </div>
      <div class="foro-modal-footer">
        <button class="btn-club-outline" onclick="closeNewPost()">Cancelar</button>
        <button class="btn-club" id="submitPost" style="width:auto;padding:12px 24px;margin:0;">Publicar discusión</button>
      </div>
    </div>
  </div>

  <!-- Modal para ver discusión completa -->
  <div id="viewPostModal" class="foro-modal">
    <div class="foro-modal-backdrop" onclick="closeViewPost()"></div>
    <div class="foro-modal-box foro-modal-box--large">
      <div id="viewPostContent"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    let currentSession = null;
    let currentCategory = 'all';

    const CAT_LABELS = {
      casos: '⚕️ Casos clínicos',
      manejo: '🧤 Manejo & captura',
      identificacion: '🔍 Identificación',
      legal: '⚖️ Legal & UMAs',
      empleo: '💼 Empleo & oportunidades',
      consulta: '❓ Consulta general'
    };

    (async () => {
      currentSession = await ZOORIGEN_CLUB.requireAuth();
      if (!currentSession) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('foro', currentSession);

      // Solo VIP activos pueden participar
      if (currentSession.planStatus !== 'active') {
        document.getElementById('foroList').innerHTML = `
          <div class="foro-empty">
            <div style="font-size:3rem;">🔒</div>
            <h3 style="color:#fff;margin-top:14px;">El Foro VIP es exclusivo para miembros activos</h3>
            <p style="color:var(--zoo-text-muted);margin:10px 0 22px;">Conecta con colegas, comparte casos y resuelve dudas con profesionales de toda la república.</p>
            <a href="club-suscripcion.html" class="btn-club" style="display:inline-block;width:auto;padding:14px 32px;text-decoration:none;">Activar membresía</a>
          </div>`;
        document.getElementById('newPostBtn').style.display = 'none';
        return;
      }

      // Listeners
      document.querySelectorAll('.foro-cat').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.foro-cat').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentCategory = btn.dataset.cat;
          loadPosts();
        });
      });

      document.getElementById('newPostBtn').addEventListener('click', () => {
        document.getElementById('newPostModal').classList.add('is-open');
        document.body.style.overflow = 'hidden';
      });

      document.getElementById('postContent').addEventListener('input', (e) => {
        document.getElementById('charCount').textContent = `${e.target.value.length} / 2000 caracteres`;
      });

      document.getElementById('submitPost').addEventListener('click', submitNewPost);

      await loadPosts();
    })();

    async function loadPosts() {
      const list = document.getElementById('foroList');
      list.innerHTML = '<div class="foro-loading">Cargando discusiones...</div>';

      try {
        let q = db.collection('foroPosts').orderBy('createdAt', 'desc').limit(50);
        const snap = await q.get();
        const posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const filtered = currentCategory === 'all' ? posts : posts.filter(p => p.category === currentCategory);

        document.getElementById('totalPosts').textContent = posts.length;

        // Contar miembros únicos
        const uniqueAuthors = new Set(posts.map(p => p.authorUid));
        document.getElementById('totalMembers').textContent = uniqueAuthors.size;

        if (filtered.length === 0) {
          list.innerHTML = `
            <div class="foro-empty">
              <div style="font-size:3rem;">💭</div>
              <h3 style="color:#fff;margin-top:14px;">Sé el primero en iniciar una conversación</h3>
              <p style="color:var(--zoo-text-muted);margin:10px 0 0;">${currentCategory === 'all' ? 'Comparte un caso, pregunta o experiencia con la comunidad' : 'No hay discusiones en esta categoría aún'}</p>
            </div>`;
          return;
        }

        list.innerHTML = filtered.map(p => `
          <div class="foro-post" onclick="viewPost('${p.id}')">
            <div class="foro-post__avatar">${(p.authorName || 'U').charAt(0).toUpperCase()}</div>
            <div class="foro-post__body">
              <div class="foro-post__meta">
                <span class="foro-post__cat">${CAT_LABELS[p.category] || p.category}</span>
                <span class="foro-post__time">${ZOORIGEN_CLUB.timeAgo(p.createdAt)}</span>
              </div>
              <h3 class="foro-post__title">${escapeHtml(p.title)}</h3>
              <p class="foro-post__excerpt">${escapeHtml((p.content || '').substring(0, 160))}${(p.content || '').length > 160 ? '...' : ''}</p>
              <div class="foro-post__footer">
                <span class="foro-post__author">👤 ${escapeHtml(p.authorName || 'Colega')}</span>
                <span class="foro-post__replies">💬 ${p.repliesCount || 0} respuesta${p.repliesCount !== 1 ? 's' : ''}</span>
                <span class="foro-post__views">👁️ ${p.views || 0}</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        list.innerHTML = `<div class="foro-empty"><p>Error cargando el foro. Intenta recargar la página.</p></div>`;
      }
    }

    async function submitNewPost() {
      const titleEl = document.getElementById('postTitle');
      const categoryEl = document.getElementById('postCategory');
      const contentEl = document.getElementById('postContent');
      const errEl = document.getElementById('postError');
      const submitBtn = document.getElementById('submitPost');
      errEl.classList.remove('show');

      const title = titleEl.value.trim();
      const content = contentEl.value.trim();

      if (title.length < 10) { errEl.textContent = 'El título debe tener al menos 10 caracteres'; errEl.classList.add('show'); return; }
      if (content.length < 30) { errEl.textContent = 'El contenido debe tener al menos 30 caracteres'; errEl.classList.add('show'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Publicando...';

      try {
        await db.collection('foroPosts').add({
          title,
          content,
          category: categoryEl.value,
          authorUid: currentSession.uid,
          authorName: currentSession.name || 'Colega',
          authorEmail: currentSession.email,
          createdAt: new Date().toISOString(),
          repliesCount: 0,
          views: 0,
          lastReplyAt: new Date().toISOString()
        });

        // Otorgar logro si es primera discusión
        ZOORIGEN_CLUB.awardAchievement(currentSession.uid, 'first_post');

        closeNewPost();
        await loadPosts();
      } catch (err) {
        console.error(err);
        errEl.textContent = 'Error al publicar. Intenta de nuevo.';
        errEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publicar discusión';
      }
    }

    function closeNewPost() {
      document.getElementById('newPostModal').classList.remove('is-open');
      document.body.style.overflow = '';
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      document.getElementById('charCount').textContent = '0 / 2000 caracteres';
      document.getElementById('postError').classList.remove('show');
    }

    async function viewPost(postId) {
      const modal = document.getElementById('viewPostModal');
      const content = document.getElementById('viewPostContent');
      content.innerHTML = '<div class="foro-loading" style="padding:40px;text-align:center;">Cargando...</div>';
      modal.classList.add('is-open');
      document.body.style.overflow = 'hidden';

      try {
        const doc = await db.collection('foroPosts').doc(postId).get();
        if (!doc.exists) { content.innerHTML = '<p style="padding:40px;text-align:center;color:var(--zoo-text-muted);">Discusión no encontrada</p>'; return; }

        const post = { id: doc.id, ...doc.data() };

        // Incrementar vistas (best effort)
        db.collection('foroPosts').doc(postId).update({ views: (post.views || 0) + 1 }).catch(() => {});

        // Cargar respuestas
        const repliesSnap = await db.collection('foroPosts').doc(postId).collection('replies').orderBy('createdAt', 'asc').get();
        const replies = repliesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        content.innerHTML = `
          <div class="foro-modal-header">
            <div>
              <span class="foro-post__cat" style="margin-bottom:6px;display:inline-block;">${CAT_LABELS[post.category]}</span>
              <h2 style="color:#fff;font-size:1.3rem;margin:0;">${escapeHtml(post.title)}</h2>
            </div>
            <button class="foro-modal-close" onclick="closeViewPost()">×</button>
          </div>
          <div class="foro-modal-body">
            <div class="foro-post-full">
              <div class="foro-post-full__author">
                <div class="foro-post__avatar" style="width:44px;height:44px;font-size:1rem;">${(post.authorName || 'U').charAt(0).toUpperCase()}</div>
                <div>
                  <div style="color:#fff;font-weight:600;">${escapeHtml(post.authorName)}</div>
                  <div style="color:var(--zoo-text-dim);font-size:.8rem;">${ZOORIGEN_CLUB.timeAgo(post.createdAt)} · 👁️ ${post.views || 0} vistas</div>
                </div>
              </div>
              <div class="foro-post-full__content">${escapeHtml(post.content).replace(/\n/g, '<br>')}</div>
            </div>

            <div class="foro-replies-section">
              <h3 style="color:var(--zoo-amber);font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;margin:20px 0 14px;">💬 ${replies.length} Respuesta${replies.length !== 1 ? 's' : ''}</h3>

              ${replies.length === 0 ? '<p style="color:var(--zoo-text-dim);text-align:center;padding:20px;">Sé el primero en responder</p>' : ''}

              ${replies.map(r => `
                <div class="foro-reply">
                  <div class="foro-post__avatar" style="width:36px;height:36px;font-size:.9rem;flex-shrink:0;">${(r.authorName || 'U').charAt(0).toUpperCase()}</div>
                  <div class="foro-reply__body">
                    <div class="foro-reply__meta">
                      <strong>${escapeHtml(r.authorName || 'Colega')}</strong>
                      <span>${ZOORIGEN_CLUB.timeAgo(r.createdAt)}</span>
                    </div>
                    <div class="foro-reply__content">${escapeHtml(r.content).replace(/\n/g, '<br>')}</div>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="foro-reply-form">
              <textarea id="replyContent" placeholder="Comparte tu experiencia o respuesta..." rows="4" maxlength="1500"></textarea>
              <button class="btn-club" onclick="submitReply('${postId}')" style="width:auto;padding:11px 22px;margin-top:10px;">Publicar respuesta</button>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        content.innerHTML = '<p style="padding:40px;text-align:center;color:var(--zoo-orange);">Error al cargar la discusión</p>';
      }
    }

    window.closeViewPost = () => {
      document.getElementById('viewPostModal').classList.remove('is-open');
      document.body.style.overflow = '';
    };

    window.submitReply = async (postId) => {
      const content = document.getElementById('replyContent').value.trim();
      if (content.length < 5) { alert('La respuesta debe tener al menos 5 caracteres'); return; }

      try {
        await db.collection('foroPosts').doc(postId).collection('replies').add({
          content,
          authorUid: currentSession.uid,
          authorName: currentSession.name || 'Colega',
          createdAt: new Date().toISOString()
        });

        // Actualizar contador de respuestas
        const postRef = db.collection('foroPosts').doc(postId);
        const postDoc = await postRef.get();
        await postRef.update({
          repliesCount: (postDoc.data().repliesCount || 0) + 1,
          lastReplyAt: new Date().toISOString()
        });

        ZOORIGEN_CLUB.awardAchievement(currentSession.uid, 'first_reply');
        await viewPost(postId);
      } catch (err) {
        console.error(err);
        alert('Error al publicar respuesta');
      }
    };

    window.viewPost = viewPost;
    window.closeNewPost = closeNewPost;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
