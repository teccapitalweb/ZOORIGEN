<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-apple-touch.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis logros · Club VIP Zoorigen</title>
  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zoorigen">
  <meta name="theme-color" content="#1F5F3A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css?v=20260820">
  <link rel="stylesheet" href="../assets/css/club-mobile.css?v=20260820">
  <link rel="stylesheet" href="../assets/css/club-theme.css?v=20260820">
  <link rel="stylesheet" href="../assets/css/club-shell.css?v=20261024-panel">
  <link rel="stylesheet" href="../assets/css/club-cursos.css?v=20261020">
  <link rel="stylesheet" href="../assets/css/club-logros.css?v=20261022">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="club-main__header">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="club-main__greeting">
          <h1>Mis logros</h1>
          <p class="date">Sube de nivel, gana insignias y abre cursos antes de tiempo con tus premios</p>
        </div>
      </div>

      <div id="logrosContent" aria-live="polite"></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js?v=20261024-panel"></script>
  <script src="../assets/js/club-shell.js?v=20261024-panel"></script>
  <script src="../assets/js/admin-iconos.js?v=20261020"></script>
  <script src="../assets/js/club-acceso.js?v=20261020"></script>
  <script src="../assets/js/club-cursos-ui.js?v=20261020"></script>
  <script src="../assets/js/club-premios.js?v=20261022"></script>
  <script src="../assets/js/club-logros-ui.js?v=20261022"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      window.__zooSession = session;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('logros', session);
      if (ZOORIGEN_CLUB.initTheme) ZOORIGEN_CLUB.initTheme();
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();
      if (ZOORIGEN_CLUB.initNotifications) ZOORIGEN_CLUB.initNotifications(session);

      const UI = window.ZOO_LOGROS_UI;
      const cont = document.getElementById('logrosContent');
      let ocupado = false;

      // Nombres de los cursos ya abiertos con premio (solo para mostrar "Usado: <curso>")
      async function titulosDeCursos(ids) {
        const salida = {};
        await Promise.all(ids.map(async id => {
          try { const doc = await db.collection('cursos').doc(id).get(); if (doc.exists && doc.data().title) salida[id] = doc.data().title; } catch (e) { /* se muestra "un curso" */ }
        }));
        return salida;
      }
      // Cuántos invitados faltan para cada premio de referidos (dato opcional del servidor)
      async function faltanInvitados(datos) {
        const pendientes = datos.premios.filter(p => /^referidos-/.test(p.clave) && !p.ganado && !p.usado);
        if (!pendientes.length) return null;
        try {
          const r = await ZOO_PREMIOS.pedir('/api/referidos/estado', 'GET', null, 6000);
          if (!r.ok || !Array.isArray(r.datos.premios)) return null;
          const m = {};
          r.datos.premios.forEach(p => { if (p && typeof p.clave === 'string' && Number.isFinite(Number(p.faltan))) m[p.clave] = Number(p.faltan); });
          return m;
        } catch (e) { return null; }
      }

      async function cargar() {
        if (ocupado) return;
        ocupado = true;
        cont.innerHTML = UI.cargandoHTML();
        try {
          const r = await ZOO_PREMIOS.consultar(9000);
          if (!r.ok) { cont.innerHTML = UI.errorHTML(r.error); return; }
          const d = r.datos;
          const ctx = { titulosCursos: {}, faltanInvitados: null };
          if (d.membresia) {
            const usados = d.premios.filter(p => p.usado).map(p => p.usado.cursoId);
            const [t, f] = await Promise.all([usados.length ? titulosDeCursos(usados) : {}, faltanInvitados(d)]);
            ctx.titulosCursos = t; ctx.faltanInvitados = f;
          }
          cont.innerHTML = '<div class="lg-wrap">' + UI.paginaHTML(d, ctx) + '</div>';
        } catch (e) {
          console.error('[logros]', e);
          cont.innerHTML = UI.errorHTML();
        } finally { ocupado = false; }
      }

      cont.addEventListener('click', async ev => {
        const b = ev.target.closest('[data-accion]');
        if (!b) return;
        if (b.dataset.accion === 'reintentar') { cargar(); return; }
        if (b.dataset.accion === 'elegir') {
          b.disabled = true;
          const abrio = await ZOO_PREMIOS.canjear();
          b.disabled = false;
          if (abrio) cargar();
        }
      });

      cargar();
    })();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
</html>
