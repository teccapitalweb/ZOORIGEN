<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-apple-touch.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis certificados · Club VIP Zoorigen</title>
  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zoorigen">
  <meta name="theme-color" content="#1F5F3A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css?v=20261108-paleta">
  <link rel="stylesheet" href="../assets/css/club-mobile.css?v=20261108-paleta">
  <link rel="stylesheet" href="../assets/css/club-theme.css?v=20261108-paleta">
  <link rel="stylesheet" href="../assets/css/club-shell.css?v=20261108-paleta">
  <link rel="stylesheet" href="../assets/css/club-seccion.css?v=20261109-burbujas">
  <style>
    /* Estado del certificado: verificado por el servidor o en validación (anterior a la validación automática) */
    .cert-estado { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .02em; margin-bottom: 8px; border: 1px solid transparent; }
    .cert-estado--verificado { color: var(--zoo-ok-txt); background: var(--zoo-ok-tinte); border-color: var(--zoo-ok-borde); }
    .cert-estado--en-validacion { color: #E8A317; background: rgba(232,163,23,.12); border-color: rgba(232,163,23,.4); }
    /* El título usaba blanco fijo y desaparecía en el tema claro */
    .cert-item-card__body h3 { color: var(--zoo-text); }
    .cert-estado-nota { color: var(--zoo-text-muted); font-size: .8rem; line-height: 1.45; margin: 0 0 12px; }
    /* El título de "sin certificados" era blanco fijo y desaparecía en el tema claro */
    .certs-empty h2 { color: var(--zoo-text); }
    /* Tema claro: verde y ámbar claros sobre blanco no llegaban a contraste legible */
    [data-theme="light"] .cert-estado--verificado { color: #1F6A3F; }
    [data-theme="light"] .cert-estado--en-validacion,
    [data-theme="light"] .cert-item-card__label { color: #7A5200; }
    .certs-empty__acc { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
  <link rel="stylesheet" href="../assets/css/club-responsivo.css?v=20261108-paleta">
</head>
<body data-zoo="certificados">
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menú"><svg class="zi" aria-hidden="true"><use href="#zi-menu"/></svg></button>
      <div id="zsSeccion"></div>

      <div id="certsContent">Cargando...</div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/herramientas-iconos.js?v=20261104"></script>
  <script src="../assets/js/club-config.js?v=20261104"></script>
  <script src="../assets/js/club-seccion.js?v=20261109-burbujas"></script>
  <script src="../assets/js/club-cola.js?v=20261104"></script>
  <script>ZOO_SECCION.montar('#zsSeccion', {"id":"zsSeccionCertificados","seccion":"certificados","icono":"graduation-cap","eyebrow":"Mis certificados","titulo":"Tus logros,","acento":"con folio verificable.","sub":"Completa cursos para ganar certificados descargables que cualquiera puede verificar.","cifras":[{"clave":"certificados","valor":"—","rotulo":"certificados"},{"clave":"verificados","valor":"—","rotulo":"verificados"}]});</script>
  <script src="../assets/js/club.js?v=20261108-paleta"></script>
  <script src="../assets/js/club-progreso.js?v=20261104"></script>
  <script src="../assets/js/club-certificado.js?v=20261104"></script>
  <script src="../assets/js/club-shell.js?v=20261108-paleta"></script>
  <script src="../assets/js/club-avisos.js?v=20261104"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('certificados', session);
      if (ZOORIGEN_CLUB.initTheme) ZOORIGEN_CLUB.initTheme();
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();
      if (ZOORIGEN_CLUB.initNotifications) ZOORIGEN_CLUB.initNotifications(session);


      const content = document.getElementById('certsContent');

      try {
        // Los certificados los emite el servidor al terminar cada curso; aquí solo se leen los del propio miembro.
        // Al pedir el avance, el servidor valida y firma solo los certificados anteriores de esta persona (conservan su folio).
        try { await ZOORIGEN_CLUB.getCourseProgress(session.uid); } catch (e) { /* si falla, se muestra lo que haya */ }
        const snap = await db.collection('certificados').where('memberUid', '==', session.uid).get();
        // Uno por curso (gana el verificado), del más reciente al más antiguo
        const certs = ZOO_CERT.propiosParaMostrar(snap.docs.map(d => Object.assign({ folio: d.id }, d.data())));
        const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

        if (window.ZOO_SECCION) ZOO_SECCION.cifras({ certificados: certs.length, verificados: certs.filter(c => ZOO_CERT.estadoVerificacion(c) === 'verificado').length });
        if (certs.length === 0) {
          // Sin membresía no hay certificados que mostrar: el mensaje lo explica y ofrece ver los cursos o los planes.
          const miembro = ZOORIGEN_CLUB.hasActiveMembership(session);
          content.innerHTML = `
            <div class="certs-empty">
              <div style="font-size:4rem;margin-bottom:16px;"><svg class="zi" aria-hidden="true"><use href="#zi-graduation-cap"/></svg></div>
              <h2>Aún no tienes certificados</h2>
              <p style="color:var(--zoo-text-muted);margin:10px 0 24px;max-width:460px;margin-left:auto;margin-right:auto;">
                ${miembro
                  ? 'Completa tus cursos y obtén certificados descargables con folio único y verificación QR. Perfectos para tu CV o LinkedIn.'
                  : 'Los certificados se emiten al terminar un curso completo con tu membresía activa, con folio único y verificación QR. Mientras tanto puedes explorar los cursos y empezar tu prueba gratuita.'}
              </p>
              <div class="certs-empty__acc">
                <a href="club-biblioteca.html" class="btn-club" style="display:inline-block;width:auto;padding:14px 32px;text-decoration:none;">${miembro ? 'Ir a la biblioteca' : 'Ver los cursos'}</a>
                ${miembro ? '' : '<a href="club-suscripcion.html" class="btn-club-outline" style="display:inline-block;width:auto;padding:14px 32px;margin:0;text-decoration:none;">Ver planes de membresía</a>'}
              </div>
            </div>`;
          return;
        }

        content.innerHTML = `
          <div class="certs-stats">
            <div class="certs-stat">
              <div class="certs-stat__val">${certs.length}</div>
              <div class="certs-stat__lbl">Certificados obtenidos</div>
            </div>
          </div>
          <div class="certs-grid">
            ${certs.map(c => {
              const estado = ZOO_CERT.estadoVerificacion(c);
              const fechaStr = ZOO_CERT.fechaCorta(c.issuedAt) || '—';
              const folio = esc(c.folio);
              const folioUrl = encodeURIComponent(c.folio);
              return `
                <div class="cert-item-card" data-estado="${estado}">
                  <div class="cert-item-card__icon"><svg class="zi" aria-hidden="true"><use href="#zi-trophy"/></svg></div>
                  <div class="cert-item-card__body">
                    <div class="cert-item-card__label">CERTIFICADO OFICIAL</div>
                    <span class="cert-estado cert-estado--${estado}"><svg class="zi" aria-hidden="true"><use href="#zi-${estado === 'verificado' ? 'shield-check' : 'hourglass'}"/></svg> ${esc(ZOO_CERT.ETIQUETAS_VERIFICACION[estado])}</span>
                    <h3>${esc(c.courseTitle || 'Curso Zoorigen')}</h3>
                    <div class="cert-item-card__meta">
                      <span><svg class="zi" aria-hidden="true"><use href="#zi-folder"/></svg> ${esc(c.courseArea || 'General')}</span>
                      <span><svg class="zi" aria-hidden="true"><use href="#zi-calendar"/></svg> ${esc(fechaStr)}</span>
                      <span><svg class="zi" aria-hidden="true"><use href="#zi-hash"/></svg> ${folio}</span>
                    </div>
                    ${estado === 'verificado' ? '' : `<p class="cert-estado-nota">${esc(ZOO_CERT.AYUDA_VERIFICACION[estado])}</p>`}
                    <div class="cert-item-card__actions">
                      <a href="ver-certificado.html?folio=${folioUrl}" target="_blank" rel="noopener" class="btn-club" style="width:auto;padding:10px 20px;text-decoration:none;margin:0;"><svg class="zi" aria-hidden="true"><use href="#zi-download"/></svg> Ver / Descargar</a>
                      <a href="verificar.html?folio=${folioUrl}" target="_blank" rel="noopener" class="btn-club-outline" style="width:auto;padding:10px 20px;text-decoration:none;margin:0;"><svg class="zi" aria-hidden="true"><use href="#zi-link"/></svg> Link público</a>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>`;
      } catch (err) {
        console.error(err);
        content.innerHTML = '<div class="certs-empty"><h2>Error cargando certificados</h2><p>Intenta recargar la página.</p></div>';
      }
    })();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
</html>
