    /* ═══════════════ NOTIFICACIONES ═══════════════ */
    .notif-icon {
      position: relative;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }
    .notif-icon:hover {
      background: rgba(232,163,23,0.15);
      border-color: rgba(232,163,23,0.4);
      transform: scale(1.05);
    }
    .notif-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #D55A28;
      color: #fff;
      font-size: .68rem;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(213,90,40,0.5);
      animation: notifPulse 2s ease-in-out infinite;
    }
    @keyframes notifPulse {
      0%, 100% { box-shadow: 0 2px 6px rgba(213,90,40,0.5); }
      50% { box-shadow: 0 2px 14px rgba(213,90,40,0.9); }
    }

    .notif-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 380px;
      max-width: calc(100vw - 40px);
      max-height: 70vh;
      background: #131816;
      border: 1px solid rgba(232,163,23,0.25);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      z-index: 9999;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(-10px);
      transition: all .2s;
    }
    .notif-panel.is-open {
      opacity: 1;
      transform: translateY(0);
    }
    .notif-panel__header {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .notif-panel__header h3 {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
    }
    .notif-panel__close {
      background: transparent;
      border: 0;
      color: #a0a8a4;
      cursor: pointer;
      font-size: 1.2rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    .notif-panel__close:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .notif-panel__actions {
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
    }
    .notif-mark-all {
      background: transparent;
      border: 0;
      color: #E8A317;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .notif-mark-all:hover { text-decoration: underline; }
    .notif-panel__list {
      overflow-y: auto;
      flex: 1;
    }
    .notif-item {
      display: flex;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: background .15s;
    }
    .notif-item:hover { background: rgba(255,255,255,0.03); }
    .notif-item.is-unread { background: rgba(232,163,23,0.06); }
    .notif-item.is-unread:hover { background: rgba(232,163,23,0.1); }
    .notif-item__icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(232,163,23,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .notif-item.is-unread .notif-item__icon {
      background: linear-gradient(135deg, rgba(232,163,23,0.25), rgba(213,90,40,0.25));
    }
    .notif-item__body { flex: 1; min-width: 0; }
    .notif-item__title {
      color: #fff;
      font-size: .92rem;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .notif-item__msg {
      color: #a0a8a4;
      font-size: .84rem;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .notif-item__time {
      color: #6b7370;
      font-size: .74rem;
      margin-top: 4px;
    }
    .notif-item__dot {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      background: #E8A317;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(232,163,23,0.6);
    }
    .notif-empty {
      padding: 40px 24px;
      text-align: center;
    }
    .notif-empty__icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }
    .notif-empty__title {
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .notif-empty__text {
      color: #a0a8a4;
      font-size: .84rem;
      line-height: 1.4;
    }

    .mobile-menu-btn {
      display: none;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);

    .club-sidebar-overlay.is-visible { opacity: 1; }

    @media (max-width: 900px) {
      .mobile-menu-btn { display: flex; }
      .club-sidebar__close { display: flex; }
      .club-sidebar-overlay { display: block; }

      .club-sidebar {

        left: -100% !important;
        top: 0 !important;
        height: 100vh !important;
        width: 85% !important;
        max-width: 320px !important;

        overflow-y: auto !important;

  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;

      // Inicializar tema claro/oscuro (actualiza ícono del botón)
      ZOORIGEN_CLUB.initTheme();

      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('inicio', session);

      // Inicializar menú móvil (hamburguesa + sidebar responsive)
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();

      // Secuencia de bienvenida (miembro nuevo) o prueba gratuita (miembro que vuelve). Nunca a admins.
      // No espera ni bloquea la página: si algo falla, el panel sigue igual.
      if (window.ZOO_ONBOARDING) { try { ZOO_ONBOARDING.iniciar({ session }); } catch (e) { console.warn('onboarding:', e); } }

      // Mostrar guía de bienvenida la primera vez que entra (solo si es VIP activo)
      if (ZOORIGEN_CLUB.hasActiveMembership(session)) {
        setTimeout(() => ZOORIGEN_CLUB.showOnboarding(session), 1500);
      }

      const firstName = session.name.split(' ')[0];
      document.getElementById('inicioSaludo').innerHTML = ZOO_INICIO.saludoHTML(firstName, new Date());

      // Solo mostrar banner si hay problema con el plan
      const pb = document.getElementById('pendingBanner');
      if (session.planStatus === 'cancelled_active') {
        pb.innerHTML = `<div class="status-banner cancelled"><span><svg class="zi" aria-hidden="true"><use href="#zi-hourglass"/></svg></span>Cancelaste la renovación; conservas acceso hasta ${ZOORIGEN_CLUB.formatShort(session.planVence)}. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Reanudar →</a></div>`;
      } else if (session.planStatus === 'expired' || session.planStatus === 'past_due') {
        pb.innerHTML = `<div class="status-banner cancelled"><span><svg class="zi" aria-hidden="true"><use href="#zi-lock"/></svg></span>${session.planStatus === 'past_due' ? 'No se confirmó el último pago.' : 'Tu membresía venció.'} Puedes seguir con la primera clase gratis. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Ver planes →</a></div>`;
      }
      // Para pending_payment, el banner dorado del paywall se muestra automáticamente

      // Modal de bienvenida solo primera vez
      if (ZOORIGEN_CLUB.hasActiveMembership(session)) {
        const welcomeKey = 'zoo_welcome_shown_' + session.uid;
        if (!localStorage.getItem(welcomeKey)) {
          setTimeout(() => {
            ZOORIGEN_CLUB.showWelcomeModal(session);
            localStorage.setItem(welcomeKey, 'yes');
          }, 600);
        }
      }

      // ═══════════════ BIENVENIDA USUARIO NUEVO SIN PAGAR ═══════════════
      // Viene con ?welcome=1 tras registrarse — mostrar mensaje motivador de exploración
      const urlParams = new URLSearchParams(window.location.search);

      // ═══════════════ POPUP DE WEBINAR ═══════════════

      // Aviso discreto "Confirma tu correo" (solo cuentas de correo y contraseña sin confirmar; Google no lo muestra).

      (function avisoConfirmarCorreo() {
        const u = auth.currentUser;
        if (!ZOORIGEN_CLUB.necesitaConfirmarCorreo(u)) return;
        const clave = 'zoo_aviso_correo_' + u.uid;
        try { const t = Number(localStorage.getItem(clave) || 0); if (t && Date.now() - t < 3 * 86400000) return; } catch (e) { /* sin almacenamiento */ }
        const I = window.ZOO_ICONOS_COM;
        const cont = document.getElementById('avisoCorreo');
        cont.innerHTML = `
          <div class="zc-aviso-correo" role="status">
            ${I.svg('mail', { size: 22 })}
            <div class="zc-aviso-correo__texto"><strong>Confirma tu correo</strong><span>Te enviamos un mensaje al crear tu cuenta. Confirmarlo protege tu cuenta; no es necesario para usar el club.</span></div>
            <div class="zc-aviso-correo__acciones">
              <button type="button" class="zc-btn zc-btn--suave zc-btn--chico" data-reenviar>Reenviar correo</button>
              <button type="button" class="zc-btn zc-btn--suave zc-btn--chico" data-listo>Ya lo confirmé</button>
              <button type="button" class="zc-aviso-correo__cerrar" data-cerrar aria-label="Descartar aviso">${I.svg('x', { size: 16 })}</button>
            </div>
            <p class="zc-aviso-correo__estado" data-estado aria-live="polite"></p>
          </div>`;
        const estado = cont.querySelector('[data-estado]');
        const btnReenviar = cont.querySelector('[data-reenviar]');
        const decir = (t) => { estado.textContent = t; };
        let espera = null;
        btnReenviar.addEventListener('click', async () => {
          btnReenviar.disabled = true;
          try {
            const envio = await ZOORIGEN_CLUB.enviarCorreoVerificacion(u);
            if (!envio.ok) throw Object.assign(new Error('envio'), { code: envio.motivo === 'demasiados' ? 'auth/too-many-requests' : 'envio' });
            decir('Listo, te enviamos otro correo. Revisa tu bandeja de entrada y la carpeta de spam.');
            let seg = 60;
            espera = setInterval(() => {
              seg--;
              if (seg <= 0) { clearInterval(espera); btnReenviar.disabled = false; btnReenviar.textContent = 'Reenviar correo'; }
              else btnReenviar.textContent = 'Reenviar en ' + seg + ' s';
            }, 1000);
          } catch (err) {
            btnReenviar.disabled = false;
            decir(err && err.code === 'auth/too-many-requests' ? 'Ya pediste varios correos. Espera unos minutos antes de intentar de nuevo.' : 'No pudimos enviar el correo ahora. Inténtalo más tarde.');
          }
        });
        cont.querySelector('[data-listo]').addEventListener('click', async () => {
          try { await u.reload(); } catch (e) { /* sin red */ }
          if (u.emailVerified) { cont.innerHTML = ''; }
          else decir('Todavía no aparece como confirmado. Abre el enlace del correo y vuelve a pulsar este botón.');
        });
        cont.querySelector('[data-cerrar]').addEventListener('click', () => {
          try { localStorage.setItem(clave, String(Date.now())); } catch (e) { /* nada */ }
          cont.innerHTML = '';
        });

      // El nivel y los puntos los calcula el servidor (GET /api/premios). No bloquea el resto del panel.
      // Solo se muestran si es VIP activo; si el servidor falla, la tarjeta lo dice y ofrece Reintentar.
      if (ZOORIGEN_CLUB.hasActiveMembership(session)) {
        const nivelCont = document.getElementById('levelCard');
        const cargarNivel = async (forzar) => {
          try {
            const datos = await ZOORIGEN_CLUB.fetchPremios(forzar);
            if (!ZOORIGEN_CLUB.resumenNivel(datos)) throw new Error('respuesta incompleta');
            nivelCont.innerHTML = ZOORIGEN_CLUB.renderLevelCard(datos);
            window.__zooInicioPremios = datos;
            if (window.__zooInicioActividad) window.__zooInicioActividad();
          } catch (err) {
            console.warn('[Dashboard] nivel:', err);
            nivelCont.innerHTML = ZOORIGEN_CLUB.renderLevelCard(null);
          }
        };
        nivelCont.addEventListener('click', (ev) => { if (ev.target.closest('[data-nivel-reintentar]')) cargarNivel(true); });

      }

      // Tarjeta principal: "Continúa tu curso" / "Espera tu próximo curso" + "Tu siguiente meta" + accesos con números.
      const resume = document.getElementById('resumeCard');
      const pintarTarjetaCursos = async () => {
        const base = { cursos };
        if (!ZOORIGEN_CLUB.hasActiveMembership(session)) {
          const sin = ZOO_INICIO.elegirHero({ cursos, dias: 0, progreso: {} });
          resume.innerHTML = ZOO_INICIO.widgetHTML(cursos.length ? { tipo: 'continuar', curso: cursos[0], hechas: 0, total: ZOO_INICIO.totalClases(cursos[0]), resumen: sin.resumen } : sin, { ahora: new Date() });
          return;
        }
        try {
          const [progreso, premios, prueba, mats] = await Promise.all([
            ZOORIGEN_CLUB.getCourseProgress(session.uid).catch(() => ({})),
            ZOORIGEN_CLUB.fetchPremios(false).catch(() => null),
            ZOORIGEN_CLUB.apiFetch('/api/prueba-gratuita').catch(() => null),
            ZOORIGEN_CLUB.apiFetch('/api/materiales').catch(() => null)
          ]);
          const est = ZOO_ACCESO.estadoPrueba(prueba);
          let hero;
          if (est.aplica) {
            // Con prueba gratuita elegida la ruta de desbloqueo es otra: aquí solo se muestra el curso elegido o se manda a Cursos.
            const elegido = cursos.find(c => c.id === est.elegida);
            const av = elegido ? ZOO_INICIO.avanceDe(progreso, elegido.id) : null;
            const resumen = ZOO_INICIO.elegirHero({ cursos, dias: 0, progreso }).resumen;
            hero = elegido && !av.terminado ? { tipo: 'continuar', curso: elegido, hechas: av.hechas, total: ZOO_INICIO.totalClases(elegido), resumen } : { tipo: 'terminado', resumen };
          } else {
            hero = ZOO_INICIO.elegirHero({ cursos, dias: ZOO_ACCESO.diasComoMiembro(session), adelantados: ZOO_ACCESO.adelantadosDeRespuesta(premios), progreso, desdeMs: ZOO_ACCESO.desdeMiembroMs(session) });
          }
          const lista = mats && Array.isArray(mats.materiales) ? mats.materiales : null;
          window.__zooInicioRetos = mats && Number.isFinite(mats.superados) ? mats.superados : 0;
          if (window.__zooInicioActividad) window.__zooInicioActividad();
          resume.innerHTML = ZOO_INICIO.widgetHTML(hero, { ahora: new Date(), pdfsAbiertos: lista ? lista.filter(x => x.desbloqueado).length : 0, pdfsTotal: lista ? lista.length : undefined });
        } catch (e) {
          console.warn('[Dashboard] tarjeta de cursos:', e);
          const sin = ZOO_INICIO.elegirHero({ cursos, dias: 0, progreso: {} });
          resume.innerHTML = ZOO_INICIO.widgetHTML(cursos.length ? { tipo: 'continuar', curso: cursos[0], hechas: 0, total: ZOO_INICIO.totalClases(cursos[0]), resumen: sin.resumen } : sin, { ahora: new Date() });
        }
      };
      pintarTarjetaCursos();

      // Columna derecha: clases en vivo, comunidad, descuento, tu actividad y tu presencia
      document.getElementById('asideVivo').innerHTML = ZOO_INICIO.vivoHTML(proximaSesion);
      if (proximaSesion) ZOORIGEN_CLUB.startCountdown('countdown', proximaSesion.date);
      document.getElementById('asideComunidad').innerHTML = ZOO_INICIO.comunidadHTML();
      // El descuento del 20% es un beneficio de miembros: quien no tiene membresía vigente no ve esta tarjeta.
      document.getElementById('asideDescuento').innerHTML = ZOORIGEN_CLUB.hasActiveMembership(session)
        ? ZOO_INICIO.descuentoHTML('https://wa.me/5212361113237?text=Hola%2C%20quiero%20aplicar%20mi%2020%25%20VIP')
        : '';
      const pintarActividad = async () => {
        let progreso = {};
        try { progreso = await ZOORIGEN_CLUB.getCourseProgress(session.uid); } catch (e) { progreso = {}; }
        const terminados = cursos.filter(c => progreso[c.id] && progreso[c.id].isCompleted === true).length;
        const prem = window.__zooInicioPremios || null;
        const logros = prem && Array.isArray(prem.logros) ? prem.logros : [];
        document.getElementById('asideActividad').innerHTML = ZOO_INICIO.actividadHTML({
          cursosHechos: terminados, cursosTotal: cursos.length, certificados: terminados,
          retos: window.__zooInicioRetos || 0, logros: logros.filter(l => l && l.ganado).length, logrosTotal: logros.length
        });
      };
      window.__zooInicioActividad = pintarActividad;
      pintarActividad();
      (async () => {
        let tiene = false;
        try { const d = await ZOORIGEN_CLUB.apiFetch('/api/directorio'); tiene = !!(d && d.mia); } catch (e) { tiene = false; }
        document.getElementById('asidePresencia').innerHTML = ZOO_INICIO.presenciaHTML(tiene);
      })();

      // Noticias del sector (las trae el servidor; si falla, el inicio sigue funcionando)
      (async () => {
        const nl = document.getElementById('newsList');
        try {
          const r = await ZOORIGEN_CLUB.apiFetch('/api/noticias?limit=8');
          ZOO_NOTICIAS.pintar(nl, Array.isArray(r && r.noticias) ? r.noticias : [], { max: 8 });
        } catch (err) {
          console.warn('[Dashboard] noticias:', err);
          nl.innerHTML = '<div class="nt-vacio"><strong>No se pudieron cargar las noticias</strong><span>Revisa tu conexión y vuelve a abrir el Inicio en un momento.</span></div>';
        }
      })();

      // ═══════════════ SISTEMA DE REFERIDOS ═══════════════
      try {
        await cargarReferidos(session);
      } catch (e) { console.error('[Dashboard] Error cargarReferidos:', e); }
    })();

    // ═══════════════ FUNCIONES DE REFERIDOS ═══════════════
    async function cargarReferidos(session) {
      // Código de referido: ZOO- + 6 primeras letras del UID. Es el mismo que usa el servidor.
      const refCode = 'ZOO-' + session.uid.substring(0, 6).toUpperCase();
      document.getElementById('dashRefCode').textContent = refCode;
      window.__zooRefCode = refCode;
      try { await db.collection('miembros').doc(session.uid).set({ refCode }, { merge: true }); } catch (e) { /* no es necesario */ }

      const statsEl = document.getElementById('dashReferStats');
      try {
        // Los invitados los cuenta el servidor (correo confirmado y dispositivo distinto); lo escrito en el navegador ya no cuenta.
        const r = await ZOORIGEN_CLUB.apiFetch('/api/referidos/estado', { headers: { 'X-Device-Id': ZOORIGEN_CLUB.getDeviceId() } });
        const validos = Math.max(0, Number(r && r.validos) || 0);
        const pendientes = Math.max(0, Number(r && r.pendientes) || 0);
        const puntos = Math.max(0, Number(r && r.puntosTotales) || 0);
        const listo = Array.isArray(r && r.premios) && r.premios.some(p => p && p.ganado && !p.usado);
        const META_REFERIDOS = 4;   // un solo premio: 4 invitados válidos
        const usado = Array.isArray(r && r.premios) && r.premios.some(p => p && p.usado);
        const aviso = listo ? 'Tienes un premio listo para canjear'
          : (validos >= META_REFERIDOS || usado) ? 'Ya ganaste tu premio de invitados'
          : 'Te ' + (META_REFERIDOS - validos === 1 ? 'falta 1' : 'faltan ' + (META_REFERIDOS - validos)) + ' para tu premio';
        statsEl.innerHTML =
          '<span><strong>' + validos + '</strong> confirmados</span>' +
          '<span><strong>' + pendientes + '</strong> por confirmar</span>' +
          '<span><strong>' + puntos + '</strong> puntos</span>' +
          '<span style="margin-left:auto;color:#E8A317;font-weight:700;">' + aviso + '</span>';
      } catch (err) {
        console.warn('Error referidos:', err);
        statsEl.innerHTML = '<span>No pudimos cargar tus invitados ahora. <a href="club-referidos.html" style="color:#fff;text-decoration:underline;">Ver el detalle</a></span>';
      }
    }

    function copyReferCode() {
      const code = document.getElementById('dashRefCode').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = event.target;
        const original = btn.textContent;
        btn.textContent = 'Copiado';
        setTimeout(() => { btn.textContent = original; }, 1800);
      });
    }

    function shareReferLink() {
      const code = document.getElementById('dashRefCode').textContent;
      const url = `https://www.zoorigen.com/pages/club-registro.html?ref=${code}`;
      const text = `¡Hola! Te invito al Club VIP Zoorigen, la comunidad científica de fauna más completa de México. Únete con mi código ${code} y obtén todos los beneficios VIP: cursos, webinars en vivo, certificados y más. Regístrate aquí: ${url}`;
      const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
      window.open(waUrl, '_blank');
    }
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
