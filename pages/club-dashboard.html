  <style>
    /* ═══════════════ NOTIFICACIONES ═══════════════ */
    .notif-icon {
      position: relative;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }
    .notif-icon:hover {
      background: rgba(232,163,23,0.15);
      border-color: rgba(232,163,23,0.4);
      transform: scale(1.05);
    }
    .notif-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #D55A28;
      color: #fff;
      font-size: .75rem;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(213,90,40,0.5);
      animation: notifPulse 2s ease-in-out infinite;
    }
    @keyframes notifPulse {
      0%, 100% { box-shadow: 0 2px 6px rgba(213,90,40,0.5); }
      50% { box-shadow: 0 2px 14px rgba(213,90,40,0.9); }
    }

    .notif-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 380px;
      max-width: calc(100vw - 40px);
      max-height: 70vh;
      background: #171B20;
      border: 1px solid rgba(232,163,23,0.25);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      z-index: 9999;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(-10px);
      transition: all .2s;
    }
    .notif-panel.is-open {
      opacity: 1;
      transform: translateY(0);
    }
    .notif-panel__header {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .notif-panel__header h3 {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
    }
    .notif-panel__close {
      background: transparent;
      border: 0;
      color: #a0a8a4;
      cursor: pointer;
      font-size: 1.2rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    .notif-panel__close:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .notif-panel__actions {
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
    }
    .notif-mark-all {
      background: transparent;
      border: 0;
      color: #E8A317;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    .notif-mark-all:hover { text-decoration: underline; }
    .notif-panel__list {
      overflow-y: auto;
      flex: 1;
    }
    .notif-item {
      display: flex;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: background .15s;
    }
    .notif-item:hover { background: rgba(255,255,255,0.03); }
    .notif-item.is-unread { background: rgba(232,163,23,0.06); }
    .notif-item.is-unread:hover { background: rgba(232,163,23,0.1); }
    .notif-item__icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(232,163,23,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .notif-item.is-unread .notif-item__icon {
      background: rgba(232,163,23,0.25);
    }
    .notif-item__body { flex: 1; min-width: 0; }
    .notif-item__title {
      color: #fff;
      font-size: .92rem;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .notif-item__msg {
      color: #a0a8a4;
      font-size: .84rem;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .notif-item__time {
      color: #6b7370;
      font-size: .75rem;
      margin-top: 4px;
    }
    .notif-item__dot {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      background: #E8A317;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(232,163,23,0.6);
    }
    .notif-empty {
      padding: 40px 24px;
      text-align: center;
    }
    .notif-empty__icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }
    .notif-empty__title {
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .notif-empty__text {
      color: #a0a8a4;
      font-size: .84rem;
      line-height: 1.4;
    }

    /* ═══════════════ MOBILE RESPONSIVE ═══════════════ */
    .mobile-menu-btn {
      display: none;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.3rem;
      align-items: center;
      justify-content: center;
    }
    .mobile-menu-btn:hover { background: rgba(232,163,23,0.15); }

    .club-sidebar__close {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255,255,255,0.1);
      border: 0;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      align-items: center;
      justify-content: center;
    }

    .club-sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      z-index: 998;
      opacity: 0;
      transition: opacity .25s;
    }
    .club-sidebar-overlay.is-visible { opacity: 1; }

    @media (max-width: 900px) {
      .mobile-menu-btn { display: flex; }
      .club-sidebar__close { display: flex; }
      .club-sidebar-overlay { display: block; }

      .club-sidebar {
        position: fixed !important;
        left: -100% !important;
        top: 0 !important;
        height: 100vh !important;
        width: 85% !important;
        max-width: 320px !important;
        z-index: 999 !important;
        overflow-y: auto !important;
        transition: left .28s cubic-bezier(0.22, 1, 0.36, 1) !important;
        padding-top: 60px !important;
      }
      .club-sidebar.is-open { left: 0 !important; }
      body.sidebar-open { overflow: hidden; }

      .club-main {
        margin-left: 0 !important;
        padding: 16px !important;
      }
      .club-main__header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .club-main__greeting { flex: 1; min-width: 0; }
      .club-main__greeting h1 { font-size: 1.3rem !important; }
      .club-main__greeting .date { font-size: .82rem !important; }

      .dashboard-grid {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
      }

      .notif-panel {
        right: 10px;
        left: 10px;
        width: auto;
        max-width: none;
        top: 62px;
      }
    }

    @media (max-width: 500px) {
      .club-main__greeting h1 { font-size: 1.1rem !important; }
      .notif-icon { width: 38px; height: 38px; font-size: 1.1rem; }
      .mobile-menu-btn { width: 38px; height: 38px; font-size: 1.2rem; }
    }

    /* ═══════════════ VIDEOS / WEBINARS / PDFs GRID ═══════════════ */
    .dash-mini-item {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      background: var(--zoo-bg-card, #171B20);
      border: 1px solid var(--zoo-border, #2A3038);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all .2s;
      margin-bottom: 8px;
    }
    .dash-mini-item:hover {
      border-color: rgba(232,163,23,0.4);
      transform: translateX(3px);
    }
    .dash-mini-item__thumb {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: 10px;
      background: var(--zoo-tint, #EAF2EC);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .dash-mini-item__body { flex: 1; min-width: 0; }
    .dash-mini-item__title {
      font-family: var(--zoo-font-display);
      font-weight: 700;
      color: var(--zoo-text, #fff);
      font-size: .95rem;
      margin: 0 0 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }
    .dash-mini-item__meta {
      color: var(--zoo-text-muted, #a0a8a4);
      font-size: .78rem;
    }
    .dash-webinar-date {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--zoo-amber, #E8A317);
      color: #1f1d17;
      min-width: 56px;
      padding: 8px 6px;
      border-radius: 10px;
    }
    .dash-webinar-date .day {
      font-family: var(--zoo-font-display);
      font-weight: 800;
      font-size: 1.2rem;
      line-height: 1;
    }
    .dash-webinar-date .month {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .dash-empty-mini {
      text-align: center;
      padding: 24px;
      background: var(--zoo-bg-card, #171B20);
      border: 1px dashed var(--zoo-border-strong, #3A424C);
      border-radius: 12px;
      color: var(--zoo-text-muted, #a0a8a4);
      font-size: .88rem;
    }

    /* La tarjeta "Invita amigos" y la rejilla de noticias tienen su estilo en club-inicio.css y club-noticias.css */
  </style>

  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;

      // Inicializar tema claro/oscuro (actualiza ícono del botón)
      ZOORIGEN_CLUB.initTheme();
      window.__zooSession = session;

      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('inicio', session);

      // Inicializar menú móvil (hamburguesa + sidebar responsive)
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();

      // Quien ya tiene membresía no necesita el curso sugerido por la guía de la portada: se borra.
      try { if (window.ZOO_CURSO_PREF && ZOORIGEN_CLUB.hasActiveMembership(session)) ZOO_CURSO_PREF.borrar(window.localStorage); } catch (e) { /* sin almacenamiento */ }

      // Secuencia de bienvenida (miembro nuevo) o prueba gratuita (miembro que vuelve). Nunca a admins.
      // No espera ni bloquea la página: si algo falla, el panel sigue igual.
      if (window.ZOO_ONBOARDING) { try { ZOO_ONBOARDING.iniciar({ session }); } catch (e) { console.warn('onboarding:', e); } }

      // Una sola cola de ventanas (club-cola.js): un solo overlay visible a la vez, por prioridad:
      // bienvenida -> nombre -> premio -> recorrido guiado -> prueba gratuita -> avisos del equipo -> paywall.
      const COLA = window.ZOO_COLA || null;
      const encolar = (item, respaldoMs) => {
        if (COLA) return COLA.encolar(item);
        return new Promise(r => setTimeout(() => r(item.mostrar()), respaldoMs || 600));
      };

      // Guía de bienvenida de siempre: solo si el módulo del recorrido guiado no está cargado.
      if (ZOORIGEN_CLUB.hasActiveMembership(session) && !window.ZOO_ONBOARDING) {
        encolar({ id: 'guia-vip', tipo: 'recorrido', vigente: () => !localStorage.getItem('zoo_onboard_done_' + session.uid), mostrar: () => new Promise(r => { ZOORIGEN_CLUB.showOnboarding(session); r(); }) }, 1500);
      }

      // Llegó desde el botón "?" de otra página: se abre el recorrido guiado aquí.
      if (window.ZOO_ONBOARDING && new URLSearchParams(window.location.search).has('guia')) {
        try { window.history.replaceState({}, '', 'club-dashboard.html'); } catch (e) { /* sin historial */ }
        encolar({ id: 'recorrido-pedido', tipo: 'recorrido', mostrar: () => ZOO_ONBOARDING.repetirRecorrido(session) });
      }

      const firstName = session.name.split(' ')[0];
      const esMiembro = ZOORIGEN_CLUB.hasActiveMembership(session);
      // Tarjeta de saludo: Jaguarito, frase según el estado y cifras con conteo ascendente (la racha solo para miembros).
      const saludo = ZOO_INICIO.pintarSaludo(document.getElementById('inicioSaludo'), firstName, new Date(), { conRacha: esMiembro });
      // Tarjeta de invitación: se monta ya con el código (se calcula con el UID); los invitados llegan después.
      const refCode = 'ZOO-' + session.uid.substring(0, 6).toUpperCase();
      window.__zooRefCode = refCode;
      const tarjetaInvita = ZOO_INICIO.montarInvita(document.getElementById('invitaCard'), refCode);

      // Solo mostrar banner si hay problema con el plan
      const pb = document.getElementById('pendingBanner');
      if (session.planStatus === 'cancelled_active') {
        pb.innerHTML = `<div class="status-banner cancelled"><span><svg class="zi" aria-hidden="true"><use href="#zi-hourglass"/></svg></span>Cancelaste la renovación; conservas acceso hasta ${ZOORIGEN_CLUB.formatShort(session.planVence)}. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Reanudar →</a></div>`;
      } else if (session.planStatus === 'expired' || session.planStatus === 'past_due') {
        pb.innerHTML = `<div class="status-banner cancelled"><span><svg class="zi" aria-hidden="true"><use href="#zi-lock"/></svg></span>${session.planStatus === 'past_due' ? 'No se confirmó el último pago.' : 'Tu membresía venció.'} Puedes seguir con la primera clase gratis. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Ver planes →</a></div>`;
      }
      // Para pending_payment, el banner dorado del paywall se muestra automáticamente

      // Modal de bienvenida solo primera vez
      if (ZOORIGEN_CLUB.hasActiveMembership(session)) {
        const welcomeKey = 'zoo_welcome_shown_' + session.uid;
        if (!localStorage.getItem(welcomeKey)) {
          encolar({
            id: 'bienvenida-vip', tipo: 'bienvenida',
            vigente: () => !localStorage.getItem(welcomeKey),
            mostrar: () => { localStorage.setItem(welcomeKey, 'yes'); return ZOORIGEN_CLUB.showWelcomeModal(session); }
          }, 600);
        }
      }

      // ═══════════════ BIENVENIDA USUARIO NUEVO SIN PAGAR ═══════════════
      // Viene con ?welcome=1 tras registrarse — mostrar mensaje motivador de exploración
      const urlParams = new URLSearchParams(window.location.search);
      // (Si está cargada la nueva secuencia de bienvenida —club-onboarding.js— ella reemplaza este mensaje.)
      if (urlParams.has('welcome') && !ZOORIGEN_CLUB.hasActiveMembership(session) && !window.ZOO_ONBOARDING) {
        setTimeout(() => {
          const welcomeOverlay = document.createElement('div');
          welcomeOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(12, 12, 12,0.92);backdrop-filter:blur(10px);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;animation:zooFadeIn .3s ease-out;';
          welcomeOverlay.innerHTML = `
            <div style="max-width:520px;width:100%;background:var(--zoo-solid, #1F5F3A);border:2px solid rgba(232,163,23,0.5);border-radius:22px;padding:36px 30px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.6);">
              <div style="font-size:4rem;margin-bottom:14px;"><img class="zi-logo" src="../assets/img/logo/logo.jpg" alt="Zoorigen" width="64" height="64"></div>
              <div style="display:inline-block;background:rgba(232,163,23,0.2);color:#E8A317;padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.12em;margin-bottom:14px;">¡BIENVENIDO, ${(session.name || 'nuevo miembro').split(' ')[0].toUpperCase()}!</div>
              <h2 style="font-family:var(--zoo-font-display);color:#fff;font-size:1.7rem;margin:0 0 12px;line-height:1.2;">Ya eres parte de Zoorigen <svg class="zi" aria-hidden="true"><use href="#zi-party-popper"/></svg></h2>
              <p style="color:rgba(255,255,255,0.9);font-size:.98rem;margin:0 0 22px;line-height:1.6;">Tu cuenta gratuita está lista. Elige tu curso de prueba gratuita en Cursos y, cuando quieras, activa una membresía para abrir todos los cursos.</p>

              <div style="background:rgba(0,0,0,0.25);border-radius:14px;padding:16px;margin-bottom:20px;text-align:left;">
                <div style="color:#E8A317;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;"><svg class="zi" aria-hidden="true"><use href="#zi-target"/></svg> ¿Qué puedes hacer ahora?</div>
                <div style="color:#fff;font-size:.88rem;line-height:1.85;">
                  <svg class="zi" aria-hidden="true"><use href="#zi-gift"/></svg> Elegir tu curso de prueba gratuita<br>
                  <svg class="zi" aria-hidden="true"><use href="#zi-newspaper"/></svg> Leer noticias de fauna y conservación<br>
                  <svg class="zi" aria-hidden="true"><use href="#zi-book-open"/></svg> Ver la guía de uso de la plataforma<br>
                  Suscribirte cuando quieras desbloquear todo
                </div>

              <div style="display:flex;gap:10px;flex-direction:column;">
                <button id="zooWelcomeExplore" style="background:var(--zoo-amber, #E8A317);border:0;color:#1f1d17;padding:14px 22px;border-radius:12px;cursor:pointer;font-family:var(--zoo-font-display);font-weight:800;font-size:.98rem;box-shadow:0 6px 18px rgba(232,163,23,0.3);"><svg class="zi" aria-hidden="true"><use href="#zi-leaf"/></svg> Explorar Zoorigen</button>
                <button id="zooWelcomeSubscribe" style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:12px 22px;border-radius:12px;cursor:pointer;font-family:var(--zoo-font-display);font-weight:700;font-size:.9rem;"><svg class="zi" aria-hidden="true"><use href="#zi-credit-card"/></svg> Suscribirme ahora (desde $199/mes)</button>
              </div>
            </div>
            <style>@keyframes zooFadeIn { from{opacity:0} to{opacity:1} }</style>
          `;
          document.body.appendChild(welcomeOverlay);
          document.getElementById('zooWelcomeExplore').addEventListener('click', () => {
            welcomeOverlay.remove();
            // Limpiar el query param de la URL
            window.history.replaceState({}, '', 'club-dashboard.html');
          });
          document.getElementById('zooWelcomeSubscribe').addEventListener('click', () => {
            welcomeOverlay.remove();
            window.location.href = 'club-suscripcion.html';
          });
        }, 800);
      }

      // Cargar datos desde Firestore (robusto: si uno falla, los demás siguen)
      const [cursos, proximaSesion, todosLosWebinars] = await Promise.all([
        ZOORIGEN_CLUB.getCursos().catch(e => { console.warn('getCursos falló:', e); return []; }),
        ZOORIGEN_CLUB.getProximaSesion().catch(e => { console.warn('getProximaSesion falló:', e); return null; }),
        ZOORIGEN_CLUB.getSesiones().catch(e => { console.warn('getSesiones falló:', e); return []; })
      ]);

      // Cifras de la tarjeta de título: cursos y clases (el avance se completa en pintarActividad)
      if (saludo) saludo.cifras({ cursos: cursos.length, clases: cursos.reduce((n, c) => n + ZOO_INICIO.totalClases(c), 0) });

      // ═══════════════ POPUP DE WEBINAR ═══════════════
      // Revisa TODOS los webinars próximos y muestra popup del PRIMERO que el usuario no haya visto.
      // Dos triggers:
      //  1) "MAÑANA" — el webinar es mañana o hoy (prioridad más alta)
      //  2) "NUEVO" — webinar nuevo que el usuario aún no ha visto el aviso
      // Cada aviso se muestra UNA SOLA VEZ por webinar (clave localStorage).
      const enVivoPronto = !!(window.ZOO_CONFIG && ZOO_CONFIG.clasesEnVivoPronto);
      if (!enVivoPronto && ZOORIGEN_CLUB.hasActiveMembership(session) && todosLosWebinars && todosLosWebinars.length > 0) {
        const ahora = new Date();
        let webinarParaMostrar = null;
        let tipoAviso = null;
        let clavePopup = null;
        let diasHasta = 0;

        // PRIMER PASO: buscar webinars que son "mañana" u "hoy" y no se haya avisado
        for (const w of todosLosWebinars) {
          const fecha = new Date(w.date);
          const d = Math.ceil((fecha - ahora) / (1000*60*60*24));
          if (d < 0) continue; // ya pasó
          if (d > 1) continue; // no es mañana ni hoy
          const wid = w.id || w.createdAt || w.date;
          const keyManana = `zoo_webinar_manana_${session.uid}_${wid}`;
          if (!localStorage.getItem(keyManana)) {
            webinarParaMostrar = w;
            tipoAviso = 'manana';
            clavePopup = keyManana;
            diasHasta = d;
            break;
          }
        }

        // SEGUNDO PASO: si no había "mañana", buscar webinars NUEVOS no vistos
        if (!webinarParaMostrar) {
          for (const w of todosLosWebinars) {
            const fecha = new Date(w.date);
            const d = Math.ceil((fecha - ahora) / (1000*60*60*24));
            if (d <= 1 || d > 60) continue; // solo futuros entre 2 y 60 días
            const wid = w.id || w.createdAt || w.date;
            const keyNuevo = `zoo_webinar_nuevo_${session.uid}_${wid}`;
            if (!localStorage.getItem(keyNuevo)) {
              webinarParaMostrar = w;
              tipoAviso = 'nuevo';
              clavePopup = keyNuevo;
              diasHasta = d;
              break;
            }
          }
        }

        if (webinarParaMostrar && tipoAviso) {
          const meetUrl = webinarParaMostrar.meetUrl || webinarParaMostrar.zoomUrl || '';

          // Textos según tipo de aviso
          const textos = tipoAviso === 'manana'
            ? {
                icono: '<svg class="zi" aria-hidden="true"><use href="#zi-bell"/></svg>',
                badge: diasHasta === 0 ? '¡HOY EN VIVO!' : '¡MAÑANA EN VIVO!',
                titulo: diasHasta === 0 ? 'Hoy es tu webinar · No faltes' : 'Mañana es tu webinar · No te lo pierdas',
                cta: 'Ver detalles del webinar',
                secondary: 'Cerrar aviso'
              }
            : {
                icono: '<svg class="zi" aria-hidden="true"><use href="#zi-party-popper"/></svg>',
                badge: '¡NUEVO WEBINAR!',
                titulo: 'Nuevo webinar agendado · ¡Apártate la fecha!',
                cta: 'Ver detalles del webinar',
                secondary: 'Cerrar aviso'
              };

          // Variable para el renderizado del popup (reemplaza proximaSesion)
          const webinarInfo = webinarParaMostrar;

          const mostrarPopup = () => new Promise((resolverPopup) => {
            const popup = document.createElement('div');
            popup.innerHTML = `
              <style>
                @keyframes webinarPopIn {
                  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
                  60% { transform: translate(-50%, -50%) scale(1.05); }
                  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                }
                @keyframes webinarBgIn {
                  from { opacity: 0; }
                  to { opacity: 1; }
                }
                @keyframes webinarShimmer {
                  0% { background-position: -200% 0; }
                  100% { background-position: 200% 0; }
                }
                @keyframes webinarLiveDot {
                  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 14px #ff4a4a; }
                  50% { opacity: 0.5; transform: scale(1.4); box-shadow: 0 0 20px #ff4a4a; }
                }
                @keyframes webinarWave {
                  0%, 100% { transform: translateY(0); }

                }
                .webinar-popup-bg {
                  position: fixed; inset: 0;
                  background: rgba(0,0,0,0.75);
                  backdrop-filter: blur(6px);
                  z-index: 99998;
                  animation: webinarBgIn .3s ease-out;
                }
                .webinar-popup-box {
                  position: fixed; top: 50%; left: 50%;
                  transform: translate(-50%, -50%);
                  width: 90%; max-width: 480px;
                  background: var(--zoo-panel, #1F5F3A);
                  border: 2px solid #E8A317;
                  border-radius: 24px;
                  padding: 36px 30px 30px;
                  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(232,163,23,0.3);
                  z-index: 99999;
                  animation: webinarPopIn .7s cubic-bezier(0.34, 1.56, 0.64, 1);
                  overflow: hidden;
                  max-height: 90vh;
                  overflow-y: auto;
                }
                .webinar-popup-box::before {
                  content: '';
                  position: absolute; inset: 0;
                  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
                  background-size: 200% 100%;
                  animation: webinarShimmer 3.5s ease-in-out infinite;
                  pointer-events: none;
                }
                .webinar-popup-close {
                  position: absolute; top: 14px; right: 14px;
                  background: rgba(0,0,0,0.3); color: #fff;
                  border: 0; width: 32px; height: 32px;
                  border-radius: 50%; font-size: 1rem;
                  cursor: pointer; z-index: 2;
                  display: flex; align-items: center; justify-content: center;
                  transition: all .2s;
                }
                .webinar-popup-close:hover { background: rgba(0,0,0,0.5); transform: rotate(90deg); }
                .webinar-popup-content { position: relative; z-index: 2; text-align: center; }
                .webinar-popup-icon {
                  color: #F7CB62;
                  font-size: 4rem; line-height: 1; margin-bottom: 8px;
                  animation: webinarWave 2s ease-in-out infinite;
                  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
                }
                .webinar-popup-badge {
                  display: inline-flex; align-items: center; gap: 8px;
                  background: rgba(255,74,74,0.2);
                  border: 1px solid rgba(255,74,74,0.5);
                  padding: 6px 14px; border-radius: 20px;
                  font-size: .75rem; font-weight: 800; color: #fff;
                  letter-spacing: .1em; text-transform: uppercase;
                  margin-bottom: 16px;
                }
                .webinar-popup-badge__dot {
                  width: 8px; height: 8px; background: #ff4a4a;
                  border-radius: 50%;
                  animation: webinarLiveDot 1.5s ease-in-out infinite;
                }
                .webinar-popup-title {
                  color: #E8A317;
                  font-family: var(--zoo-font-display);
                  font-size: 1.1rem; font-weight: 700;
                  letter-spacing: .05em;
                  margin-bottom: 6px;
                }
                .webinar-popup-name {
                  color: #fff;
                  font-family: var(--zoo-font-display);
                  font-size: 1.5rem; font-weight: 800;
                  line-height: 1.25; margin-bottom: 14px;
                  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
                }
                .webinar-popup-info-row {
                  display: flex; justify-content: center;
                  gap: 10px; flex-wrap: wrap;
                  margin-bottom: 20px;
                }
                .webinar-popup-chip {
                  background: rgba(0,0,0,0.3);
                  border: 1px solid rgba(255,255,255,0.15);
                  color: #fff;
                  padding: 7px 14px;
                  border-radius: 10px;
                  font-size: .84rem;
                  font-weight: 600;
                  backdrop-filter: blur(10px);
                }
                .webinar-popup-cta {
                  display: inline-flex; align-items: center; gap: 10px;
                  background: #fff; color: #1a73e8;
                  padding: 14px 26px; border: 0; border-radius: 12px;
                  font-family: var(--zoo-font-display); font-weight: 700;
                  font-size: 1rem; cursor: pointer; text-decoration: none;
                  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
                  transition: all .2s;
                }
                .webinar-popup-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
                .webinar-popup-cta__meet-icon {
                  width: 26px; height: 26px; background: #1a73e8;
                  border-radius: 6px;
                  display: flex; align-items: center; justify-content: center;
                  color: #fff; font-weight: 800; font-size: .75rem;
                }
                .webinar-popup-secondary {
                  display: block; margin: 14px auto 0;
                  color: rgba(255,255,255,0.7);
                  font-size: .84rem; text-decoration: underline;
                  cursor: pointer; background: none; border: 0;
                }
                .webinar-popup-secondary:hover { color: #fff; }
              </style>
              <div class="webinar-popup-bg" id="webinarPopupBg"></div>
              <div class="webinar-popup-box">
                <button class="webinar-popup-close" id="webinarPopupClose" aria-label="Cerrar"><svg class="zi" aria-hidden="true"><use href="#zi-x"/></svg></button>
                <div class="webinar-popup-content">
                  <div class="webinar-popup-icon">${textos.icono}</div>
                  <div class="webinar-popup-badge">
                    <span class="webinar-popup-badge__dot"></span>
                    ${textos.badge}
                  </div>
                  <div class="webinar-popup-title">${textos.titulo}</div>
                  <div class="webinar-popup-name">${webinarInfo.title}</div>
                  <div class="webinar-popup-info-row">
                    <div class="webinar-popup-chip"><svg class="zi" aria-hidden="true"><use href="#zi-user"/></svg> ${webinarInfo.speaker || 'Especialista'}</div>
                    <div class="webinar-popup-chip"><svg class="zi" aria-hidden="true"><use href="#zi-calendar"/></svg> ${ZOORIGEN_CLUB.formatShort(webinarInfo.date)}</div>
                    <div class="webinar-popup-chip"><svg class="zi" aria-hidden="true"><use href="#zi-clock"/></svg> ${webinarInfo.time || '19:00'} hrs</div>
                    <div class="webinar-popup-chip"><svg class="zi" aria-hidden="true"><use href="#zi-laptop"/></svg> Google Meet</div>
                  </div>
                  <a href="club-sesiones.html" class="webinar-popup-cta">
                    <span class="webinar-popup-cta__meet-icon">M</span>
                    ${textos.cta}
                  </a>
                  <button class="webinar-popup-secondary" id="webinarPopupDismiss">${textos.secondary}</button>
                </div>
              </div>
            `;
            document.body.appendChild(popup);

            const close = () => {
              popup.remove();
              localStorage.setItem(clavePopup, '1');
              resolverPopup();
            };
            document.getElementById('webinarPopupClose').addEventListener('click', close);
            document.getElementById('webinarPopupDismiss').addEventListener('click', close);
            document.getElementById('webinarPopupBg').addEventListener('click', close);
            // "Ver detalles" también cuenta como visto: el aviso no vuelve a salir en la siguiente carga.
            const cta = popup.querySelector('.webinar-popup-cta');
            if (cta) cta.addEventListener('click', () => { localStorage.setItem(clavePopup, '1'); });
          });
          // Pasa por la cola única: espera a la bienvenida, el nombre y el recorrido, y no sale si el aviso ya se vio.
          encolar({ id: 'webinar-' + clavePopup, tipo: 'avisos', vigente: () => !localStorage.getItem(clavePopup), mostrar: mostrarPopup }, 1500);
        }
      }
      // ═══════════════ FIN POPUP WEBINAR ═══════════════

      // ════════════════════════════════════════════
      // SISTEMA DE GAMIFICACIÓN
      // ════════════════════════════════════════════
      // Si el registro del invitado no alcanzó a llegar al servidor, se reintenta UNA vez (no bloquea nada).
      try { ZOORIGEN_CLUB.reintentarReferidoPendiente(auth.currentUser); } catch (e) { /* nada */ }

      // Aviso discreto "Confirma tu correo" (solo cuentas de correo y contraseña sin confirmar; Google no lo muestra).
      // Confirmarlo NO es requisito para usar el club.
      (function avisoConfirmarCorreo() {
        const u = auth.currentUser;
        if (!ZOORIGEN_CLUB.necesitaConfirmarCorreo(u)) return;
        const clave = 'zoo_aviso_correo_' + u.uid;
        try { const t = Number(localStorage.getItem(clave) || 0); if (t && Date.now() - t < 3 * 86400000) return; } catch (e) { /* sin almacenamiento */ }
        const I = window.ZOO_ICONOS_COM;
        const cont = document.getElementById('avisoCorreo');
        cont.innerHTML = `
          <div class="zc-aviso-correo" role="status">
            ${I.svg('mail', { size: 22 })}
            <div class="zc-aviso-correo__texto"><strong>Confirma tu correo</strong><span>Te enviamos un mensaje al crear tu cuenta. Confirmarlo protege tu cuenta; no es necesario para usar el club.</span></div>
            <div class="zc-aviso-correo__acciones">
              <button type="button" class="zc-btn zc-btn--suave zc-btn--chico" data-reenviar>Reenviar correo</button>
              <button type="button" class="zc-btn zc-btn--suave zc-btn--chico" data-listo>Ya lo confirmé</button>
              <button type="button" class="zc-aviso-correo__cerrar" data-cerrar aria-label="Descartar aviso">${I.svg('x', { size: 16 })}</button>
            </div>
            <p class="zc-aviso-correo__estado" data-estado aria-live="polite"></p>
          </div>`;
        const estado = cont.querySelector('[data-estado]');
        const btnReenviar = cont.querySelector('[data-reenviar]');
        const decir = (t) => { estado.textContent = t; };
        let espera = null;
        btnReenviar.addEventListener('click', async () => {
          btnReenviar.disabled = true;
          try {
            const envio = await ZOORIGEN_CLUB.enviarCorreoVerificacion(u);
            if (!envio.ok) throw Object.assign(new Error('envio'), { code: envio.motivo === 'demasiados' ? 'auth/too-many-requests' : 'envio' });
            decir('Listo, te enviamos otro correo. Revisa tu bandeja de entrada y la carpeta de spam.');
            let seg = 60;
            espera = setInterval(() => {
              seg--;
              if (seg <= 0) { clearInterval(espera); btnReenviar.disabled = false; btnReenviar.textContent = 'Reenviar correo'; }
              else btnReenviar.textContent = 'Reenviar en ' + seg + ' s';
            }, 1000);
          } catch (err) {
            btnReenviar.disabled = false;
            decir(err && err.code === 'auth/too-many-requests' ? 'Ya pediste varios correos. Espera unos minutos antes de intentar de nuevo.' : 'No pudimos enviar el correo ahora. Inténtalo más tarde.');
          }
        });
        cont.querySelector('[data-listo]').addEventListener('click', async () => {
          try { await u.reload(); } catch (e) { /* sin red */ }
          if (u.emailVerified) { cont.innerHTML = ''; }
          else decir('Todavía no aparece como confirmado. Abre el enlace del correo y vuelve a pulsar este botón.');
        });
        cont.querySelector('[data-cerrar]').addEventListener('click', () => {
          try { localStorage.setItem(clave, String(Date.now())); } catch (e) { /* nada */ }
          cont.innerHTML = '';
        });
      })();

      // El nivel ya no se dibuja en el Inicio (sigue en Mis logros). Aquí solo se piden en silencio los datos que usa
      // la tarjeta de saludo (racha de días) y "Tu actividad" (logros). Si el servidor falla, nada se rompe.
      let rachaDias = null;
      if (esMiembro) {
        ZOORIGEN_CLUB.fetchPremios(false).then((datos) => {
          window.__zooInicioPremios = datos;
          rachaDias = Math.max(0, Math.round(Number(datos && datos.racha) || 0));
          if (saludo) saludo.cifras({ racha: rachaDias });
          if (window.__zooInicioActividad) window.__zooInicioActividad();
        }).catch((err) => { console.warn('[Dashboard] premios:', err); });
      }

      // Tarjeta principal: "Continúa tu curso" / "Espera tu próximo curso" + "Tu siguiente meta" + accesos con números.
      const resume = document.getElementById('resumeCard');
      const pintarTarjetaCursos = async () => {
        const base = { cursos };
        if (!ZOORIGEN_CLUB.hasActiveMembership(session)) {
          const sin = ZOO_INICIO.elegirHero({ cursos, dias: 0, progreso: {} });
          const heroSin = cursos.length ? { tipo: 'continuar', curso: cursos[0], hechas: 0, total: ZOO_INICIO.totalClases(cursos[0]), resumen: sin.resumen } : sin;
          resume.innerHTML = ZOO_INICIO.widgetHTML(heroSin, { ahora: new Date() });
          if (saludo) saludo.estado(heroSin, null);
          return;
        }
        try {
          const [progreso, premios, prueba, mats] = await Promise.all([
            ZOORIGEN_CLUB.getCourseProgress(session.uid).catch(() => ({})),
            ZOORIGEN_CLUB.fetchPremios(false).catch(() => null),
            ZOORIGEN_CLUB.apiFetch('/api/prueba-gratuita').catch(() => null),
            ZOORIGEN_CLUB.apiFetch('/api/materiales').catch(() => null)
          ]);
          const est = ZOO_ACCESO.estadoPrueba(prueba);
          let hero;
          if (est.aplica) {
            // Con prueba gratuita elegida la ruta de desbloqueo es otra: aquí solo se muestra el curso elegido o se manda a Cursos.
            const elegido = cursos.find(c => c.id === est.elegida);
            const av = elegido ? ZOO_INICIO.avanceDe(progreso, elegido.id) : null;
            const resumen = ZOO_INICIO.elegirHero({ cursos, dias: 0, progreso }).resumen;
            hero = elegido && !av.terminado ? { tipo: 'continuar', curso: elegido, hechas: av.hechas, total: ZOO_INICIO.totalClases(elegido), resumen } : { tipo: 'terminado', resumen };
          } else {
            hero = ZOO_INICIO.elegirHero({ cursos, dias: ZOO_ACCESO.diasComoMiembro(session), adelantados: ZOO_ACCESO.adelantadosDeRespuesta(premios), progreso, desdeMs: ZOO_ACCESO.desdeMiembroMs(session) });
          }
          const lista = mats && Array.isArray(mats.materiales) ? mats.materiales : null;
          window.__zooInicioRetos = mats && Number.isFinite(mats.superados) ? mats.superados : 0;
          if (window.__zooInicioActividad) window.__zooInicioActividad();
          resume.innerHTML = ZOO_INICIO.widgetHTML(hero, { ahora: new Date(), pdfsAbiertos: lista ? lista.filter(x => x.desbloqueado).length : 0, pdfsTotal: lista ? lista.length : undefined });
          if (saludo) saludo.estado(hero, rachaDias !== null ? rachaDias : Math.max(0, Math.round(Number(premios && premios.racha) || 0)));
        } catch (e) {
          console.warn('[Dashboard] tarjeta de cursos:', e);
          const sin = ZOO_INICIO.elegirHero({ cursos, dias: 0, progreso: {} });
          const heroSin = cursos.length ? { tipo: 'continuar', curso: cursos[0], hechas: 0, total: ZOO_INICIO.totalClases(cursos[0]), resumen: sin.resumen } : sin;
          resume.innerHTML = ZOO_INICIO.widgetHTML(heroSin, { ahora: new Date() });
          if (saludo) saludo.estado(heroSin, null);
        }
      };
      pintarTarjetaCursos();

      // Columna derecha: clases en vivo, comunidad, descuento, tu actividad y tu presencia
      // Con las clases en vivo en "Próximamente" el widget solo lo dice: sin título, fecha ni cuenta regresiva.
      const sesionVisible = enVivoPronto ? null : proximaSesion;
      document.getElementById('asideVivo').innerHTML = ZOO_INICIO.vivoHTML(sesionVisible);
      if (sesionVisible) ZOORIGEN_CLUB.startCountdown('countdown', sesionVisible.date);
      document.getElementById('asideComunidad').innerHTML = ZOO_INICIO.comunidadHTML();
      // El descuento del 20% es un beneficio de miembros: quien no tiene membresía vigente no ve esta tarjeta.
      document.getElementById('asideDescuento').innerHTML = ZOORIGEN_CLUB.hasActiveMembership(session)
        ? ZOO_INICIO.descuentoHTML('https://wa.me/5212361113237?text=Hola%2C%20quiero%20aplicar%20mi%2020%25%20VIP')
        : '';
      const pintarActividad = async () => {
        let progreso = {};
        try { progreso = await ZOORIGEN_CLUB.getCourseProgress(session.uid); } catch (e) { progreso = {}; }
        const terminados = cursos.filter(c => progreso[c.id] && progreso[c.id].isCompleted === true).length;
        const enProgreso = cursos.filter(c => { const av = ZOO_INICIO.avanceDe(progreso, c.id); return av.hechas > 0 && !av.terminado; }).length;
        if (saludo) saludo.cifras({ enProgreso, completados: terminados });
        const prem = window.__zooInicioPremios || null;
        const logros = prem && Array.isArray(prem.logros) ? prem.logros : [];
        document.getElementById('asideActividad').innerHTML = ZOO_INICIO.actividadHTML({
          cursosHechos: terminados, cursosTotal: cursos.length, certificados: terminados,
          retos: window.__zooInicioRetos || 0, logros: logros.filter(l => l && l.ganado).length, logrosTotal: logros.length
        });
      };
      window.__zooInicioActividad = pintarActividad;
      pintarActividad();
      (async () => {
        let tiene = false;
        try { const d = await ZOORIGEN_CLUB.apiFetch('/api/directorio'); tiene = !!(d && d.mia); } catch (e) { tiene = false; }
        document.getElementById('asidePresencia').innerHTML = ZOO_INICIO.presenciaHTML(tiene);
      })();

      // Noticias del sector (las trae el servidor; si falla, el inicio sigue funcionando)
      (async () => {
        const nl = document.getElementById('newsList');
        try {
          const r = await ZOORIGEN_CLUB.apiFetch('/api/noticias?limit=8');
          ZOO_NOTICIAS.pintar(nl, Array.isArray(r && r.noticias) ? r.noticias : [], { max: 8 });
        } catch (err) {
          console.warn('[Dashboard] noticias:', err);
          ZOO_NOTICIAS.pintar(nl, [], { tituloVacio: 'No se pudieron cargar las noticias', mensajeVacio: 'Revisa tu conexión y vuelve a abrir el Inicio en un momento.' });
        }
      })();

      // ═══════════════ SISTEMA DE REFERIDOS ═══════════════
      try {
        await cargarReferidos(session, tarjetaInvita);
      } catch (e) { console.error('[Dashboard] Error cargarReferidos:', e); }
    })();

    // ═══════════════ TARJETA DE INVITACIÓN ═══════════════
    async function cargarReferidos(session, tarjeta) {
      // Código de referido: ZOO- + 6 primeras letras del UID. Es el mismo que usa el servidor.
      const refCode = window.__zooRefCode || ('ZOO-' + session.uid.substring(0, 6).toUpperCase());
      try { await db.collection('miembros').doc(session.uid).set({ refCode }, { merge: true }); } catch (e) { /* no es necesario */ }
      try {
        // Los invitados los cuenta el servidor (correo confirmado y dispositivo distinto); lo escrito en el navegador ya no cuenta.
        const r = await ZOORIGEN_CLUB.apiFetch('/api/referidos/estado', { headers: { 'X-Device-Id': ZOORIGEN_CLUB.getDeviceId() } });
        tarjeta.fijar(r);
      } catch (err) {
        console.warn('Error referidos:', err);
        tarjeta.error();
      }
    }
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
