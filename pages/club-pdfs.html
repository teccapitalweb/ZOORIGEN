<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFs · Club VIP Zoorigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="page-header"><h1>📄 PDFs y material descargable</h1><p>Guías de identificación, protocolos, fichas técnicas y manuales científicos</p></div>
      <div id="lockedNotice"></div>
      <div class="content-list" id="pdfsList"></div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('pdfs', session);
      if (session.planStatus !== 'active') {
        document.getElementById('lockedNotice').innerHTML = `<div class="status-banner" style="margin-bottom:20px;"><span>🔒</span>Activa tu membresía para descargar PDFs. <a href="club-suscripcion.html" style="color:inherit;text-decoration:underline;margin-left:6px;">Activar →</a></div>`;
      }
      const isActive = session.planStatus === 'active';
      document.getElementById('pdfsList').innerHTML = ZOORIGEN_CLUB.PDFS.map(p => `
        <div class="content-item">
          <div class="content-item__thumb" style="background:var(--zoo-blue);color:#fff;">${p.thumb}</div>
          <div class="content-item__info">
            <div class="content-item__title">${p.title}</div>
            <div class="content-item__meta">${p.area} · ${p.pages} páginas</div>
          </div>
          ${isActive
            ? `<a href="https://wa.me/5212361113237?text=Hola%2C%20soy%20VIP%20y%20quiero%20el%20PDF%3A%20${encodeURIComponent(p.title)}" target="_blank" class="content-item__tag">⬇ Descargar</a>`
            : `<a href="club-suscripcion.html" class="content-item__tag" style="background:var(--zoo-orange);color:#fff;">🔒 Activar</a>`}
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
