<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-apple-touch.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFs y materiales · Club VIP Zoorigen</title>
  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1F5F3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zoorigen">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css?v=20260820">
  <link rel="stylesheet" href="../assets/css/club-mobile.css?v=20260820">
  <link rel="stylesheet" href="../assets/css/club-theme.css?v=20260820">
  <link rel="stylesheet" href="../assets/css/club-shell.css?v=20261028-panel">
  <link rel="stylesheet" href="../assets/css/club-materiales.css?v=20261026-libro">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div id="lockedNotice"></div>
      <div id="materiales"><div class="mt-vacio"><span>Cargando…</span></div></div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/herramientas-iconos.js?v=20261029-iconos"></script>
  <script src="../assets/js/club.js?v=20261028-claro"></script>
  <script src="../assets/js/club-shell.js?v=20261028-panel"></script>
  <script src="../assets/js/club-avisos.js?v=20261024-avisos"></script>
  <script src="../assets/js/club-materiales.js?v=20261026-libro"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;

      // ═══ SOLO VIP ═══
      const isVIP = ZOORIGEN_CLUB.hasActiveMembership(session);
      if (!isVIP) {
        if (ZOORIGEN_CLUB.initTheme) ZOORIGEN_CLUB.initTheme();
        document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('pdfs', session);
        if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();
        // Ocultar contenido
        const main = document.querySelector('.club-main');
        if (main) {
          Array.from(main.children).forEach(el => {
            if (el.id !== 'sidebar' && !el.classList.contains('mobile-menu-btn')) el.style.display = 'none';
          });
        }
        ZOORIGEN_CLUB.showPaywall(session, 'descargar los PDFs y material científico');
        return;
      }

      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('pdfs', session);
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();
      ZOO_MATERIALES.montar({ sesion: session, club: ZOORIGEN_CLUB, contenedor: document.getElementById('materiales'), hrefRetos: 'club-retos.html' });
    })();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
</body>
</html>
