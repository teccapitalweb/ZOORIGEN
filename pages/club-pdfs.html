<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFs · Club VIP Zoorigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="page-header"><h1>📄 PDFs y material descargable</h1><p>Guías de identificación, protocolos, fichas técnicas y manuales científicos</p></div>
      <div id="lockedNotice"></div>
      <div class="content-list" id="pdfsList">Cargando...</div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;

      // ═══ SOLO VIP ═══
      const isVIP = session.planActivo === true || session.planStatus === 'active';
      if (!isVIP) {
        if (ZOORIGEN_CLUB.initTheme) ZOORIGEN_CLUB.initTheme();
        document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('pdfs', session);
        if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();
        // Ocultar contenido
        const main = document.querySelector('.club-main');
        if (main) {
          Array.from(main.children).forEach(el => {
            if (el.id !== 'sidebar' && !el.classList.contains('mobile-menu-btn')) el.style.display = 'none';
          });
        }
        ZOORIGEN_CLUB.showPaywall(session, 'descargar los PDFs y material científico');
        return;
      }

      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('pdfs', session);
      const pdfs = await ZOORIGEN_CLUB.getPdfs();
      const list = document.getElementById('pdfsList');
      if (pdfs.length === 0) {
        list.innerHTML = `<div style="text-align:center;padding:50px 20px;color:var(--zoo-text-dim);background:var(--zoo-bg-card);border-radius:var(--zoo-radius);">📄 Aún no hay PDFs disponibles. Pronto tendrás guías y manuales científicos.</div>`;
        return;
      }
      list.innerHTML = pdfs.map(p => `
        <div class="content-item">
          <div class="content-item__thumb" style="background:var(--zoo-blue);color:#fff;">📄</div>
          <div class="content-item__info">
            <div class="content-item__title">${p.title}</div>
            <div class="content-item__meta">${p.area || ''}${p.pages ? ' · ' + p.pages + ' páginas' : ''}</div>
          </div>
          ${p.driveId
            ? `<a href="https://drive.google.com/file/d/${p.driveId}/view" target="_blank" class="content-item__tag">⬇ Abrir</a>`
            : `<span class="content-item__tag" style="opacity:0.6;">Sin link</span>`}
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
