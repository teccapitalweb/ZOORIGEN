<body data-zoo="pdfs">

    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div id="lockedNotice"></div>
      <div id="materiales"><div class="mt-vacio"><span>Cargando…</span></div></div>
    </main>
  </div>

  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;

      // ═══ VISTA PREVIA PARA QUIEN NO ES MIEMBRO ═══
      // Quien no es miembro VE todo el catálogo (libros, guías, plantillas y presentaciones con sus portadas) y puede
      // explorar, buscar y cambiar de pestaña, pero NO puede usarlo: abrir, leer, descargar o guardar muestra el aviso
      // de membresía y lleva a Suscripción. Miembros y administradores: comportamiento de siempre.
      // (club-paywall.js: ZOO_PAYWALL; el contenido lo protege el servidor, que responde 403 a quien no es miembro.)
      ZOO_PAYWALL.iniciar({ sesion: session, club: ZOORIGEN_CLUB });
      if (ZOORIGEN_CLUB.initTheme) ZOORIGEN_CLUB.initTheme();

      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('pdfs', session);
      if (ZOORIGEN_CLUB.initMobileMenu) ZOORIGEN_CLUB.initMobileMenu();
      ZOO_MATERIALES.montar({ sesion: session, club: ZOORIGEN_CLUB, contenedor: document.getElementById('materiales'), hrefRetos: 'club-retos.html' });
    })();
  </script>
<script>
  // ===== PWA: registro del service worker =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(function (err) { console.warn('SW no registrado:', err); });
    });
  }
</script>
