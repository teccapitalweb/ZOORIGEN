<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil · Club VIP Zoorigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="page-header"><h1>👤 Mi perfil</h1><p>Información de tu cuenta como miembro VIP Zoorigen</p></div>
      <div class="card">
        <div class="profile-card">
          <div class="profile-avatar" id="avatar">V</div>
          <div class="profile-info">
            <h2 id="profileName">—</h2>
            <p id="profileEmail">—</p>
            <span class="vip-tag" id="vipTag">Miembro pendiente</span>
          </div>
        </div>
        <div class="info-row"><div class="info-row__label">Plan</div><div class="info-row__value">Miembro VIP · $199 MXN/mes</div></div>
        <div class="info-row"><div class="info-row__label">Estado</div><div class="info-row__value" id="profileStatus">—</div></div>
        <div class="info-row"><div class="info-row__label">WhatsApp</div><div class="info-row__value" id="profilePhone">—</div></div>
        <div class="info-row"><div class="info-row__label">Miembro desde</div><div class="info-row__value" id="profileSince">—</div></div>
        <div class="info-row"><div class="info-row__label">Próxima renovación</div><div class="info-row__value" id="profileRenew">—</div></div>
        <div class="info-row"><div class="info-row__label">Último pago</div><div class="info-row__value" id="profileLast">—</div></div>
        <div style="margin-top:24px;">
          <a href="https://wa.me/5212361113237?text=Hola%2C%20necesito%20ayuda%20con%20mi%20cuenta%20VIP%20Zoorigen" target="_blank" class="btn-club-outline" style="display:inline-block;width:auto;padding:12px 24px;margin:0;">💬 Hablar con soporte</a>
        </div>
      </div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('perfil', session);
      document.getElementById('avatar').textContent = ZOORIGEN_CLUB.getInitials(session.name);
      document.getElementById('profileName').textContent = session.name;
      document.getElementById('profileEmail').textContent = session.email;
      document.getElementById('profilePhone').textContent = session.phone || 'No registrado';
      const statusMap = {
        'active': '<span style="color:var(--zoo-green-500);">● Activa</span>',
        'pending_payment': '<span style="color:var(--zoo-amber);">⏳ Pago pendiente</span>',
        'cancelled': '<span style="color:var(--zoo-orange);">✕ Cancelada</span>'
      };
      document.getElementById('profileStatus').innerHTML = statusMap[session.planStatus] || '—';
      document.getElementById('profileSince').textContent = session.createdAt ? ZOORIGEN_CLUB.formatShort(session.createdAt) : '—';
      document.getElementById('profileRenew').textContent = session.planVence ? ZOORIGEN_CLUB.formatShort(session.planVence) : 'Pendiente';
      document.getElementById('profileLast').textContent = session.ultimoPago ? ZOORIGEN_CLUB.formatShort(session.ultimoPago) : 'Sin pagos aún';
      if (session.planStatus === 'active') document.getElementById('vipTag').textContent = 'Miembro VIP Activo';
      else if (session.planStatus === 'cancelled') document.getElementById('vipTag').textContent = 'Membresía cancelada';
    })();
  </script>
</body>
</html>
