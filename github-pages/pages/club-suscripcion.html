<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi suscripción · Club VIP Zoorigen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/club.css">
</head>
<body>
  <div class="club-layout">
    <aside class="club-sidebar" id="sidebar"></aside>
    <main class="club-main">
      <div class="page-header"><h1>💳 Mi suscripción</h1><p>Gestiona tu membresía VIP Zoorigen</p></div>
      <div id="subContent">Cargando...</div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/club.js"></script>
  <script>
    (async () => {
      const session = await ZOORIGEN_CLUB.requireAuth();
      if (!session) return;
      document.getElementById('sidebar').innerHTML = ZOORIGEN_CLUB.renderSidebar('suscripcion', session);
      const content = document.getElementById('subContent');
      let html = '';

      if (session.planStatus === 'pending_payment') {
        const checkoutMensual = buildCheckoutURL('mensual', session.email);
        const checkoutAnual = buildCheckoutURL('anual', session.email);
        html += `
          <div class="card" style="background:linear-gradient(135deg,rgba(232,163,23,0.12),rgba(213,90,40,0.08));border-color:var(--zoo-amber);margin-bottom:20px;">
            <h2 style="color:var(--zoo-amber);font-size:1.3rem;margin-bottom:10px;">⏳ Activa tu membresía VIP</h2>
            <p style="margin-bottom:20px;">Tu cuenta está creada. Elige tu plan y activa todos los beneficios VIP ahora mismo.</p>

            <div style="background:rgba(0,0,0,0.25);border:1px solid rgba(232,163,23,0.3);border-radius:10px;padding:14px 18px;margin-top:16px;">
              <div style="color:#fff;font-weight:600;font-size:.95rem;margin-bottom:6px;">💰 ¿Ya realizaste el pago?</div>
              <p style="color:var(--zoo-text-muted);font-size:.84rem;margin-bottom:12px;line-height:1.5;">
                Si ya pagaste pero tu membresía no se activó, presiona el botón para verificar tu pago manualmente.
              </p>
              <button id="verifyPaymentBtn" class="btn-club-outline" style="width:auto;padding:10px 22px;border:1px solid var(--zoo-amber);color:var(--zoo-amber);font-family:inherit;font-size:.92rem;cursor:pointer;">
                🔍 Verificar mi pago
              </button>
              <div id="verifyMsg" style="margin-top:10px;"></div>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;">

            <div class="card" style="border-color:var(--zoo-border-strong);">
              <div style="color:var(--zoo-green-500);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;">Plan Mensual</div>
              <div style="color:#fff;font-size:2.2rem;font-weight:800;font-family:'Poppins',sans-serif;line-height:1;margin-top:8px;">$199<span style="font-size:.9rem;color:var(--zoo-text-muted);font-weight:400;"> /mes</span></div>
              <p style="color:var(--zoo-text-muted);font-size:.88rem;margin-top:10px;margin-bottom:18px;">Facturación mensual · Cancela cuando quieras</p>
              <ul style="list-style:none;padding:0;margin:0 0 20px;font-size:.88rem;color:var(--zoo-text-muted);">
                <li style="padding:6px 0;">✓ Acceso completo 30 días</li>
                <li style="padding:6px 0;">✓ Renovación automática</li>
                <li style="padding:6px 0;">✓ 20% OFF en cursos</li>
              </ul>
              <button onclick="ZOORIGEN_CLUB.openCheckoutModal('mensual', '${session.email}')" class="btn-club-outline" style="display:block;width:100%;padding:12px;margin:0;border:1px solid var(--zoo-border-strong);font-family:inherit;font-size:1rem;cursor:pointer;">Pagar $199 mensual</button>
            </div>

            <div class="card" style="border:2px solid var(--zoo-amber);background:linear-gradient(135deg,rgba(232,163,23,0.1),rgba(31,95,58,0.2));position:relative;">
              <span style="position:absolute;top:-10px;right:16px;background:var(--zoo-amber);color:#1f1d17;padding:4px 12px;border-radius:12px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;">Ahorra 2 meses</span>
              <div style="color:var(--zoo-amber);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;">Plan Anual · Recomendado</div>
              <div style="color:#fff;font-size:2.2rem;font-weight:800;font-family:'Poppins',sans-serif;line-height:1;margin-top:8px;">$1,899<span style="font-size:.9rem;color:var(--zoo-text-muted);font-weight:400;"> /año</span></div>
              <p style="color:var(--zoo-text-muted);font-size:.88rem;margin-top:10px;margin-bottom:18px;">Equivale a <strong style="color:var(--zoo-green-500);">$158/mes</strong> · Ahorras $489 MXN</p>
              <ul style="list-style:none;padding:0;margin:0 0 20px;font-size:.88rem;color:var(--zoo-text-muted);">
                <li style="padding:6px 0;">✓ Acceso completo 365 días</li>
                <li style="padding:6px 0;">✓ Sin sorpresas de cobros mensuales</li>
                <li style="padding:6px 0;">✓ 20% OFF en cursos todo el año</li>
                <li style="padding:6px 0;">✓ <strong style="color:var(--zoo-amber);">2 meses gratis</strong></li>
              </ul>
              <button onclick="ZOORIGEN_CLUB.openCheckoutModal('anual', '${session.email}')" class="btn-club" style="display:block;width:100%;padding:14px;border:0;font-family:inherit;font-size:1rem;cursor:pointer;">Pagar $1,899 anual</button>
            </div>

          </div>

          <p style="text-align:center;color:var(--zoo-text-dim);font-size:.84rem;margin-top:18px;">🔒 Pago seguro procesado por Shopify · Tu membresía se activa automáticamente al completar el pago</p>`;
      } else {
        html += `
          <div class="card">
            <h2 style="color:#fff;font-size:1.2rem;margin-bottom:14px;">Plan actual</h2>
            <div class="info-row"><div class="info-row__label">Plan</div><div class="info-row__value">Miembro VIP Zoorigen</div></div>
            <div class="info-row"><div class="info-row__label">Precio</div><div class="info-row__value">$199 MXN / mes</div></div>
            <div class="info-row"><div class="info-row__label">Estado</div><div class="info-row__value">${session.planStatus === 'active' ? '<span style="color:var(--zoo-green-500);">● Activa</span>' : '<span style="color:var(--zoo-orange);">✕ Cancelada</span>'}</div></div>
            <div class="info-row"><div class="info-row__label">${session.planStatus === 'active' ? 'Próxima renovación' : 'Acceso hasta'}</div><div class="info-row__value">${ZOORIGEN_CLUB.formatShort(session.planVence)}</div></div>
            <div class="info-row"><div class="info-row__label">Último pago</div><div class="info-row__value">${session.ultimoPago ? ZOORIGEN_CLUB.formatShort(session.ultimoPago) : '—'}</div></div>
          </div>
          <div class="card" style="margin-top:20px;border-color:rgba(213,90,40,0.3);">
            <h2 style="color:var(--zoo-orange);font-size:1.1rem;margin-bottom:10px;">⚠️ Zona de peligro</h2>
            <p style="margin-bottom:16px;">${session.planStatus === 'active'
              ? 'Si cancelas tu membresía, mantienes el acceso hasta el final del período pagado. Después perderás acceso a biblioteca, sesiones y descuentos VIP.'
              : 'Reactiva tu membresía para volver a tener acceso completo a todo el contenido VIP.'}</p>
            ${session.planStatus === 'active'
              ? '<button class="btn-danger" id="cancelBtn">Cancelar membresía</button>'
              : `<button onclick="ZOORIGEN_CLUB.openCheckoutModal('mensual', '${session.email}')" class="btn-club" style="display:inline-block;width:auto;padding:12px 24px;border:0;font-family:inherit;font-size:1rem;cursor:pointer;">Reactivar por $199 MXN</button>`}
            <div id="cancelMsg" style="margin-top:14px;"></div>
          </div>`;
      }
      content.innerHTML = html;

      // ═══════════════ AUTO-CHECK: Verifica si el pago ya se procesó ═══════════════
      // Si viene con ?paid=1 en la URL (después de checkout), verificar cada 3s por hasta 60s
      const urlParams = new URLSearchParams(window.location.search);
      if (session.planStatus === 'pending_payment' && urlParams.has('paid')) {
        const autoMsg = document.createElement('div');
        autoMsg.style.cssText = 'position:fixed;top:20px;right:20px;background:linear-gradient(135deg,#1F5F3A,#2d7a4a);color:#fff;padding:14px 20px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:9999;font-weight:600;';
        autoMsg.innerHTML = '⏳ Verificando tu pago...';
        document.body.appendChild(autoMsg);

        let attempts = 0;
        const maxAttempts = 20; // 20 * 3s = 60s máximo
        const RAILWAY_URL = 'https://zoorigen-webhook-production.up.railway.app/api/verificar-pago';

        const checkPayment = async () => {
          attempts++;
          try {
            // 1. Intenta con el endpoint de Railway (consulta Firestore directo)
            const resp = await fetch(RAILWAY_URL, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ email: session.email })
            });
            const data = await resp.json();
            if (data.activo === true) {
              autoMsg.innerHTML = '🎉 ¡Pago confirmado! Redirigiendo...';
              autoMsg.style.background = 'linear-gradient(135deg,#E8A317,#D68A0A)';
              setTimeout(() => window.location.href = 'club-dashboard.html?paid=success', 1500);
              return true;
            }
          } catch (e) {
            // 2. Fallback: check directo a Firestore
            try {
              const doc = await db.collection('miembros').doc(session.uid).get();
              const data = doc.data() || {};
              if (data.planActivo === true || data.planStatus === 'active') {
                autoMsg.innerHTML = '🎉 ¡Pago confirmado! Redirigiendo...';
                setTimeout(() => window.location.href = 'club-dashboard.html?paid=success', 1500);
                return true;
              }
            } catch {}
          }

          // Actualizar mensaje
          autoMsg.innerHTML = `⏳ Verificando pago... (${attempts}/${maxAttempts})`;

          if (attempts >= maxAttempts) {
            autoMsg.innerHTML = '⚠️ El pago aún no se refleja. Usa el botón "Verificar mi pago".';
            autoMsg.style.background = 'linear-gradient(135deg,#D55A28,#b94820)';
            setTimeout(() => autoMsg.remove(), 5000);
            return true;
          }
          return false;
        };

        const autoCheck = setInterval(async () => {
          const done = await checkPayment();
          if (done) clearInterval(autoCheck);
        }, 3000);
        // Primera verificación inmediata
        checkPayment().then(done => { if (done) clearInterval(autoCheck); });
      }

      // ═══════════════ VERIFICAR PAGO MANUAL ═══════════════
      const verifyBtn = document.getElementById('verifyPaymentBtn');
      if (verifyBtn) {
        verifyBtn.addEventListener('click', async () => {
          const msgEl = document.getElementById('verifyMsg');
          verifyBtn.disabled = true;
          verifyBtn.textContent = '⏳ Verificando...';
          msgEl.innerHTML = '';

          try {
            // 1. Primero: Railway endpoint (lee directo de Firestore el email)
            const resp = await fetch('https://zoorigen-webhook-production.up.railway.app/api/verificar-pago', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ email: session.email })
            }).catch(() => null);

            if (resp && resp.ok) {
              const data = await resp.json();
              if (data.activo === true) {
                msgEl.innerHTML = `<div style="color:var(--zoo-green-500);background:rgba(111,191,115,0.1);border:1px solid rgba(111,191,115,0.3);padding:10px 14px;border-radius:8px;font-size:.88rem;">✅ ¡Pago encontrado! Redirigiendo al dashboard...</div>`;
                setTimeout(() => window.location.href = 'club-dashboard.html?paid=success', 1500);
                return;
              }
            }

            // 2. Fallback: revisar Firestore con el UID actual
            const doc = await db.collection('miembros').doc(session.uid).get();
            const data = doc.data() || {};

            if (data.planActivo === true || data.planStatus === 'active') {
              msgEl.innerHTML = `<div style="color:var(--zoo-green-500);background:rgba(111,191,115,0.1);border:1px solid rgba(111,191,115,0.3);padding:10px 14px;border-radius:8px;font-size:.88rem;">✅ ¡Pago encontrado! Redirigiendo...</div>`;
              setTimeout(() => window.location.href = 'club-dashboard.html?paid=success', 1500);
              return;
            }

            msgEl.innerHTML = `
              <div style="background:rgba(232,163,23,0.08);border:1px solid rgba(232,163,23,0.3);padding:14px;border-radius:8px;margin-top:6px;">
                <div style="color:var(--zoo-amber);font-weight:700;margin-bottom:8px;font-size:.92rem;">⚠️ Aún no recibimos la confirmación</div>
                <p style="color:var(--zoo-text-muted);font-size:.84rem;line-height:1.5;margin-bottom:10px;">
                  Si ya pagaste, espera 1-2 minutos y vuelve a presionar el botón.<br>
                  Si pasaron más de 5 minutos, envía captura de tu pago a soporte:
                </p>
                <a href="https://wa.me/5212361113237?text=Hola%2C%20ya%20pagu%C3%A9%20Club%20VIP%20Zoorigen%20pero%20no%20se%20activa.%20Mi%20email%3A%20${encodeURIComponent(session.email)}" target="_blank" style="display:inline-block;background:#25D366;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.88rem;">
                  💬 Contactar soporte por WhatsApp
                </a>
              </div>
            `;
            verifyBtn.disabled = false;
            verifyBtn.textContent = '🔍 Verificar mi pago';
          } catch (err) {
            console.error(err);
            msgEl.innerHTML = `<div style="color:var(--zoo-orange);font-size:.88rem;">Error al verificar. Intenta de nuevo.</div>`;
            verifyBtn.disabled = false;
            verifyBtn.textContent = '🔍 Verificar mi pago';
          }
        });
      }

      const cancelBtn = document.getElementById('cancelBtn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', async () => {
          if (!confirm('¿Seguro que quieres cancelar tu membresía VIP? Mantendrás acceso hasta ' + ZOORIGEN_CLUB.formatShort(session.planVence))) return;
          cancelBtn.disabled = true;
          cancelBtn.textContent = 'Cancelando...';
          const result = await ZOORIGEN_CLUB.cancelSubscription();
          const msg = document.getElementById('cancelMsg');
          if (result.ok) {
            msg.innerHTML = `<div class="success-msg show">✅ Cancelación procesada. Tienes acceso hasta ${ZOORIGEN_CLUB.formatShort(result.accesoHasta)}.</div>`;
            setTimeout(() => location.reload(), 2500);
          } else {
            msg.innerHTML = `<div class="error-msg show">⚠️ ${result.msg}</div>`;
            cancelBtn.disabled = false;
            cancelBtn.textContent = 'Cancelar membresía';
          }
        });
      }
    })();
  </script>
</body>
</html>
